# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# SPDX-License-Identifier: AGPL-3.0-or-later

# goreleaser v2 configuration for sqi.
#
# Produces cross-compiled binaries for linux, darwin, and windows on amd64 and
# arm64.  Version metadata is injected at link time via -ldflags so that
# `sqi-server version` and `sqi-worker version` print the exact tag, commit,
# build date, and Go toolchain version for every release artifact.
#
# Usage:
#   goreleaser release --clean            # full release against the current tag
#   goreleaser release --snapshot --clean # local snapshot without a git tag
#
# CI sets GITHUB_TOKEN (or GORELEASER_TOKEN) for GitHub release publishing.
# The Makefile `release` and `release-snapshot` targets wrap these two commands.

version: 2

project_name: sqi

# ── Pre-build hooks ───────────────────────────────────────────────────────────
#
# The web UI bundle must be built before the Go builds run so the server
# binaries (and the Docker images derived from them) embed the
# production-optimized web/dist/, not a stale or placeholder bundle.
# goreleaser hooks have no working-directory option, so npm --prefix is used
# to run inside web/ from the repository root.

before:
  hooks:
    - go mod download
    - go mod verify
    - npm --prefix web ci
    - npm --prefix web run build

# ── Builds ───────────────────────────────────────────────────────────────────
#
# CGO_ENABLED=0: modernc.org/sqlite is a pure-Go SQLite implementation —
# no C toolchain is needed for any target platform.
#
# ldflags mirror the Makefile LDFLAGS block.  GoVersion is not a goreleaser
# built-in; it is read from the GOVERSION env var exported by the release
# targets in the Makefile (e.g., GOVERSION=$(go version | awk '{print $3}')).

builds:
  - id: sqi-server
    binary: sqi-server
    main: ./cmd/sqi-server
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/uberware/sqi/internal/version.Version={{ .Tag }}
      - -X github.com/uberware/sqi/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/uberware/sqi/internal/version.BuildDate={{ .Date }}
      - -X github.com/uberware/sqi/internal/version.GoVersion={{ .Env.GOVERSION }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: sqi-worker
    binary: sqi-worker
    main: ./cmd/sqi-worker
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/uberware/sqi/internal/version.Version={{ .Tag }}
      - -X github.com/uberware/sqi/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/uberware/sqi/internal/version.BuildDate={{ .Date }}
      - -X github.com/uberware/sqi/internal/version.GoVersion={{ .Env.GOVERSION }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# ── Archives ─────────────────────────────────────────────────────────────────
#
# Both binaries are bundled into a single archive per platform so a single
# download provides the full sqi toolchain.  Linux and macOS use .tar.gz;
# Windows uses .zip.
#
# Naming convention: sqi_Linux_x86_64.tar.gz, sqi_Darwin_arm64.tar.gz, etc.

archives:
  - id: sqi
    builds:
      - sqi-server
      - sqi-worker
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os | title }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# ── Checksums ────────────────────────────────────────────────────────────────
#
# SHA-256 digest file covering all release artifacts.
# Adds cosign artifact signing on top of this.

checksum:
  name_template: checksums.txt
  algorithm: sha256

# ── Changelog ────────────────────────────────────────────────────────────────
#
# Lightweight Conventional-Commits grouping for the GitHub release body.
# Generates a persistent CHANGELOG.md file from this same history.

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^.*feat(\\(\\w+\\))?!?:.+$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix(\\(\\w+\\))?!?:.+$"
      order: 1
    - title: Performance
      regexp: "^.*perf(\\(\\w+\\))?!?:.+$"
      order: 2
    - title: Other Changes
      order: 999

# ── Docker images ────────────────────────────────────────────────────────────
#
# Builds linux/amd64 and linux/arm64 images for sqi-server and sqi-worker and
# pushes them to GHCR.  The pre-built binaries from the builds section above are
# copied into each image context by goreleaser; the respective
# Dockerfile.goreleaser files expect them at the context root.  Per-arch images
# are tagged with an -amd64/-arm64 suffix and combined into multi-arch manifest
# lists by the docker_manifests block below.
#
# Tags published per release (manifest lists spanning both arches):
#   ghcr.io/uberware/sqi/sqi-server:<full-tag>   e.g. v0.1.0
#   ghcr.io/uberware/sqi/sqi-server:v<major>     e.g. v0
#   ghcr.io/uberware/sqi/sqi-worker:<full-tag>
#   ghcr.io/uberware/sqi/sqi-worker:v<major>
#
# The :latest tag is published separately on every push to main by the
# docker-latest job in .github/workflows/ci.yml using the standalone
# multi-stage Dockerfiles.

dockers:
  - id: sqi-server-amd64
    goos: linux
    goarch: amd64
    ids: [sqi-server]
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-server:{{ .Tag }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-server:v{{ .Major }}-amd64"
    dockerfile: deploy/docker/Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

  - id: sqi-server-arm64
    goos: linux
    goarch: arm64
    ids: [sqi-server]
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-server:{{ .Tag }}-arm64"
      - "ghcr.io/uberware/sqi/sqi-server:v{{ .Major }}-arm64"
    dockerfile: deploy/docker/Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

  - id: sqi-worker-amd64
    goos: linux
    goarch: amd64
    ids: [sqi-worker]
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-worker:{{ .Tag }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-worker:v{{ .Major }}-amd64"
    dockerfile: deploy/docker/worker/Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

  - id: sqi-worker-arm64
    goos: linux
    goarch: arm64
    ids: [sqi-worker]
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-worker:{{ .Tag }}-arm64"
      - "ghcr.io/uberware/sqi/sqi-worker:v{{ .Major }}-arm64"
    dockerfile: deploy/docker/worker/Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

# Multi-arch manifest lists tying the per-arch images above into the clean tags
# that users pull (e.g. :v0.1.0 resolves to amd64 or arm64 automatically).
docker_manifests:
  - name_template: "ghcr.io/uberware/sqi/sqi-server:{{ .Tag }}"
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-server:{{ .Tag }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-server:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/uberware/sqi/sqi-server:v{{ .Major }}"
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-server:v{{ .Major }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-server:v{{ .Major }}-arm64"
  - name_template: "ghcr.io/uberware/sqi/sqi-worker:{{ .Tag }}"
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-worker:{{ .Tag }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-worker:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/uberware/sqi/sqi-worker:v{{ .Major }}"
    image_templates:
      - "ghcr.io/uberware/sqi/sqi-worker:v{{ .Major }}-amd64"
      - "ghcr.io/uberware/sqi/sqi-worker:v{{ .Major }}-arm64"

# ── SBOMs ────────────────────────────────────────────────────────────────────
#
# Software Bill of Materials generated by syft (must be in PATH at release
# time — the release workflow installs it via anchore/sbom-action before
# calling goreleaser).  One SPDX-JSON SBOM is produced per archive artifact
# and uploaded to the GitHub release alongside the archives.

sboms:
  - id: archive
    artifacts: archive
  - id: binary
    artifacts: binary

# ── Artifact signing ─────────────────────────────────────────────────────────
#
# Keyless cosign signing using GitHub Actions' OIDC identity token.
# Each archive and the checksum file are signed; the .sig and .pem files are
# uploaded to the GitHub release so consumers can verify with:
#   cosign verify-blob \
#     --certificate <artifact>.pem \
#     --signature   <artifact>.sig \
#     --certificate-identity-regexp "https://github.com/uberware/sqi/.*" \
#     --certificate-oidc-issuer    "https://token.actions.githubusercontent.com" \
#     <artifact>
#
# cosign must be in PATH — the release workflow installs it via
# sigstore/cosign-installer before calling goreleaser.
#
# Keyless (ambient OIDC) note: cosign v2 automatically detects the GitHub
# Actions OIDC environment via the ACTIONS_ID_TOKEN_REQUEST_URL and
# ACTIONS_ID_TOKEN_REQUEST_TOKEN env vars that GHA sets when id-token: write
# is granted.  No explicit --identity-token flag is needed; cosign reads the
# ambient credentials.  COSIGN_YES=true (set in the workflow env) suppresses
# the interactive confirmation prompt.
#
# Snapshot builds (goreleaser release --snapshot) skip signing automatically
# because the signs/docker_signs blocks are not executed without a real tag.

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

# ── Release ──────────────────────────────────────────────────────────────────
#
# GitHub release settings.  Owner/repo are auto-detected from the git remote;
# no hard-coded values here to avoid drift when the repo is forked or renamed.
# `prerelease: auto` marks any tag containing a pre-release identifier
# (e.g., v0.1.0-alpha) as a GitHub pre-release automatically.

release:
  draft: false
  prerelease: auto
