# sqi-worker configuration
#
# Copy this file to one of the default search locations and customise as needed:
#
#   ./config/sqi-worker.yaml          (next to the binary — recommended for dev)
#   ~/.sqi/sqi-worker.yaml            (user-level override)
#   /etc/sqi/sqi-worker.yaml          (system-wide installation)
#
# Or pass an explicit path:
#   sqi-worker start --config /path/to/sqi-worker.yaml
#
# Override order (highest wins):
#   built-in defaults → this file → SQI_WORKER_* environment variables → CLI flags
#
# Duration values use Go duration syntax: 30s, 1m30s, 500ms, 2h, etc.
#
# Validate configuration without connecting to the server:
#   sqi-worker start --dry-run

# ── NATS connection ───────────────────────────────────────────────────────────
# The worker connects to the NATS instance embedded in sqi-server. Either set
# nats.url explicitly or enable discovery.enable_mdns to locate the server
# automatically on the local network. Both may not be empty at the same time.
nats:
  # URL of the remote NATS server embedded in sqi-server.
  # Required when discovery.enable_mdns is false.
  # Example: "nats://sqi-server.local:4222"
  # Type: string   Env: SQI_WORKER_NATS_URL
  url: ""

  # Path to the client TLS certificate (PEM-encoded). Leave empty to disable
  # mutual TLS. Required only when the server demands client certificates.
  # Type: string   Env: SQI_WORKER_NATS_TLS_CERT_FILE
  tls_cert_file: ""

  # Path to the client TLS private key (PEM-encoded). Must be set together with
  # tls_cert_file.
  # Type: string   Env: SQI_WORKER_NATS_TLS_KEY_FILE
  tls_key_file: ""

  # Path to the CA certificate used to verify the server's TLS certificate
  # (PEM-encoded). Leave empty to use the system CA pool.
  # Type: string   Env: SQI_WORKER_NATS_TLS_CA_FILE
  tls_ca_file: ""

  # Skip TLS certificate verification. For development environments only.
  # Never set this to true in production — it defeats the purpose of TLS.
  # Type: bool   Env: SQI_WORKER_NATS_INSECURE_SKIP_VERIFY
  insecure_skip_verify: false

  # Maximum number of reconnection attempts before giving up.
  # -1 means retry indefinitely (recommended for long-running workers).
  # Reconnect attempts use exponential backoff with jitter starting at
  # reconnect_wait, so a storm of worker restarts does not overload the server.
  # Type: int   Env: SQI_WORKER_NATS_MAX_RECONNECT_ATTEMPTS
  max_reconnect_attempts: -1

  # Base wait duration between reconnection attempts. Actual wait uses
  # exponential backoff with jitter; this is the floor of that range.
  # Type: duration   Env: SQI_WORKER_NATS_RECONNECT_WAIT
  reconnect_wait: "2s"

  # Path to this worker's nkey seed file. Only meaningful when the server's
  # nats.auth.enabled is true. When empty, defaults to
  # <worker.data_dir>/worker.nk, and that default path is created by
  # enrollment or by `sqi-worker keygen`. Set this to a non-default path and
  # both paths honor it: `sqi-worker keygen` loads the same layered
  # configuration `sqi-worker start` does (this file, SQI_WORKER_NATS_CREDENTIAL_FILE,
  # and the root -c/--config flag) and writes wherever this field resolves,
  # and self-service enrollment writes to the same resolved path as part of
  # a live enrollment run. Must be mode 0600; writing it requires write
  # permission on the containing directory, not just the file, since the
  # write goes through a temp file plus rename.
  # Type: string   Env: SQI_WORKER_NATS_CREDENTIAL_FILE
  credential_file: ""

  # A worker enrollment token, used exactly once on first start to obtain a
  # credential. Ignored once credential_file already exists. Prefer
  # join_token_file over this field — a token in a config file is a secret
  # at rest.
  # Type: string   Env: SQI_WORKER_NATS_JOIN_TOKEN
  join_token: ""

  # Path to a file containing a join token. Takes precedence over join_token.
  # Type: string   Env: SQI_WORKER_NATS_JOIN_TOKEN_FILE
  join_token_file: ""

  # sqi-server HTTP base URL used for enrollment, e.g.
  # "http://sqi-server.example:8080". Enrollment runs over REST, not NATS:
  # the broker's job is to reject unauthenticated connections, so it cannot
  # also be the channel a worker gets its first credential over. REQUIRED
  # whenever a join token is configured, and NOT derived from mDNS
  # discovery: enrollment fails fast naming this field rather than
  # attempting a request with no host.
  # Type: string   Env: SQI_WORKER_NATS_SERVER_URL
  server_url: ""

# ── Worker identity and runtime behavior ─────────────────────────────────────
worker:
  # Human-readable name for this worker shown in the sqi-server web UI and logs.
  # Defaults to the machine hostname. Use a descriptive name on farms with many
  # workers of the same type, e.g. "render-gpu-01".
  # Type: string   Env: SQI_WORKER_NAME
  name: ""  # defaults to os.Hostname()

  # Farm this worker belongs to. When set, the worker only receives tasks
  # belonging to that farm. When empty (the default), the worker is
  # unaffiliated and accepts tasks from any farm — suitable for single-farm
  # or development setups. Set this when running workers across multiple
  # farms to prevent cross-farm task assignment.
  # Type: string   Env: SQI_WORKER_FARM_ID
  farm_id: ""

  # Directory used to persist the worker ID file (worker.id) ONLY. Created
  # automatically on first start, and never widened for run-as-user
  # traversal — it stays private (0700). The worker ID file ensures the
  # server can correlate this worker across restarts. Do not delete
  # worker.id unless you intend to re-register as a new worker.
  # Type: string   Env: SQI_WORKER_DATA_DIR
  data_dir: "~/.sqi/worker"  # Linux/macOS default; %APPDATA%\sqi\worker on Windows

  # Directory under which session working directories are created
  # (<session_dir>/<sessionID>/). Deliberately separate from data_dir: this
  # is ephemeral scratch that, when isolation (see below) is in use, must be
  # traversable by whichever run-as-user identity a session resolves to,
  # while data_dir holds the persistent worker-id and must stay private.
  # Left unset (the default), resolved at startup:
  #   - running as root: /var/lib/sqi-worker-sessions — a SIBLING of, never a
  #     descendant of, data_dir's own HOME-unset fallback (/var/lib/sqi-worker),
  #     so a 0700 data_dir can never end up an ancestor of the session root.
  #     Its ancestors are 0755 on every real distribution, so nothing needs
  #     widening.
  #   - otherwise: <data_dir>/sessions (0750), the pre-split location and
  #     mode — real run-as-user isolation cannot function without root
  #     regardless of directory permissions, so there is nothing to protect
  #     here.
  # Type: string   Env: SQI_WORKER_SESSION_DIR
  session_dir: ""

  # Named compute location (storage location name as configured in sqi-server)
  # where this worker's filesystem lives. Used for resolved-mode path mapping:
  # the server substitutes named storage locations in job definitions with the
  # concrete paths valid on this worker's host.
  # Leave empty if you are not using named storage locations.
  # Type: string   Env: SQI_WORKER_COMPUTE_LOCATION
  compute_location: ""

  # Arbitrary capability tags merged with auto-detected capabilities at
  # registration time. Use these to annotate software or hardware features that
  # the auto-detector cannot discover, such as installed DCC versions, licensed
  # plugins, or storage tier labels.
  # Auto-detected tags (always included): os, os_version, cpu_count, ram_mb,
  # gpu_vendor, gpu_model, gpu_vram_mb (when GPU is present).
  # Tags listed here overwrite an auto-detected tag with the same key.
  # Type: []string   Env: SQI_WORKER_CAPABILITY_TAGS (comma-separated)
  capability_tags: []
  # Examples:
  #   capability_tags:
  #     - maya-2025
  #     - arnold-7
  #     - gpu
  #     - highram

  # How often the worker publishes a heartbeat message to sqi-server. The server
  # uses heartbeat gaps to detect stale workers; this value should be shorter
  # than the server's scheduler.heartbeat_timeout (default 30s). At the default
  # of 15s the server receives two heartbeats per timeout window.
  # Must be > 0.
  # Type: duration   Env: SQI_WORKER_HEARTBEAT_INTERVAL
  heartbeat_interval: "15s"

  # Maximum time the worker waits for in-flight tasks to finish after receiving
  # SIGINT or SIGTERM before force-killing them. Tasks that do not complete
  # within this window receive SIGTERM then SIGKILL and are reported as failed.
  # Must be > 0.
  # Type: duration   Env: SQI_WORKER_SHUTDOWN_GRACE_PERIOD
  shutdown_grace_period: "30s"

  # Allow the worker to run as the root user on Linux and macOS. Disabled by
  # default because executing render processes as root is a security risk (see
  # docs/worker-configuration.md, "worker.allow_root"). Enable only when running
  # inside a container where root is expected, or when you accept the risk.
  # Type: bool   Env: SQI_WORKER_ALLOW_ROOT
  allow_root: false

  # Retain a session's working directory after a failed session (task cancellation,
  # non-zero task exit code, or environment setup error). Useful for post-mortem
  # inspection of partial outputs and environment state on a specific worker.
  # Disable in production to avoid filling the data directory on busy workers.
  # Type: bool   Env: SQI_WORKER_KEEP_FAILED_SESSIONS
  keep_failed_sessions: false

  # Restrict this worker to serving specific queue IDs. The worker keeps one
  # outstanding lease request per listed queue (work.lease.<workerID>.<queueID>). When
  # empty (the default) it issues a single lease request on the reserved
  # core-NATS subject work.lease.<workerID>._any — the server selects tasks farm-wide for
  # that token and gates by worker eligibility, so a queue-unaffiliated worker
  # is matched to any queue's ready work. Set this on heterogeneous farms where
  # some workers specialise in a subset of queues, e.g. separate GPU and CPU
  # queues.
  #
  # Each entry becomes a literal token in that subject, so it must be usable
  # as a single NATS subject token: an entry that is empty, or contains '.',
  # whitespace, '*' or '>', is rejected at load (a startup failure) rather
  # than producing lease requests the server silently refuses or never
  # answers.
  #
  # Type: []string   Env: SQI_WORKER_QUEUE_IDS (comma-separated)
  queue_ids: []
  # Examples:
  #   queue_ids:
  #     - gpu-renders
  #     - cpu-preview

  # DEPRECATED. Accepted by the config loader for backwards compatibility, but
  # it has NO EFFECT in the current lease-based worker — changing it tunes
  # nothing. Idle backoff is no longer needed: the worker's lease request
  # long-polls on the server (~30 s hold) and re-issues immediately on return,
  # so there is no tight polling loop to throttle. Only a negative value is
  # still rejected at load.
  # Type: duration   Env: SQI_WORKER_PULL_IDLE_BACKOFF
  pull_idle_backoff: "2s"

  # DEPRECATED. Accepted by the config loader for backwards compatibility, but
  # it has NO EFFECT in the current lease-based worker — changing it tunes
  # nothing. Pre-execution NACKs no longer apply: the server validates
  # eligibility before leasing, so the worker runs what it is given. Only a
  # negative value is still rejected at load.
  # Type: duration   Env: SQI_WORKER_PULL_NACK_DELAY
  pull_nack_delay: "5s"

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  # Minimum log level to emit.
  # Accepted: debug | info | warn | error
  # Use "debug" during initial deployment to verify registration and task flow.
  # Type: string   Env: SQI_WORKER_LOG_LEVEL   Flag: --log-level
  level: "info"

  # Log output format.
  # "json" is recommended for production (structured, machine-parseable by log
  # aggregators such as Loki, Splunk, or Datadog).
  # "text" is friendlier for interactive terminal use and local development.
  # Accepted: json | text
  # Type: string   Env: SQI_WORKER_LOG_FORMAT   Flag: --log-format
  format: "json"

# ── Local HTTP server (health probes and metrics) ─────────────────────────────
# The worker exposes a small HTTP server on loopback for container orchestration
# health probes (/healthz, /readyz) and Prometheus metrics (/metrics). This
# server is not exposed to the network by default and does not require
# authentication.
metrics:
  # TCP address the local HTTP server listens on.
  # Change only if port 9091 is in use on this host. Use "0.0.0.0:9091" to
  # expose the endpoints to Prometheus scrapers on the network (ensure the port
  # is firewalled appropriately).
  # Type: string   Env: SQI_WORKER_METRICS_ADDR
  addr: "127.0.0.1:9091"

  # Expose Go runtime profiling endpoints at /debug/pprof/.
  # Profiling data reveals memory layout, goroutine stacks, and CPU hotspots —
  # enable temporarily for performance diagnosis, never in long-term production.
  # Type: bool   Env: SQI_WORKER_METRICS_ENABLE_PPROF
  enable_pprof: false

# ── mDNS server discovery ─────────────────────────────────────────────────────
# When discovery is enabled and nats.url is empty, the worker browses for
# _sqi._tcp mDNS advertisements on the local network. The first discovered
# server's NATS address is used as the connection target. mDNS requires
# multicast, which is available on most LANs but not on cloud VPCs or
# cross-subnet networks.
discovery:
  # Enable mDNS-based sqi-server auto-discovery. When true and nats.url is
  # empty, the worker browses for "_sqi._tcp" services. Disable on networks
  # that prohibit multicast and always set nats.url explicitly instead.
  # Type: bool   Env: SQI_WORKER_DISCOVERY_ENABLE_MDNS
  enable_mdns: true

  # Maximum time to wait for an mDNS discovery result before giving up.
  # Increase if the server is slow to respond on a congested network.
  # Only relevant when enable_mdns is true.
  # Type: duration   Env: SQI_WORKER_DISCOVERY_MDNS_TIMEOUT
  mdns_timeout: "5s"

# ── Log chunk publisher ───────────────────────────────────────────────────────
# Controls how task process stdout/stderr is batched and streamed to sqi-server
# via NATS JetStream. Tune these values to balance NATS message
# overhead against how live the web UI log viewer feels.
log_streamer:
  # Maximum number of output lines batched into a single NATS message.
  # A flush is triggered immediately when the buffer reaches this count.
  # Increase for very verbose processes to reduce per-message overhead;
  # decrease for better granularity when watching live log output.
  # Type: int   Env: SQI_WORKER_LOG_STREAMER_MAX_LINES_PER_CHUNK
  max_lines_per_chunk: 50

  # Maximum total byte count of line content in a single NATS message.
  # A flush is triggered when the accumulated bytes meet or exceed this limit
  # after adding a line.  Guards against a single very long line producing an
  # oversized message.
  # Type: int   Env: SQI_WORKER_LOG_STREAMER_MAX_BYTES_PER_CHUNK
  max_bytes_per_chunk: 16384

  # Maximum time a line may sit in the buffer before being flushed by the
  # background goroutine regardless of the chunk size thresholds above.
  # Smaller values make the web UI log viewer feel more live at the cost of
  # more frequent small NATS publishes on slowly printing processes.
  # Type: duration   Env: SQI_WORKER_LOG_STREAMER_FLUSH_INTERVAL
  flush_interval: "500ms"

# ── Diagnostics ───────────────────────────────────────────────────────────────
# Controls publishing the worker's own structured (slog) output to sqi-server
# over core NATS, where it is surfaced in the web UI alongside server logs.
# This is the worker agent's operational log — distinct from task process
# output, which is always streamed via the log chunk publisher above.
diagnostics:
  # Enable diagnostic-log publishing. When true (the default) the worker's slog
  # records are mirrored to sqi-server in addition to local stderr output.
  # Type: bool   Env: SQI_DIAGNOSTICS_ENABLED
  enabled: true

# ── Local path staging (stage_locally delivery) ────────────────────────────────
# Used by jobs that declare the stage_locally delivery of the SQI_PATH_TRANSLATION
# extension. scratch_dir/sync_command are config-file only (no env var); defaults
# has an env var since cloud fleets may want to flip it without touching the image.
# staging:
#   # Base directory for per-attempt staged copies. Left unset (the default),
#   # falls back to <os.TempDir()>/sqi-staging when staging.defaults is true.
#   # Type: string   Env: — (config file only)
#   scratch_dir: /scratch/sqi
#
#   # Command template invoked per path, with {src}, {dest}, and optional
#   # {object_type} placeholders (e.g. "rsync -a {src} {dest}"). Left unset, or
#   # set to the sentinel "builtin", sqi copies the bytes itself instead of
#   # shelling out (local/dev convenience — not a substitute for a real
#   # sync_command on a farm spanning multiple compute locations).
#   # MUST NOT create hardlinks into scratch (e.g. "cp -al", "rsync
#   # --link-dest") when isolation (run-as-user) is in use: a hardlink IS the
#   # file, sharing one inode with whatever it links to — no chown or
#   # permission fix-up sqi applies to scratch can separate the two ever
#   # again. "rsync -a" and the builtin copy above are both safe (they copy
#   # bytes into a new inode).
#   # Type: string   Env: — (config file only)
#   sync_command: "rsync -a {src} {dest}"
#
#   # When true (the default), an otherwise-unconfigured worker still runs
#   # stage_locally jobs via TEMP scratch + the built-in copy above (one-time
#   # WARN logged). Set false to make an unconfigured worker fail stage_locally
#   # jobs immediately instead — the behavior every worker had before this key
#   # existed.
#   # Type: bool   Env: SQI_STAGING_DEFAULTS
#   defaults: true

# ── Capability auto-detection ─────────────────────────────────────────────────
# Built-in detectors for Maya, Nuke, Houdini, and Blender run automatically and
# advertise a presence tag (e.g. `maya`, plus `maya-2025`) when the app is found,
# so products that require attr.worker.tag.<app> match with no configuration.
# capabilities:
#   detect:                 # custom detectors for in-house tools
#     - tag: mytool
#       checks:
#         - exe: mytool     # found on PATH
#         - path_glob: "/opt/mytool*/bin/mytool"
#       version:
#         from: "mytool(?P<v>[0-9.]+)"
#   disable: [blender]      # turn off a built-in that misfires on this host
#                           # (also: SQI_WORKER_CAPABILITIES_DISABLE=blender,nuke)

# ── Run-as-user isolation ──────────────────────────────────────────────────────
# Runs job-supplied task and environment actions as a queue-configured OS user
# (protocol.AssignMsg.Isolation) instead of the worker daemon's own account.
# Off by default: with no queue configured for isolation, behavior is
# byte-for-byte unchanged from a worker with this section absent.
#
# Supported on POSIX (Linux/macOS) and Windows (via the logon_user provider).
# POSIX is verified against a real container (make test-isolation): setuid/
# setgid/supplementary groups, workdir chown/chmod, and the
# ancestor-traversability boot check. Windows is verified the same way by
# make test-isolation-windows (real local accounts, real NTFS ACLs, DPAPI
# credential storage, privileged tier as SYSTEM) — DPAPI credential storage,
# NTFS session-directory ACLs, and job-object process containment all pass.
# See docs/worker-configuration.md for full Windows setup and docs/auth.md's
# Known gaps for the open staging TOCTOU caveat.
# isolation:
#   # Exit at boot if this worker cannot assume another OS identity.
#   # POSIX: requires running as root. Windows: requires running as a service
#   # under LocalSystem (an elevated Administrator does NOT hold
#   # SeAssignPrimaryTokenPrivilege). Separate from a per-assignment resolution
#   # failure — this is "this worker is misconfigured", not "this queue's
#   # account is bad". Default false, so an unconfigured worker still starts.
#   # Type: bool   Env: SQI_WORKER_ISOLATION_REQUIRED
#   required: false
#
#   # Windows credential mechanism. "logon_user" is the only supported value;
#   # "s4u" is refused — its token carries no network credentials, so UNC and
#   # share access fail as ANONYMOUS inside the task. Ignored on POSIX.
#   # Provision each account's password with:
#   #   sqi-worker isolation set-credential <user>
#   # Type: string   Env: SQI_WORKER_ISOLATION_PROVIDER
#   provider: logon_user
#
#   # Daemon environment variable NAME patterns (filepath.Match globs) inherited
#   # by isolated tasks, in addition to the minimal base (PATH, HOME, TMPDIR,
#   # etc). Render farms typically need to pass through licensing variables here.
#   # Case-insensitive on Windows.
#   # Type: []string   Env: SQI_WORKER_ISOLATION_ENV_PASSTHROUGH (comma-separated)
#   env_passthrough: ["FLEXLM_*", "ADSKFLEX_*"]

# ── EXPR expression limits ────────────────────────────────────────────────────
# These five bound what ONE assignment may spend evaluating OpenJD EXPR
# expressions ON THIS HOST, at task-execution time — after the server has
# already accepted the job. They are separate from the server's own
# submission-time limits (sqi-server's openjd.expr_* keys); each worker reads
# its own, which is what lets a heterogeneous farm size them to each host's
# real memory.
#
# Read this before changing any of them:
#   * None of these bounds WALL CLOCK. An operation's real cost varies by
#     orders of magnitude between arithmetic and a regex over a large string,
#     so raising a limit lengthens the worst assignment this host can be asked
#     to resolve, roughly in proportion. No value makes a slow one impossible.
#   * operation_limit and assignment_positions MULTIPLY. The cumulative
#     operation ceiling for one assignment is their product; raising both
#     raises it twice over.
#   * The byte dimensions count cumulative ALLOCATION, not peak live retention.
#     A session that never holds more than a few MB at once is still charged
#     the sum of every environment it enters, so sizing host RAM against
#     assignment_retained_bytes over-provisions, and sizing it against an
#     observed RSS under-bounds it.
#   * TIGHTENING IS NOT FREE HERE THE WAY IT IS ON THE SERVER. Every one of
#     these five has a server-side limit metering the same values one phase
#     earlier, and this worker must not be TIGHTER than the server it reports
#     to:
#         operation_limit           >= server openjd.expr_operation_limit
#         memory_limit              >= server openjd.expr_memory_limit
#         assignment_positions      >= server openjd.expr_template_positions
#         assignment_retained_bytes >= server openjd.expr_template_retained_bytes
#         let_retained_bytes        >= server openjd.expr_template_retained_bytes
#     The last row pairs a per-table limit with a template-wide one, because the
#     server meters no per-table scope; a whole template's retained bytes is a
#     valid upper bound on any one of its tables, so the comparison is
#     conservative.
#     This worker advertises all five at registration and the server REFUSES TO
#     DISPATCH EXPR jobs to it while any of them is short — it does not accept
#     the job and then fail it here, once per task. The cost of tightening past
#     the server is therefore that this host stops being offered EXPR work
#     (only EXPR work; it keeps running everything else). The server logs the
#     reason when this worker registers, and flags any task no capable worker
#     exists for — the latter only while the server's unschedulable sweep is on
#     (its scheduler.unschedulable_grace > 0, the default); with the sweep off,
#     such a task waits with nothing written on it.
#
# An out-of-range value is a startup failure, not a clamp.
expr:
  # Operations (specification section 1.3.10) one expression may spend.
  # Type: int   Range: 10000-10000000   Env: SQI_WORKER_EXPR_OPERATION_LIMIT
  operation_limit: 1000000

  # Live bytes (specification section 1.3.9) one expression may hold. The
  # per-let-block structural ceiling is 50x this number — size RAM against
  # that product, not against this value alone.
  # Type: int   Range: 1000000-200000000   Env: SQI_WORKER_EXPR_MEMORY_LIMIT
  memory_limit: 20000000

  # Expression positions (a command, one args entry, one embedded file, one
  # variable value) one assignment may resolve, summed across the task's own
  # symbol table and every environment the session enters.
  # NOTE: must not be LOWER than the server's openjd.expr_template_positions.
  # An assignment's positions are a subset of its template's, so a lower value
  # here cannot run a job the server accepted — the server sees that from this
  # worker's registration and withholds EXPR work rather than failing it here.
  # Type: int   Range: 2000-100000   Env: SQI_WORKER_EXPR_ASSIGNMENT_POSITIONS
  assignment_positions: 10000

  # Bytes every let: block in one assignment may cumulatively retain, summed
  # across the task's table and every environment's.
  # Type: int   Range: 2000000-200000000
  # Env: SQI_WORKER_EXPR_ASSIGNMENT_RETAINED_BYTES
  assignment_retained_bytes: 20000000

  # Bytes ONE symbol table may hold live. Measured across the WHOLE table, so
  # a job whose own parameters are large spends budget its let: block never
  # asked for.
  # Type: int   Range: 1000000-100000000
  # Env: SQI_WORKER_EXPR_LET_RETAINED_BYTES
  let_retained_bytes: 10000000
