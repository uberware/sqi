# sqi-server configuration
#
# Copy this file to one of the default search locations and customise as needed:
#
#   ./config/sqi-server.yaml          (next to the binary — recommended for dev)
#   ~/.sqi/sqi-server.yaml            (user-level override)
#   /etc/sqi/sqi-server.yaml          (system-wide installation)
#
# Or pass an explicit path:
#   sqi-server serve --config /path/to/sqi-server.yaml
#
# Override order (highest wins):
#   built-in defaults → this file → SQI_* environment variables → CLI flags
#
# Duration values use Go duration syntax: 30s, 1m30s, 500ms, 2h, etc.

# ── HTTP ──────────────────────────────────────────────────────────────────────
http:
  # TCP address the REST API and WebSocket gateway listen on.
  # Use "127.0.0.1:8080" to restrict to loopback only.
  # Type: string   Env: SQI_HTTP_ADDR   Flag: --http-addr
  addr: "0.0.0.0:8080"

  # Expose Go runtime profiling endpoints at /debug/pprof/.
  # Profiling data reveals memory layout, goroutine stacks, and CPU hotspots —
  # never enable this on a server accessible to untrusted networks.
  # Enable temporarily on a loopback-only instance for performance diagnosis.
  # Default: false
  # Type: bool   Env: SQI_HTTP_ENABLE_PPROF
  enable_pprof: false

# ── NATS JetStream (embedded broker) ─────────────────────────────────────────
nats:
  # TCP address the embedded NATS server binds to.
  # Defaults to all interfaces (0.0.0.0) so that workers which discover the
  # server via mDNS can connect to NATS at the advertised LAN host. Set this
  # to "127.0.0.1:4222" to restrict NATS to loopback (single-machine only).
  # Note: broker authentication does not exist. Any host that can reach this
  # port can register as a worker and receive assignments. Deferred to Phase 4.
  # Type: string   Env: SQI_NATS_ADDR
  addr: "0.0.0.0:4222"

  # Directory used by JetStream for file-backed stream persistence.
  # Created at startup if it does not exist. Relative paths are resolved
  # from the working directory at the time sqi-server starts.
  # Type: string   Env: SQI_NATS_DATA_DIR
  data_dir: "data/nats"

  # Maximum disk space JetStream may use, in megabytes.
  # When the limit is reached, older messages are evicted per stream policy.
  # Type: int   Env: SQI_NATS_MAX_STORE_MB
  max_store_mb: 1024

# ── SQLite state store ────────────────────────────────────────────────────────
store:
  # Path to the SQLite database file. Created at startup if it does not exist.
  # For production, use an absolute path on a local SSD.
  # Type: string   Env: SQI_STORE_SQLITE_PATH
  sqlite_path: "sqi.db"

  # How often the background WAL checkpointer runs PRAGMA wal_checkpoint(TRUNCATE)
  # to fold committed WAL frames back into the main database file and truncate
  # the WAL. Without periodic checkpointing the WAL grows unboundedly under
  # write load. A final checkpoint always runs on clean shutdown regardless of
  # this interval. Set to a large value (e.g. "24h") to disable periodic
  # checkpointing while keeping the shutdown checkpoint.
  # Must be > 0.
  # Type: duration   Env: SQI_STORE_CHECKPOINT_INTERVAL
  checkpoint_interval: "5m"

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  # Minimum log level to emit.
  # Accepted: debug | info | warn | error
  # Type: string   Env: SQI_LOG_LEVEL   Flag: --log-level
  level: "info"

  # Log output format.
  # "json" is recommended for production (structured, machine-parseable).
  # "text" is friendlier for interactive development.
  # Accepted: json | text
  # Type: string   Env: SQI_LOG_FORMAT   Flag: --log-format
  format: "json"

# ── Scheduler ─────────────────────────────────────────────────────────────────
# Controls the task assignment loop and the background retention sweeps.
scheduler:
  # Duration after which a worker that has not sent a heartbeat is declared
  # offline. Its in-flight tasks are reclaimed and re-queued for assignment.
  # Must be > 0. For high-latency networks, increase to 60s or more.
  # Type: duration   Env: SQI_SCHEDULER_HEARTBEAT_TIMEOUT
  heartbeat_timeout: "30s"

  # How often the assignment loop wakes to match ready tasks to idle workers.
  # Lower values reduce assignment latency at the cost of more CPU. Most farms
  # work well at the default; reduce to 100ms only for sub-second task bursts.
  # Must be > 0.
  # Type: duration   Env: SQI_SCHEDULER_TICK_INTERVAL
  tick_interval: "500ms"

  # Maximum number of tasks that can be simultaneously assigned to a single
  # worker. The default of 1 is appropriate for rendering workloads that
  # saturate CPU/GPU. Increase for lightweight tasks that benefit from
  # in-process concurrency on the worker side.
  # Must be ≥ 1.
  # Type: int   Env: SQI_SCHEDULER_MAX_TASKS_PER_WORKER
  max_tasks_per_worker: 1

  # How long a worker that has stopped sending heartbeats may remain offline
  # before the retention sweep hard-deletes it, bounding the worker table on
  # farms with ephemeral nodes. Disabled and online workers are never
  # auto-removed. Set to 0 to disable automatic removal.
  # Type: duration   Env: SQI_SCHEDULER_OFFLINE_WORKER_RETENTION
  offline_worker_retention: "24h"

  # How long a terminal job is kept before the retention sweep hard-deletes it
  # and all of its data. completed and canceled jobs are always eligible; failed
  # jobs only when job_retention_include_failed is true. Set to 0 to disable
  # automatic deletion.
  # Type: duration   Env: SQI_SCHEDULER_JOB_RETENTION
  job_retention: "168h"

  # Extend the job retention sweep to failed jobs as well. Leave false to keep
  # failed jobs indefinitely for post-mortem inspection.
  # Type: bool   Env: SQI_SCHEDULER_JOB_RETENTION_INCLUDE_FAILED
  job_retention_include_failed: false

  # How long a ready task may wait with no eligible online worker before it is
  # flagged "unschedulable" (surfaced in the API/UI). 0 disables the sweep.
  # Type: duration   Env: SQI_SCHEDULER_UNSCHEDULABLE_GRACE
  unschedulable_grace: "30s"

  # Farm-wide default number of genuine attempts a task may make before it
  # goes terminal-failed. Farm/queue/job retry-policy overrides win over this
  # default (Server -> Farm -> Queue -> Job precedence). Must be >= 1; 1
  # disables auto-retry.
  # Type: int   Env: SQI_SCHEDULER_DEFAULT_MAX_ATTEMPTS
  default_max_attempts: 3

  # Backoff applied before a failed task re-enters the ready queue for
  # re-lease. 0 means immediate re-queue.
  # Type: duration   Env: SQI_SCHEDULER_RETRY_DELAY
  retry_delay: "30s"

  # Farm-wide default ceiling on a job's cumulative genuine task failures.
  # Once reached, the job is auto-parked (status=paused). 0 disables the
  # limit.
  # Type: int   Env: SQI_SCHEDULER_DEFAULT_FAILURE_LIMIT
  default_failure_limit: 0

# ── mDNS service discovery ────────────────────────────────────────────────────
discovery:
  # When true, sqi-server broadcasts a _sqi._tcp mDNS record so that workers
  # and the sqi CLI can discover it automatically on the local network without
  # manual address configuration.
  # Disable in environments that prohibit multicast (e.g. most cloud VPCs).
  # Type: bool   Env: SQI_DISCOVERY_ENABLED
  enabled: true

  # The mDNS service instance name advertised on the network.
  # Each sqi-server on the same subnet should use a distinct name.
  # Type: string   Env: SQI_DISCOVERY_INSTANCE_NAME
  instance_name: "sqi-server"

# ── OpenJD submission ─────────────────────────────────────────────────────────
openjd:
  # Enforce OpenJD's quantitative limits at submission time (maximum name
  # lengths, parameter/step/environment counts, reserved-name rules). Disable
  # only when onboarding templates that predate the strict limits and cannot yet
  # be updated.
  # Type: bool   Env: SQI_OPENJD_ENFORCE_LIMITS   Flag: --openjd-enforce-limits
  enforce_limits: true

  # ── EXPR expression limits ─────────────────────────────────────────────────
  # These four bound what ONE submitted job template may spend inside the
  # OpenJD expression-language checker. They matter because POST /api/v1/jobs
  # accepts a template of up to 4 MiB and, with auth off (the default), accepts
  # it anonymously.
  #
  # Read this before raising any of them:
  #   * None of these bounds WALL CLOCK. An operation's real cost varies by
  #     orders of magnitude between arithmetic and a regex over a large string,
  #     so raising a limit lengthens the worst request your farm can be asked
  #     to serve, roughly in proportion. There is no value of these settings
  #     that makes a slow request impossible.
  #   * expr_operation_limit and expr_template_positions MULTIPLY. The
  #     cumulative operation ceiling for one request is their product; raising
  #     both raises it twice over (at the maxima, 100x the default ceiling).
  #   * WORKER LIMITS. Each of these has a counterpart in every worker's own
  #     expr.* configuration, metering the same thing one phase later, and a
  #     worker must not be TIGHTER than this server:
  #         expr_operation_limit         <= worker expr.operation_limit
  #         expr_memory_limit            <= worker expr.memory_limit
  #         expr_template_positions      <= worker expr.assignment_positions
  #         expr_template_retained_bytes <= worker expr.assignment_retained_bytes
  #     Workers advertise their values at registration, and this server REFUSES
  #     TO DISPATCH an EXPR job to a worker that is tighter -- it does not
  #     accept the job and then fail it on the host. If you raise a limit here
  #     above a worker's counterpart, that worker stops being offered EXPR work
  #     (only EXPR work; it keeps running everything else), the reason is logged
  #     when it registers, and any task with no capable worker is flagged
  #     unschedulable with the two numbers named -- unless you have turned that
  #     sweep off (scheduler.unschedulable_grace <= 0), in which case such a
  #     task simply waits, with the registration log line as the only signal.
  #     Raise the workers first.
  #   * expr_template_retained_bytes counts cumulative ALLOCATION, not peak
  #     live retention. A template that never holds more than a few MB at once
  #     is still charged the sum of every let: block, so sizing a host's RAM
  #     against this number over-provisions, and sizing this number against an
  #     observed RSS under-bounds it.
  #
  # An out-of-range value is a startup failure, not a clamp.

  # Operations (specification section 1.3.10) one expression may spend.
  # Type: int   Range: 1000-100000   Env: SQI_OPENJD_EXPR_OPERATION_LIMIT
  expr_operation_limit: 10000

  # Live bytes (specification section 1.3.9) one expression may hold.
  # Type: int   Range: 4096-10000000   Env: SQI_OPENJD_EXPR_MEMORY_LIMIT
  expr_memory_limit: 1000000

  # Expression positions one template may contain, across the whole validation
  # pass. NOTE: your workers' own per-assignment position cap must not be
  # LOWER than this (see "worker limits" below).
  # Type: int   Range: 256-100000   Env: SQI_OPENJD_EXPR_TEMPLATE_POSITIONS
  expr_template_positions: 10000

  # Bytes a template's let: bindings may cumulatively retain in one pass.
  # Type: int   Range: 65536-100000000   Env: SQI_OPENJD_EXPR_TEMPLATE_RETAINED_BYTES
  expr_template_retained_bytes: 10000000

  # ── EXPR wall-clock backstop ───────────────────────────────────────────────
  # How long this server keeps evaluating ONE submission's expressions before
  # giving up on it.
  #
  # NOT IN EFFECT YET, like the four limits above: the EXPR extension's
  # registry status is "in-progress", so a template declaring
  # extensions: [EXPR] is rejected at submission before any expression is
  # evaluated. Set it now -- it is validated at startup and wired end to end
  # -- but no submission reaches it, and none of the 503s below can occur,
  # until that status flips.
  #
  # This is NOT a fifth limit. The four above decide whether a template is
  # VALID: a breach is deterministic, so the submitter is told their template
  # is wrong (HTTP 422) and retrying is pointless. This one decides only
  # whether THIS SERVER, on THIS request, keeps working -- the same template
  # would be accepted on an idle host -- so a breach reports that the server
  # gave up (HTTP 503) and a retry may well succeed.
  #
  # It exists because none of the four bounds TIME: specification section
  # 1.3.10 prices 256 bytes at one operation, so byte-heavy work is nearly
  # free in operations and expensive in seconds. Lower it if you would rather
  # shed load than serve a slow submission; raise it only if legitimate
  # templates are being refused with a 503.
  # Type: duration   Range: 1s-60s   Env: SQI_OPENJD_EXPR_SUBMISSION_DEADLINE
  expr_submission_deadline: 5s

# ── Diagnostics (in-memory log ring buffer) ──────────────────────────────────
diagnostics:
  # Maximum diagnostic-log records retained per component (the server plus each
  # worker), surfaced in the web UI and at GET /api/v1/diagnostics/logs. A
  # positive value is the per-component capacity. Set to 0 to disable
  # diagnostics entirely — no ring buffer, no worker.diag subscription, and the
  # REST endpoint returns 503 — when logs are collected out-of-band
  # (journald / Docker / Loki / etc.). Must not be negative.
  # Type: int   Env: SQI_DIAGNOSTICS_BUFFER_SIZE
  buffer_size: 1000

# ── Community preset library ──────────────────────────────────────────────────
preset_library:
  # JSON index URL for the community preset library browsed and installed from
  # the web UI (the raw index file, not a repo page). Leave empty to disable the
  # feature entirely. Defaults to the official sqi preset library.
  # Type: string   Env: SQI_PRESET_LIBRARY_URL
  url: "https://uberware.github.io/sqi-presets/index.json"
