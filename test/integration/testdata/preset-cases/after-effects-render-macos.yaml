#
# After Effects Render (macOS). macOS-only by hostRequirements, so its Tier-3
# case runs on macOS only. Linux CI runs the same sh wrapper, with the gate
# stripped, in TestPresetAfterEffects_WrapperFailsOnLoggedError.
#
# stub_inner: the task's own command is /bin/sh running the embedded aerender
# wrapper, an absolute path the stub cannot shadow on PATH, and replacing it
# would prove nothing about the wrapper anyway. The real /bin/sh runs; aerender
# is the stub, so expect_inner_argv pins the argv the wrapper hands aerender:
# that a scene path holding a space and an apostrophe arrives as one argument.
# Tier 3 runs `default` only; the other cases' inner argv states what the
# golden must show.
#
# The cases are after-effects-render-windows' with a POSIX scene path, since
# the two variants pass aerender the same arguments
# (internal/product/aftereffectspair_test.go). `default` is two tasks at the
# default ten frames per task. `movie-one-task` is the readme's movie rule:
# Frames Per Task at least the frame count keeps the whole range one aerender
# invocation. `stepped-range` shows a stepped range splitting into one
# single-frame task per frame, so -s and -e never span a frame the range
# excluded.
cases:
  - name: default
    params:
      SceneFile: '/Volumes/Show Files/spot/o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-20"
    stub_inner: true
    expect_tasks: 2
    expect_invocations:
      aerender: 2
    expect_inner_argv:
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "10", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "11", "-e", "20", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
  - name: movie-one-task
    params:
      SceneFile: '/Volumes/Show Files/spot/o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-240"
      FramesPerTask: "240"
    stub_inner: true
    expect_tasks: 1
    expect_invocations:
      aerender: 1
    expect_inner_argv:
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "240", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
  - name: stepped-range
    params:
      SceneFile: '/Volumes/Show Files/spot/o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-9:4"
    stub_inner: true
    expect_tasks: 3
    expect_invocations:
      aerender: 3
    expect_inner_argv:
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "1", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "5", "-e", "5", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "/Volumes/Show Files/spot/o'brien_v002.aep", "-rqindex", "2", "-s", "9", "-e", "9", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
