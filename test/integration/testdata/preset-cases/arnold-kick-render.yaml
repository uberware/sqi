#
# Arnold Kick Render. One task per frame, each rendering the scene file the
# frame number names. default shows #### padding and a frame number wider than
# the run (12345, written in full, never truncated); padding-and-step shows the
# run length setting the padding (######) over a stepped range.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_beauty.####.ass
      Frames: "1-3,12345"
    expect_tasks: 4
    expect_invocations:
      kick: 4
  - name: padding-and-step
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_beauty.######.ass
      Frames: "1001-1009:4"
    expect_tasks: 3
    expect_invocations:
      kick: 3
