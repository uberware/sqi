#
# Mistika Workflows Render. Ships chunks.defaultTaskCount 10; "1-24" does not
# divide by ten, so its balanced chunks (1-8, 9-16, 17-24) make the bounds
# derivation reviewable away from round numbers.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_conform_v003.rnd
      Frames: "1-24"
    expect_tasks: 3
    expect_invocations:
      workflows: 3
  - name: multi-frame-chunk
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_conform_v003.rnd
      Frames: "1-10"
    template_patch:
      step: Render
      chunks_default_task_count: 5
    expect_tasks: 2
    expect_invocations:
      workflows: 2
