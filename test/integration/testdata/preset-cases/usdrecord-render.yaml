#
# USD Record Render: hython runs the embedded launcher, which runs Houdini's
# usdrecord. Each task passes the chunk's first and last frame as --frames
# MIN:MAX. default omits --renderer and --camera and passes --imageWidth 960;
# options passes a renderer name with a space in it as one argument; and
# stepped-range splits into one-frame chunks.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_layout.usd
      OutputFile: /mnt/show/seq010/shot0010/review/shot0010.####.png
      Frames: "1-20"
      FramesPerTask: "10"
    expect_tasks: 2
    expect_invocations:
      hython: 2
  - name: options
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_layout.usd
      OutputFile: /mnt/show/seq010/shot0010/review/shot0010.####.png
      Frames: "1"
      Renderer: Karma CPU
      Camera: /World/cam
      ImageWidth: "1920"
    expect_tasks: 1
    expect_invocations:
      hython: 1
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_layout.usd
      OutputFile: /mnt/show/seq010/shot0010/review/shot0010.####.png
      Frames: "1-9:4"
    expect_tasks: 3
    expect_invocations:
      hython: 3
