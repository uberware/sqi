#
# V-Ray Standalone Render: each task passes its chunk as -frames=START-END.
# default is one frame per task; multi-frame-chunk uses 5-frame chunks;
# stepped-range splits into one task per frame.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_lighting.vrscene
      Frames: "1-3"
    expect_tasks: 3
    expect_invocations:
      vray: 3
  - name: multi-frame-chunk
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_lighting.vrscene
      Frames: "1-10"
    template_patch:
      step: Render
      chunks_default_task_count: 5
    expect_tasks: 2
    expect_invocations:
      vray: 2
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_lighting.vrscene
      Frames: "1-9:4"
    expect_tasks: 3
    expect_invocations:
      vray: 3
