#
# After Effects Render (Windows). Windows-only by hostRequirements, so its
# Tier-3 case runs on Windows only.
#
# stub_inner: the task's own command is powershell running the embedded
# aerender wrapper, and shadowing powershell would replace the wrapper and
# prove nothing about it. The real powershell runs; aerender is the stub, so
# expect_inner_argv pins the argv the wrapper hands aerender: that the
# dash-prefixed arguments after -File, and a scene path holding a space and an
# apostrophe, arrive unchanged. Tier 3 runs `default` only; the other cases'
# inner argv states what the golden must show.
#
# `default` is two tasks at the default ten frames per task. `movie-one-task`
# is the readme's movie rule: Frames Per Task at least the frame count keeps
# the whole range one aerender invocation. `stepped-range` shows a stepped
# range splitting into one single-frame task per frame, so -s and -e never
# span a frame the range excluded.
cases:
  - name: default
    params:
      SceneFile: 'C:\Show Files\spot\o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-20"
    stub_inner: true
    expect_tasks: 2
    expect_invocations:
      aerender: 2
    expect_inner_argv:
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "10", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "11", "-e", "20", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
  - name: movie-one-task
    params:
      SceneFile: 'C:\Show Files\spot\o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-240"
      FramesPerTask: "240"
    stub_inner: true
    expect_tasks: 1
    expect_invocations:
      aerender: 1
    expect_inner_argv:
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "240", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
  - name: stepped-range
    params:
      SceneFile: 'C:\Show Files\spot\o''brien_v002.aep'
      RenderQueueItem: "2"
      Frames: "1-9:4"
    stub_inner: true
    expect_tasks: 3
    expect_invocations:
      aerender: 3
    expect_inner_argv:
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "1", "-e", "1", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "5", "-e", "5", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
      - ["-project", "C:\\Show Files\\spot\\o'brien_v002.aep", "-rqindex", "2", "-s", "9", "-e", "9", "-v", "ERRORS_AND_PROGRESS", "-close", "DO_NOT_SAVE_CHANGES"]
