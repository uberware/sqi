#
# Husk USD Render: each task passes husk its chunk's first frame and count.
# default omits --renderer; multi-frame-chunk splits 1-10 unevenly (4, 3, 3);
# stepped-range splits into one-frame chunks; renderer passes --renderer.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_lighting.usd
      Frames: "1-3"
    expect_tasks: 3
    expect_invocations:
      husk: 3
  - name: multi-frame-chunk
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_lighting.usd
      Frames: "1-10"
    template_patch:
      step: Render
      chunks_default_task_count: 4
    expect_tasks: 3
    expect_invocations:
      husk: 3
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_lighting.usd
      Frames: "1-9:4"
    expect_tasks: 3
    expect_invocations:
      husk: 3
  - name: renderer
    params:
      SceneFile: /mnt/show/seq010/shot0010/usd/shot0010_lighting.usd
      Frames: "1"
      Renderer: BRAY_HdKarmaXPU
    expect_tasks: 1
    expect_invocations:
      husk: 1
