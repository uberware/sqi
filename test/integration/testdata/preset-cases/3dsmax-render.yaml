#
# 3ds Max Render. The preset is Windows-only (its step requires
# attr.worker.os.family = windows), so its Tier 3 case runs on Windows only.
# OutputPath defaults to "", which leaves -outputName: out (blank-output); the
# other cases supply one to keep the argument reviewable. The scene path contains a space so
# the goldens show it travelling as a single argument. stepped-range shows a
# gap-bearing range splitting into one chunk per run of consecutive frames, so
# -start: and -end: never span a frame the range excluded.
cases:
  - name: default
    params:
      SceneFile: 'C:\Show Files\seq010\shot0010_v003.max'
      Frames: "1-3"
      OutputPath: 'C:\renders\shot0010\beauty_.exr'
    expect_tasks: 3
    expect_invocations:
      3dsmaxcmd: 3
  - name: multi-frame-chunk
    params:
      SceneFile: 'C:\Show Files\seq010\shot0010_v003.max'
      Frames: "1-10"
      OutputPath: 'C:\renders\shot0010\beauty_.exr'
    template_patch:
      step: Render
      chunks_default_task_count: 5
    expect_tasks: 2
    expect_invocations:
      3dsmaxcmd: 2
  - name: stepped-range
    params:
      SceneFile: 'C:\Show Files\seq010\shot0010_v003.max'
      Frames: "1-9:4"
      OutputPath: 'C:\renders\shot0010\beauty_.exr'
    expect_tasks: 3
    expect_invocations:
      3dsmaxcmd: 3
  - name: blank-output
    params:
      SceneFile: 'C:\Show Files\seq010\shot0010_v003.max'
      Frames: "1-2"
    expect_tasks: 2
    expect_invocations:
      3dsmaxcmd: 2
