#
# Houdini ROP Render. This preset hands the whole chunk to its driver script as
# a range expression rather than a start/end pair, so the cases show what range
# syntax reaches the script: a plain contiguous range and a stepped one, each
# large enough to split into several chunks at the shipped
# chunks.defaultTaskCount of 10.
#
# The chunks are NONCONTIGUOUS, which sqi spells as a compact frame range
# (internal/openjd/expand.go, formatNoncontiguousChunk). The default case's
# 1-24 balances to 1-8, 9-16 and 17-24. The stepped case's 1-60:2 is thirty
# frames in three tasks of ten such as 1-19:2, each one hip load and one
# render call.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/scene/shot0010_fx_v004.hip
      Frames: "1-24"
      RopPath: /out/mantra_beauty
    expect_tasks: 3
    expect_invocations:
      hython: 3
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/scene/shot0010_fx_v004.hip
      Frames: "1-60:2"
      RopPath: /out/mantra_beauty
    expect_tasks: 3
    expect_invocations:
      hython: 3
