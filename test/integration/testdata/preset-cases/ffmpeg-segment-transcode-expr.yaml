#
# FFmpeg Segment Transcode (EXPR). The join needs no shell: the concat list is
# an embedded file whose body is generated by a comprehension over
# range(ceil(DurationSeconds / SegmentSeconds)). That makes the golden the only
# place the list and the slice names the Transcode step writes can be compared
# side by side, which is the whole point of reviewing this one.
#
# `default` matches ffmpeg_presets_test.go's 6s/2s geometry (3 slices + 1 join).
# `uneven-tail` uses 7s/2s: ceil(3.5) = 4 slices, a different task count, and
# the shape a truncating division would get wrong.
cases:
  - name: default
    params:
      SourceFile: /mnt/show/seq010/shot0010/movies/shot0010_source.mov
      OutputFile: /mnt/show/seq010/shot0010/movies/shot0010_h264.mp4
      DurationSeconds: "6"
      SegmentSeconds: "2"
    expect_tasks: 4
    expect_invocations:
      ffmpeg: 4
  - name: uneven-tail
    params:
      SourceFile: /mnt/show/seq010/shot0010/movies/shot0010_source.mov
      OutputFile: /mnt/show/seq010/shot0010/movies/shot0010_h264.mp4
      DurationSeconds: "7"
      SegmentSeconds: "2"
      AudioCodec: copy
    expect_tasks: 5
    expect_invocations:
      ffmpeg: 5
