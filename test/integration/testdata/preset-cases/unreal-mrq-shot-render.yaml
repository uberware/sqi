#
# Unreal Movie Render Queue Shot Render: unreal-mrq-job-render's job, one task
# per shot listed in Shots, each task's params.json naming its shot. Shapes as
# unreal-mrq-job-render.yaml; see its header. Windows-only, so Tier 3 and the
# outcome cases run on Windows only.
#
# default lists two shots, so it makes two tasks and runs the stub twice.
#
# quoting puts a single quote, a double quote, a backslash and spaces in the
# level sequence, both quotes and spaces in the output directory, and a double
# quote, a backslash, spaces and a non-ASCII letter in the shot, so params.json
# must escape them; TestPresetUnreal_ParamsJSONRoundTrips decodes it and
# compares the values. Shots is a LIST[STRING], given as its JSON text.
#
# The outcome cases list one shot and have the stub print one line and exit 0,
# so only the log checks can fail the task, as in unreal-mrq-job-render.yaml.
# A failed task is retried, so each outcome case runs the stub three times.
cases:
  - name: default
    params:
      SceneFile: 'C:\Projects\HeroFilm\HeroFilm.uproject'
      LevelSequence: /Game/Cinematics/Hero/SEQ_Hero
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh010", "sh020"]'
      OutputDirectory: 'C:\Renders\HeroFilm\SEQ_Hero'
    expect_tasks: 2
    expect_invocations:
      UnrealEditor-Cmd: 2
    stub_env:
      SQI_STUB_STDOUT: "SQI_RENDER: OK"
  - name: quoting
    params:
      SceneFile: 'C:\Projects\Hero Film\Hero Film.uproject'
      LevelSequence: '/Game/Cinematics/it''s the "hero" \ seq'
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh \"010\" \\ é"]'
      OutputDirectory: 'C:\Renders\Hero Film\it''s the "hero" shot'
    expect_tasks: 1
    expect_invocations:
      UnrealEditor-Cmd: 1
  - name: logged-error
    params:
      SceneFile: 'C:\Projects\HeroFilm\HeroFilm.uproject'
      LevelSequence: /Game/Cinematics/Hero/SEQ_Hero
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh010"]'
    expect_tasks: 1
    expect_invocations:
      UnrealEditor-Cmd: 3
    stub_env:
      SQI_STUB_STDOUT: '[2026.10.28-12.00.00:000][  0]LogPython: SQI_RENDER: FAILED: ValueError: the level sequence has no shot named "sh010"; its shots are "sh020"'
    expect_status: failed
    expect_reason: "matched failOn"
  - name: python-error
    params:
      SceneFile: 'C:\Projects\HeroFilm\HeroFilm.uproject'
      LevelSequence: /Game/Cinematics/Hero/SEQ_Hero
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh010"]'
    expect_tasks: 1
    expect_invocations:
      UnrealEditor-Cmd: 3
    stub_env:
      SQI_STUB_STDOUT: "[2026.10.28-12.00.00:000][  0]LogPython: Error: Traceback (most recent call last):"
    expect_status: failed
    expect_reason: "matched failOn"
  - name: executor-error
    params:
      SceneFile: 'C:\Projects\HeroFilm\HeroFilm.uproject'
      LevelSequence: /Game/Cinematics/Hero/SEQ_Hero
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh010"]'
    expect_tasks: 1
    expect_invocations:
      UnrealEditor-Cmd: 3
    stub_env:
      SQI_STUB_STDOUT: "Render Executor: Error: the render could not start"
    expect_status: failed
    expect_reason: "matched failOn"
  - name: no-success-line
    params:
      SceneFile: 'C:\Projects\HeroFilm\HeroFilm.uproject'
      LevelSequence: /Game/Cinematics/Hero/SEQ_Hero
      Map: /Game/Maps/Hero
      MovieRenderConfig: /Game/Cinematics/MRQ_Final
      Shots: '["sh010"]'
    expect_tasks: 1
    expect_invocations:
      UnrealEditor-Cmd: 3
    expect_status: failed
    expect_reason: "never printed"
