#
# RenderMan Render. One task per frame, each rendering the RIB file the frame
# number names; padding-and-step shows the run length setting the padding over
# a stepped range.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/rib/shot0010_beauty.####.rib
      Frames: "1-3"
    expect_tasks: 3
    expect_invocations:
      prman: 3
  - name: padding-and-step
    params:
      SceneFile: /mnt/show/seq010/shot0010/rib/shot0010_beauty.######.rib
      Frames: "1001-1009:4"
    expect_tasks: 3
    expect_invocations:
      prman: 3
