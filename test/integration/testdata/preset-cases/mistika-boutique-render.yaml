#
# Mistika Ultima & Boutique Render. Unlike the Maya and Blender presets this one
# ships chunks.defaultTaskCount 10, so the unpatched case already spans frames;
# "1-24" is chosen so the last chunk is a short tail (21-24) rather than a full
# ten, which is where an off-by-one in the bounds derivation would show.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-24"
    expect_tasks: 3
    expect_invocations:
      mistika: 3
  - name: multi-frame-chunk
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-10"
    template_patch:
      step: Render
      chunks_default_task_count: 5
    expect_tasks: 2
    expect_invocations:
      mistika: 2
  # Third case, and the only one here that is not about argv shape: a stepped
  # range at the shipped chunks.defaultTaskCount of 10 (the readme tells
  # operators to type "1-100:2" for every second frame). A CONTIGUOUS chunk never
  # spans a gap, so the range yields one single-frame -s/-e task per requested
  # frame (10 tasks for "1-20:2") and mistika never renders a frame the step
  # excluded. docs/openjd-extensions/sqi-chunk-bounds.md has the rule.
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-20:2"
    expect_tasks: 10
    expect_invocations:
      mistika: 10
