#
# Mistika Ultima & Boutique Render. Unlike the Maya and Blender presets this one
# ships chunks.defaultTaskCount 10, so the unpatched case already spans frames;
# "1-24" does not divide by ten, so it balances to 1-8, 9-16 and 17-24, where
# an off-by-one in the bounds derivation would show.
cases:
  - name: default
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-24"
    expect_tasks: 3
    expect_invocations:
      mistika: 3
  - name: multi-frame-chunk
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-10"
    template_patch:
      step: Render
      chunks_default_task_count: 5
    expect_tasks: 2
    expect_invocations:
      mistika: 2
  # A stepped range at the shipped chunks.defaultTaskCount of 10. A CONTIGUOUS
  # chunk never spans a gap, so "1-20:2" yields ten single-frame -s/-e tasks and
  # mistika never renders a frame the step excluded.
  # docs/openjd-extensions/sqi-chunk-bounds.md has the rule.
  - name: stepped-range
    params:
      SceneFile: /mnt/show/seq010/shot0010/render/shot0010_grade_v003.rnd
      Frames: "1-20:2"
    expect_tasks: 10
    expect_invocations:
      mistika: 10
