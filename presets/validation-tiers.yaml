# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Which validation tier each shipped preset and built-in product has actually
# reached. See docs/preset-library.md for what each tier proves.
#
# This file is verified, not declarative. internal/presettest and
# test/integration/preset_tiers_test.go refuse a claim that is not backed by a
# fixture, a golden, or a named test that actually ran — including a Tier-3
# claim whose case skipped on a platform listed in required_on. A tier here is a
# fact about the test suite, not an intention.
presets:
  - name: blender-batch-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Blender 4.x command-line documentation. The goldens show
        the documented ordering rule holding — -o/-s/-e all precede -a, which
        triggers the render — and chunk bounds 1-5 then 6-10 under a patched chunk
        size. No Blender has executed it, so the #### frame-padding token in -o and
        whether Blender appends its own extension to the supplied .png are
        unverified. A stepped or listed Frames range splits into one chunk per
        run of consecutive frames, so -s/-e never spans a frame the range
        excluded; neither golden here exercises one (houdini-rop-render's
        stepped-range golden shows the expansion).
    tier3:
      case: TestPresetTier3/blender-batch-render/default
      required_on: [linux, darwin, windows]

  - name: blender-view-layer-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, quoted-layer, stepped-range]
      caveat: >-
        argv derived from the Blender 4.5 manual's command-line arguments
        (arguments run in order, -a last, nothing after -- is parsed by Blender,
        --python-exit-code, -S) and from the Python API's ViewLayer.use. The
        view layer is selected by a fixed one-line Python expression that reads
        its name from sys.argv after --, so the goldens show the layer name as
        its own final argument and never inside the Python source. quoted-layer
        carries It's "Main" layer and a scene called Shot 010, each one argument.
        Chunk bounds and the 1-9:4 split behave as in blender-batch-render. No
        Blender has executed it, and Tier 3 proves only that the stub receives
        that argv, not that Blender honours use. Unverified: that
        bpy.context.scene is the scene -S selected when the expression runs; that
        a use=False layer is skipped by -a; that sys.exit with a message in a
        --python-expr stops Blender with a non-zero status before -a renders;
        that the expression's generator, which refers to a name bound in the
        --python-expr namespace, resolves it, which assumes Blender runs the
        expression with one shared globals/locals dict (a stub with separate
        dicts raised NameError); what -S does when the scene does not exist;
        the #### padding token in -o and whether Blender appends its own
        extension, as in blender-batch-render.
    tier3:
      case: TestPresetTier3/blender-view-layer-render/default
      required_on: [linux, darwin, windows]

  - name: maya-layer-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Autodesk's documented Maya Render command-line flags
        (Render -r <renderer> -s/-e -rl <layer> -rd <dir> <scene>). The goldens
        cover the shipped one-frame-per-task shape and a patched chunk size of 5
        (1-5 then 6-10, so both bound ends are reviewed). No Maya render session has
        executed it, so whether the chosen renderer honours -rl and -rd, and whether
        -r file resolves the scene's own renderer, are unverified. A stepped
        Frames range is not covered by these goldens; it splits into one chunk
        per run of consecutive frames, so -s/-e cannot span an excluded frame.
    tier3:
      case: TestPresetTier3/maya-layer-render/default
      required_on: [linux, darwin, windows]

  - name: maya-scene-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Autodesk's documented Maya Render command-line flags
        (Render -r <renderer> -s/-e -rd <dir> <scene>). Same coverage and same gaps
        as maya-layer-render, minus -rl: the goldens review the shipped
        one-frame-per-task shape and a patched chunk size of 5, and no Maya render
        session has executed either. Which layers Maya treats as renderable — the
        whole point of this variant — is not observable in argv at all.
    tier3:
      case: TestPresetTier3/maya-scene-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-boutique-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from SGO's documented Mistika Boutique/Ultima command-line
        invocation (mistika -r <scene> -s/-e). Weaker than the other
        documentation-derived claims here in one specific way: the command token
        itself (mistika) is unverified as well as its flags, because no Mistika
        installation has executed it and sqi has no in-application Mistika
        submitter to cross-check the convention against. This preset ships
        chunks.defaultTaskCount 10, but a stepped Frames range splits into one
        chunk per run of consecutive frames, so -s/-e never spans an excluded
        frame: mistika-boutique-render's stepped-range golden shows
        Frame=1-20:2 reaching the renderer as ten single-frame tasks (-s 1 -e 1,
        -s 3 -e 3, ...), at the cost of ten scene loads rather than one.
    tier3:
      case: TestPresetTier3/mistika-boutique-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-vr-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from SGO's documented Mistika VR command-line
        invocation (vr -r <scene> -s/-e). Weaker than the other
        documentation-derived claims here in one specific way: the command token
        itself (vr) is unverified as well as its flags, because no Mistika
        installation has executed it and sqi has no in-application Mistika
        submitter to cross-check the convention against. This preset ships
        chunks.defaultTaskCount 10, but a stepped Frames range splits into one
        chunk per run of consecutive frames, so -s/-e never spans an excluded
        frame: mistika-boutique-render's stepped-range golden shows
        Frame=1-20:2 reaching the renderer as ten single-frame tasks (-s 1 -e 1,
        -s 3 -e 3, ...), at the cost of ten scene loads rather than one.
    tier3:
      case: TestPresetTier3/mistika-vr-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-workflows-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from SGO's documented Mistika Workflows command-line
        invocation (workflows -r <scene> -s/-e). Weaker than the other
        documentation-derived claims here in one specific way: the command token
        itself (workflows) is unverified as well as its flags, because no Mistika
        installation has executed it and sqi has no in-application Mistika
        submitter to cross-check the convention against. This preset ships
        chunks.defaultTaskCount 10, but a stepped Frames range splits into one
        chunk per run of consecutive frames, so -s/-e never spans an excluded
        frame: mistika-boutique-render's stepped-range golden shows
        Frame=1-20:2 reaching the renderer as ten single-frame tasks (-s 1 -e 1,
        -s 3 -e 3, ...), at the cost of ten scene loads rather than one.
    tier3:
      case: TestPresetTier3/mistika-workflows-render/default
      required_on: [linux, darwin, windows]

  - name: houdini-rop-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from SideFX's documented hython command-line convention for
        driving a ROP via an embedded Python driver script. Stronger than the other
        render presets in one respect: the chunk syntax the driver must parse is
        visible in the golden alongside the parser itself, so the two can be
        read against each other. Its chunks are NONCONTIGUOUS, which sqi always
        writes as a flat comma list of single frames (1,2,...,10 in the default
        case; three tasks such as 1,3,...,19 for the stepped-range case's thirty
        frames), so no shipped expansion reaches the driver's lo-hi or :step
        branches. The driver merges each run of consecutive frames into one
        rop.render(frame_range=(lo, hi, 1)) call, so each run of consecutive
        frames in a chunk is one call: an unstepped chunk is one call, as it
        was before the switch to NONCONTIGUOUS, and a stepped range is one call
        per frame. A stub hou module checks that
        (TestHoudiniROPRender_DriverCoalescesFrameRuns), but that one call per
        run behaves as before is unverified on a real Houdini. No Houdini or
        hython installation has executed it: hou.hipFile.load, hou.node and
        RopNode.render(frame_range=...) are unexercised, and a golden cannot
        show that hython puts the script's own path in sys.argv[0].
    tier3:
      case: TestPresetTier3/houdini-rop-render/default
      required_on: [linux, darwin, windows]

  - name: nuke-write-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from Foundry's documented nuke -x batch-render flags
        (-X <write node> -F <frame list>); no Nuke installation has executed it.
        The stepped-range golden shows a stepped Frames range expanding to one
        single-frame task per requested frame (-F 1-1, -F 3-3, ...), because a
        CONTIGUOUS chunk never spans a gap, so -F never receives OpenJD's colon
        step syntax (1-19:2) where Foundry documents x (1-19x2). Whether Nuke
        reads -F 1-1 as the single frame 1 is unverified at Tier 1. It stays
        CONTIGUOUS because Foundry's Command Line Operations page documents -F
        only as one frame, a-b or a-bxN (repeating -F for more ranges), with no
        comma-list form, so sqi's flat NONCONTIGUOUS chunk (1,3,5) has no
        documented -F spelling and a stepped range still costs one task, and one
        script load, per frame.
    tier3:
      case: TestPresetTier3/nuke-write-render/default
      required_on: [linux, darwin, windows]

  - name: nuke-script-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from Foundry's documented nuke -x batch-render flags
        (-F <frame list>, rendering every enabled Write node); no Nuke installation
        has executed it, so which Write nodes are enabled — this variant's entire
        subject — is invisible in argv. Its stepped-range golden shows the same
        single-frame expansion as nuke-write-render's (-F 1-1, -F 3-3, ...), so
        no step separator reaches -F; whether Nuke reads -F 1-1 as one frame is
        unverified at Tier 1. It stays CONTIGUOUS for nuke-write-render's
        reason: Foundry documents no comma-list form of -F, so a flat
        NONCONTIGUOUS chunk (1,3,5) cannot reach Nuke and a stepped range still
        costs one task per frame.
    tier3:
      case: TestPresetTier3/nuke-script-render/default
      required_on: [linux, darwin, windows]

  # Standalone renderers: each renders an exported scene description without
  # the application that wrote it. Every argv below is derived from vendor
  # documentation and has not run against a real renderer; Tier 3 drives a
  # stub through the real worker path.
  - name: arnold-kick-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from kick's help text (-i, -dw, -dp, -v); no Arnold
        installation has executed it. No stdin or crash-dialog flag is passed;
        the worker gives kick a null stdin. The goldens show the scene-pattern
        substitution: #### padding with 12345 written in full, not truncated,
        and a ###### run setting six-digit padding over a stepped range. A
        pattern with no run of # or with two runs is rejected at submission
        (TestPerFilePresets_RejectABadScenePattern). Unverified: licensing, and
        whether the exported .ass carries the output paths the user expects.
    tier3:
      case: TestPresetTier3/arnold-kick-render/default
      required_on: [linux, darwin, windows]

  - name: vray-standalone-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from Chaos's V-Ray Standalone documentation and vray -h:
        -sceneFile, -frames=START-END (inclusive), -display=0 (no frame
        buffer), -autoClose=1 (exit when done), and -progressUseColor=0 with
        -progressUseCR=0 (plain, newline-terminated progress lines). No V-Ray
        installation has executed it. The goldens show the chunk bounds at the
        shipped one frame per task, at a patched chunk size of 5 (-frames=1-5
        then -frames=6-10), and a stepped range as single-frame tasks
        (-frames=1-1, 5-5, 9-9), so -frames never spans an excluded frame.
        Unverified: licensing, and whether the .vrscene's own output settings
        are what the user expects.
    tier3:
      case: TestPresetTier3/vray-standalone-render/default
      required_on: [linux, darwin, windows]

  - name: husk-usd-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, renderer]
      caveat: >-
        argv derived from SideFX's husk documentation for Houdini 22.0:
        --renderer, --frame, --frame-count, --make-output-path, --no-mplay,
        -V 2a (line-per-update progress), and the USD stage as a positional
        argument. No Houdini installation has executed it. The start frame and
        count are computed with EXPR (min and len of the chunk's range),
        because SQI_CHUNK_BOUNDS's .Start/.End do not resolve on an EXPR
        range_expr. The goldens show them at one frame per task, across an
        uneven tail at a patched chunk size of 4 (1/4, 5/4, 9/2), and over a
        stepped range (each --frame-count 1). With the Hydra Delegate empty no
        --renderer is passed and husk uses the stage's husk:delegate render
        setting; the renderer case shows the flag when a delegate is named.
        Its BRAY_HdKarmaXPU is an example, not a verified delegate name.
        Unverified: licensing and the stage's render products.
    tier3:
      case: TestPresetTier3/husk-usd-render/default
      required_on: [linux, darwin, windows]

  - name: redshift-standalone-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step, windows-path]
      caveat: >-
        argv derived from Maxon's redshiftCmdLine documentation: one exported
        .rs file per frame, every other option (-oip, -gpu, -cachepath, ...)
        an override, so the preset passes the scene file alone. No Redshift
        installation has executed it. The goldens show the shared
        scene-pattern substitution; the windows-path case shows a native
        C:\... pattern reaching the renderer intact. A bad pattern is rejected
        at submission. Scheduling gates on the redshift install tag, not on a
        detected GPU: sqi's GPU probe sees only NVIDIA on Linux, and Redshift
        also renders on Windows and Apple Silicon. The operator excludes a host
        with no usable GPU (capabilities.disable). Unverified: licensing,
        device selection and exit codes.
    tier3:
      case: TestPresetTier3/redshift-standalone-render/default
      required_on: [linux, darwin, windows]

  - name: prman-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from Pixar's prman documentation: -Progress (one progress
        line per update) and the RIB file as a positional argument. -t and
        -cwd are not passed, so prman uses every core and the task's working
        directory. No RenderMan installation has executed it. The goldens show
        the shared scene-pattern substitution; a bad pattern is rejected at
        submission. Unverified: licensing, and how RenderMan 27 chooses
        between RIS and XPU for a command-line render.
    tier3:
      case: TestPresetTier3/prman-render/default
      required_on: [linux, darwin, windows]

  - name: arnold-kick-tile-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, uneven]
      caveat: >-
        argv derived from kick's help text (-r resolution, -rg minx miny maxx
        maxy render region, -o output) and OpenImageIO's oiiotool
        documentation (--paste:mergeroi=1:all=1 +0+0 pastes every image on the
        stack at its data-window offset into one image sized to their union).
        No Arnold installation has executed it. The goldens show every tile's
        region, its output path and the generated assembly list; the uneven
        case shows a width 3 does not divide split with no gap or overlap
        (0-332, 333-665, 666-999), and
        TestArnoldKickTileRender_RegionsPartitionTheImage checks further
        sizes. Unverified: that -rg bounds are inclusive pixel coordinates,
        that the y-origin is the top edge, and that kick writes a region
        render as a full display window with a region-sized data window, which
        --paste depends on; if kick writes full-size pixels outside the
        region, the last tile pasted wins. A bad pattern, or more tiles than
        pixels in either direction, is rejected at submission. Assembly waits
        for the whole Render step; jobtemplate-2023-09 has no task-level
        dependencies. The Assemble step's tile list is built at submission, so
        its cost grows with the grid: the largest grid, 16 x 16, costs 536
        operations and 16,448 live bytes, inside the default server EXPR
        limits. With openjd.expr_memory_limit at its 4,096-byte floor, the
        largest square grid that submits is 7 x 7, whatever the output path's
        length. TestArnoldKickTileRender_GridCostAtTheLimits pins both
        figures.
    tier3:
      case: TestPresetTier3/arnold-kick-tile-render/default
      required_on: [linux, darwin, windows]

  - name: 3delight-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from 3Delight's "Rendering NSI file" documentation
        (renderdl -progress <file.nsi>). renderdl documents no frame-range
        option and renders one .nsi file per frame, so this preset uses the
        per-file shape, not chunk bounds. -t is not passed, so renderdl uses
        every core. No 3Delight installation has executed it. The goldens show
        the shared scene-pattern substitution; a bad pattern is rejected at
        submission. Unverified: licensing and the handling of a separate
        .static.nsi file.
    tier3:
      case: TestPresetTier3/3delight-render/default
      required_on: [linux, darwin, windows]

  - name: mantra-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from SideFX's batch-rendering documentation for Houdini
        22.0: mantra -f <file.ifd>, one IFD per command, with -V 2a
        (line-per-update progress). -j is not passed, so mantra uses every
        core. Mantra ships but is unsupported by SideFX; the readme points to
        husk-usd-render. No Houdini installation has executed it. The goldens
        show the shared scene-pattern substitution; a bad pattern is rejected
        at submission. Unverified: licensing.
    tier3:
      case: TestPresetTier3/mantra-render/default
      required_on: [linux, darwin, windows]

  - name: cinema4d-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from Maxon's documented Commandline flags (Maxon help 2026
        and the support article on Commandline rendering arguments):
        -nogui -render <scene> -frame <start> <end> -oimage <path>. The goldens
        show the spaced scene path as one argument, chunk bounds 1-5 then 6-10
        under a patched chunk size, and 1-9:4 splitting into -frame 1 1,
        -frame 5 5 and -frame 9 9. No Cinema 4D has executed it. Unverified: a
        blank OutputPath reaches Commandline as -oimage "" (base OpenJD cannot
        omit an argument without EXPR, so the flag is always passed, as in
        blender-batch-render) and what Commandline does with that; whether the
        -frame end is inclusive (documented by example only); the exit status on
        failure, which Maxon does not document; the macOS Commandline path.
        Every node also needs licensing before it can render.
    tier3:
      case: TestPresetTier3/cinema4d-render/default
      required_on: [linux, darwin, windows]

  - name: cinema4d-take-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from Maxon's documented Commandline flags (Maxon help 2026
        and the support article on Commandline rendering arguments):
        -nogui -render <scene> -frame <start> <end> -take <take> -oimage <path>.
        The goldens show the spaced scene path and a take name containing double
        quotes each as one argument, chunk bounds 1-5 then 6-10 under a patched
        chunk size, and 1-9:4 splitting into -frame 1 1, -frame 5 5 and
        -frame 9 9. No Cinema 4D has executed it. Unverified: -take with a
        child take's name alone, and with "all"; what happens when -take is
        omitted, as cinema4d-render does; a blank OutputPath reaches
        Commandline as -oimage "" and what Commandline does with that; whether
        the -frame end is inclusive; the exit status on failure, which Maxon
        does not document; the macOS Commandline path. Every node also needs
        licensing before it can render.
    tier3:
      case: TestPresetTier3/cinema4d-take-render/default
      required_on: [linux, darwin, windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]),
  # which no test environment can fake, so this entry's Tier-3 claim is
  # required_on [windows] alone. TestThreeDSMaxRender_IsWindowsOnly pins both
  # halves.
  - name: 3dsmax-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from Autodesk's documented 3dsmaxcmd switches (the 3ds Max
        2026 command-line switches page): -v:5 -rfw:0 -start:<n> -end:<n>
        -outputName:<path> <scene>. The goldens show the spaced scene path as
        one argument, chunk bounds 1-5 then 6-10 under a patched chunk size,
        and 1-9:4 splitting into frames 1, 5 and 9. No 3ds Max has executed it.
        Unverified: a blank OutputPath reaches 3dsmaxcmd as -outputName: with
        nothing after it (base OpenJD cannot omit an argument without EXPR, so
        the switch is always passed, as in cinema4d-render) and what 3dsmaxcmd
        does with that; whether the -end frame is inclusive; the exit status on
        failure, which Autodesk does not document; whether it renders from a
        worker with no interactive session (session 0).
    tier3:
      case: TestPresetTier3/3dsmax-render/default
      required_on: [windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]),
  # so both After Effects Windows entries' Tier-3 claims are required_on
  # [windows] alone. Tier 3 runs the real powershell and stubs aerender
  # (stub_inner), and expect_inner_argv pins the argv the wrapper forwards.
  # The wrapper's exit-status contract is carried by
  # TestAfterEffectsPreset_WrapperFailsOnLoggedError, which is not a registry
  # case.
  - name: after-effects-render-windows
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, movie-one-task, stepped-range]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -rqindex
        <n> -s <start> -e <end> -v ERRORS_AND_PROGRESS -close
        DO_NOT_SAVE_CHANGES, passed through an embedded PowerShell wrapper the
        goldens print in full (its leading UTF-8 BOM is invisible there). The
        wrapper exists because aerender is reported to exit 0 when a render
        fails (Adobe community and Thinkbox forum reports, not Adobe's
        documentation): it also fails the task when any output line contains
        "aerender ERROR", matched case-insensitively, a marker taken from
        those reports and unverified against a real failing render. The
        goldens show the scene path with a space and an apostrophe as one
        argument, 1-20 at ten frames per task as 1-10 and 11-20, a 240-frame
        movie kept whole by Frames Per Task 240, and 1-9:4 as frames 1, 5 and
        9. No After Effects has executed it.
        Unverified: how -s/-e number frames in a comp whose display start is
        not 0; that -s/-e override the -rqindex item's own time span, which
        Adobe implies ("like with the -comp flag") rather than states. A movie
        output is kept to one task only by Frames Per Task, which the artist
        (or the After Effects submitter) must set; nothing in the preset
        enforces it.
    tier3:
      case: TestPresetTier3/after-effects-render-windows/default
      required_on: [windows]

  - name: after-effects-queue-render-windows
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -v
        ERRORS_AND_PROGRESS -close DO_NOT_SAVE_CHANGES, which renders the
        saved queue as is (Adobe: with no -comp, -s, -e, -i and -output are
        ignored), passed through the same embedded PowerShell wrapper as
        after-effects-render-windows. The wrapper exists because aerender is
        reported to exit 0 when a render fails (Adobe community and Thinkbox
        forum reports, not Adobe's documentation): it also fails the task when
        any output line contains "aerender ERROR", matched case-insensitively,
        a marker taken from those reports and unverified against a real
        failing render. The golden shows the scene path with a space and an
        apostrophe as one argument. No After Effects has executed it. Frame
        numbering and movie splitting do not arise: the whole queue is one
        task on one machine.
    tier3:
      case: TestPresetTier3/after-effects-queue-render-windows/default
      required_on: [windows]

  # macOS-only by hostRequirements (attr.worker.os.family anyOf ["macos"]),
  # so both After Effects macOS entries' Tier-3 claims are required_on
  # [darwin] alone, and no CI job has a macOS runner to earn them. Tier 3 runs
  # the real /bin/sh and stubs aerender (stub_inner), and expect_inner_argv
  # pins the argv the wrapper forwards. The wrapper itself is not left to a
  # Mac: Linux CI exercises the same sh script, with the os.family gate
  # stripped, through TestAfterEffectsPreset_WrapperFailsOnLoggedError, which
  # is not a registry case and carries the exit-status contract for both OSes.
  - name: after-effects-render-macos
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, movie-one-task, stepped-range]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -rqindex
        <n> -s <start> -e <end> -v ERRORS_AND_PROGRESS -close
        DO_NOT_SAVE_CHANGES, the same argv as after-effects-render-windows,
        passed through an embedded POSIX sh wrapper run by /bin/sh, which the
        goldens print in full. The wrapper exists because aerender is reported
        to exit 0 when a render fails (Adobe community and Thinkbox forum
        reports, not Adobe's documentation): it also fails the task when any
        output line contains "aerender ERROR", matched case-insensitively, a
        marker taken from those reports and unverified against a real failing
        render. The goldens show the scene path with a space and an apostrophe
        as one argument, 1-20 at ten frames per task as 1-10 and 11-20, a
        240-frame movie kept whole by Frames Per Task 240, and 1-9:4 as frames
        1, 5 and 9. No After Effects has executed it, and the wrapper has run
        under Linux's dash, not macOS's /bin/sh. Unverified: how -s/-e number
        frames in a comp whose display start is not 0; that -s/-e override the
        -rqindex item's own time span, which Adobe implies ("like with the
        -comp flag") rather than states. A movie output is kept to one task
        only by Frames Per Task, which the artist (or the After Effects
        submitter) must set; nothing in the preset enforces it.
    tier3:
      case: TestPresetTier3/after-effects-render-macos/default
      required_on: [darwin]

  - name: after-effects-queue-render-macos
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -v
        ERRORS_AND_PROGRESS -close DO_NOT_SAVE_CHANGES, which renders the
        saved queue as is (Adobe: with no -comp, -s, -e, -i and -output are
        ignored), the same argv as after-effects-queue-render-windows, passed
        through the same embedded POSIX sh wrapper as
        after-effects-render-macos. The wrapper exists because aerender is
        reported to exit 0 when a render fails (Adobe community and Thinkbox
        forum reports, not Adobe's documentation): it also fails the task when
        any output line contains "aerender ERROR", matched case-insensitively,
        a marker taken from those reports and unverified against a real
        failing render. The golden shows the scene path with a space and an
        apostrophe as one argument. No After Effects has executed it, and the
        wrapper has run under Linux's dash, not macOS's /bin/sh. Frame
        numbering and movie splitting do not arise: the whole queue is one
        task on one machine.
    tier3:
      case: TestPresetTier3/after-effects-queue-render-macos/default
      required_on: [darwin]

  - name: ffmpeg-transcode
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default]
      caveat: >-
        this entry carries a tier2 block, so the real-ffmpeg evidence is a
        verified fact rather than prose -- read it there. What the Tier-1 golden
        adds is a non-executing companion check; one case is the whole preset,
        since it declares no parameter space. What neither tier proves is that
        -crf is meaningful when VideoCodec is copy: ffmpeg ignores it with a
        warning, and no assertion notices.
    tier2:
      case: TestFFmpegPreset_TranscodeProducesPlayableOutput
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-transcode/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-sequence-encode
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, offset-range]
      caveat: >-
        this entry carries a tier2 block, so the real-ffmpeg evidence is a
        verified fact rather than prose -- read it there. What the two Tier-1
        cases add is what that single run cannot show — the EXPR-derived output
        filename under both separator shapes (beauty_%04d and .plate.%04d, i.e.
        the underscore and the dot that rstrip(..., '_-.') must strip) and
        -frames:v at a non-1 start frame (1001-1048 -> 48, a count and not an
        end frame). It has no parameter space, so neither case is a second
        expansion shape. What neither tier proves is colour handling: it is
        unverified and unopinionated, a linear EXR sequence forced to yuv420p
        with no transform will look dark, and no test asserts otherwise.
    tier2:
      case: TestFFmpegPreset_SequenceEncodeNamesOutputAfterPattern
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-sequence-encode/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-segment-transcode-bash
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        this entry carries a tier2 block, so the real-ffmpeg-and-real-bash
        evidence is a verified fact rather than prose -- read it there. What the
        two Tier-1 cases add is the review that test cannot do: the goldens put
        the join script's glob (<dir>/<stem>_seg_*.<ext>) next to the exact
        slice paths the Transcode step writes, at 3 slices and at 4
        (uneven-tail, 7s in 2s slices, which is also the shape a truncating
        division would get wrong). The goldens render on Windows too, but
        they show the computed file body, not the bytes the worker writes, so
        they do not prove that endOfLine LF survives to a Windows worker. What
        does is a real bash running the join script there, which has been
        observed on a developer Windows host only: the tier2 case below is not
        required on windows, so that evidence is unenforced until it is
        promoted. What neither tier proves is the concat list's quoting: it
        quotes slice paths as file '<path>', unescaped, so a path containing a
        single quote would break the concat parse.
    tier2:
      case: TestFFmpegPreset_BashSegmentTranscodeJoins
      # Not required on windows, although it passes there on a developer host.
      # ci.yml's preset-harness-windows job states the rule: this test is
      # promoted only once that runner image is seen to pass rather than skip,
      # because it skips when bash.exe is not resolvable by Windows PATH lookup
      # from the worker process. A pass on a machine with Git Bash installed is
      # evidence from the wrong host.
      required_on: [linux, darwin]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-bash/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-segment-transcode-expr
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        this entry carries a tier2 block, so the real-ffmpeg evidence -- the
        template's own EXPR-generated concat list joining the segments with no
        shell -- is a verified fact rather than prose -- read it there. This is
        the variant every other segment-transcode case in that file exercises
        most heavily. What the two Tier-1 goldens add is the only side-by-side
        comparison that exists: the resolved concat-list body and the
        Transcode step's slice paths are both printed in full, and they are
        character-identical at 3 slices and at 4 (uneven-tail). What neither
        tier proves is the concat list's quoting: the file '<path>' quoting is
        not escaped, so a slice path containing a single quote would break the
        concat parse.
    tier2:
      case: TestFFmpegPreset_PortableSegmentTranscodeJoins
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-expr/default
      required_on: [linux, darwin, windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]),
  # which no test environment can fake -- the worker reports runtime.GOOS at
  # registration and scheduler/matcher.go translates it. So this entry's Tier-3
  # claim is required_on [windows] alone: it cannot run anywhere else.
  - name: ffmpeg-segment-transcode-powershell
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        this entry carries a tier2 block, so the real-ffmpeg-and-real-PowerShell
        evidence is a verified fact rather than prose -- read it there; its
        required_on: [windows] enforces that the variant runs only on Windows
        workers. The Tier-1 goldens matter most here: they are the only review
        this variant gets off Windows, and they pin two properties it depends
        on: the embedded file's on-disk name is join.ps1, which powershell
        -File requires, and its body carries no byte-order mark. The cases
        also use native C:\... paths and show them
        surviving the POSIX-flavoured path engine intact, which works only
        because a backslash is an ordinary character to a POSIX PurePath —
        correct, but by accident rather than by design. Tier 2 and Tier 3 both
        execute this on a real Windows worker, so powershell.exe accepting
        the script is proven. Get-ChildItem -Filter's ordering is exercised
        only at three and four slices, where lexical and numeric order
        coincide for any padding; TestFFmpegPreset_SliceNamesAreZeroPadded
        covers the eleven-slice case on the portable variant, not this one.
    tier2:
      case: TestFFmpegPreset_PowerShellSegmentTranscodeJoins
      required_on: [windows]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-powershell/default
      required_on: [windows]

  - name: script
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the /bin/sh -c convention documented in the product's
        own readme. Tier 3 does execute it: a real worker runs a real /bin/sh,
        which resolves the fixture's deliberately nonexistent command
        (sqi-stub-command --frame 1) from PATH, so the stub is observed being
        invoked from inside -c. What that cannot show is the argv of the shell
        itself — /bin/sh is an absolute path, so nothing shadows it and the
        observed-vs-computed cross-check does not apply here (this fixture
        declares stub_inner: true; see Case.StubInner in
        internal/presettest/cases.go): the -c string is evidenced only by
        the Tier-1 golden and by the fact that the shell found the stub in it.
    tier3:
      case: TestPresetTier3/script/default
      required_on: [linux, darwin]

  - name: script-powershell
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the documented powershell -NoProfile -NonInteractive
        -ExecutionPolicy Bypass -File convention in the product's own readme,
        and the golden prints the embedded command.ps1 in full (including its
        leading UTF-8 BOM, which is invisible there). Tier 3 does execute it: a
        real worker runs a real powershell.exe, which resolves the fixture's
        deliberately nonexistent command (sqi-stub-command --frame 1) from PATH,
        so the stub is observed being invoked from inside command.ps1. What that
        cannot show is the argv of the shell itself, which is evidenced only by
        the Tier-1 golden. Nor can either tier show the exit-status wrapper
        working: the stub always exits 0, so TestScriptPowerShell_ExitStatus
        carries that claim alone -- and it is not a registry case, so the only
        thing enforcing that it runs is its by-name PASS assertion in ci.yml's
        preset-harness-windows job.
    tier3:
      case: TestPresetTier3/script-powershell/default
      required_on: [windows]

  - name: command-sequence
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        argv derived from the /bin/sh -c convention documented in the product's
        own readme, with the four SQI_FRAME* exports prefixed to Command. The
        goldens show that prefix at one frame per task, at five per task with a
        multi-line Command ending in a comment, and over a frame list, where
        the chunks stop at every gap (1-1, 5-5, 10-14, 15-19, 20-20). Tier 3
        executes it: a real /bin/sh runs the export prefix and hands the
        expanded variables to the stub, and expect_inner_argv pins the exact
        values each of the three tasks received. What neither tier observes is
        the argv of the shell itself, which is an absolute path nothing
        shadows (stub_inner: true), so the -c string is evidenced by the golden
        alone.
    tier3:
      case: TestPresetTier3/command-sequence/default
      required_on: [linux, darwin]

  # Windows-only by hostRequirements, so its Tier-3 claim is required_on
  # [windows] alone -- the same reasoning as ffmpeg-segment-transcode-powershell.
  - name: command-sequence-powershell
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        argv derived from script-powershell's documented -File convention; the
        goldens print the embedded command.ps1 in full, showing the four
        $env:SQI_FRAME* assignments between the (invisible) BOM and Command, and
        script-powershell's exit-status trailer unchanged after it. Tier 3
        executes it: a real powershell.exe assigns the variables and hands them
        to the stub, and expect_inner_argv pins the exact values each of the
        three tasks received. Not re-proven here: the trailer's exit-status
        behaviour, which TestScriptPowerShell_ExitStatus carries for
        script-powershell; TestBuiltins_PowerShellExitTrailersMatch pins this
        product's copy of the trailer to that one.
    tier3:
      case: TestPresetTier3/command-sequence-powershell/default
      required_on: [windows]

  - name: python-sequence
    source: internal/product/builtins
    tier: 2
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        the real-Python behavior is this entry's tier2 claim. What the Tier-1
        goldens add is the launcher's argv per task (the three frame values
        after the two embedded-file paths) and the launcher's full text, which
        contains no format string by design. Tier 3 runs the stub as the
        interpreter, so it observes that argv through a real worker and the
        observed-vs-computed cross-check applies. What no tier proves is an
        interpreter whose sys.executable cannot run a script file (an embedded
        DCC Python launched through its host application): the launcher
        re-runs sys.executable, so Interpreter must be a real Python.
    tier2:
      case: TestPresetPythonSequence_LauncherContract
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/python-sequence/default
      required_on: [linux, darwin, windows]

  - name: python
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the interpreter-plus-script-path convention documented
        in the product's own readme (<Interpreter> <embedded script.py>); no
        Python interpreter has executed the resulting script under this
        harness.
    tier3:
      case: TestPresetTier3/python/default
      required_on: [linux, darwin, windows]

  - name: container
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the documented "docker run --rm <image>" convention
        in the product's own readme; no Docker daemon has pulled or run the
        resulting image under this harness.
    tier3:
      case: TestPresetTier3/container/default
      required_on: [linux, darwin, windows]
