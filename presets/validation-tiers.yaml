# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Which validation tier each shipped preset and built-in product has actually
# reached. See docs/preset-library.md for what each tier proves.
#
# Every claim here is checked. internal/presettest and
# test/integration/preset_tiers_test.go refuse a claim that is not backed by a
# fixture, a golden, or a named test that ran, including a Tier-2 or Tier-3
# claim whose case skipped on a platform listed in required_on.
#
# A Tier-2 case that needs a vendor application (Blender, Nuke, Houdini) names it
# with requires_app instead of required_on. It skips when the application is
# absent, and the skip fails the check only when SQI_TEST_REQUIRE_APPS lists the
# application (CI does for Blender; `make test-dcc` does for all three).
presets:
  - name: blender-batch-render
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Blender 4.x command-line documentation. The goldens
        show the documented ordering rule holding (-o/-s/-e all precede -a,
        which triggers the render) and chunk bounds 1-5 then 6-10 under a
        patched chunk size. A stepped or listed Frames range splits into one
        chunk per run of consecutive frames, so -s/-e never spans a frame the
        range excluded. Neither golden here exercises one;
        blender-view-layer-render's stepped-range golden shows the same -s/-e
        split. Tier 2 runs it against a real Blender 5.2.2 and shows that
        #### in -o is padded to the frame number, that Blender appends the
        format's extension itself, that a path with no # still gets the frame
        number, and that a stepped range renders exactly its frames. Not
        shown: Blender 4.x (the argv is derived from its documentation), a
        supplied path that already carries an extension, or any output format
        but multilayer EXR.
    tier2:
      case: TestPresetDCC_Blender_BatchRender
      requires_app: blender
    tier3:
      case: TestPresetTier3/blender-batch-render/default
      required_on: [linux, darwin, windows]

  - name: blender-view-layer-render
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, quoted-layer, stepped-range]
      caveat: >-
        argv derived from the Blender 4.5 manual's command-line arguments
        (arguments run in order, -a last, nothing after -- is parsed by Blender,
        --python-exit-code, -S) and from the Python API's ViewLayer.use. A
        fixed one-line Python expression selects the view layer, reading its
        name from sys.argv after --, so the goldens show the layer name as the
        final argument and never inside the Python source. quoted-layer passes
        It's "Main" layer and a scene called Shot 010, each as one argument;
        stepped-range splits 1-9:4 into -s/-e 1 1, 5 5 and 9 9. Tier 3 proves
        only that the stub receives that argv. Tier 2 runs it against a real
        Blender 5.2.2 and shows that Blender honours use, so -a renders only
        the named layer (checked in the EXR header, for Shot's two layers and
        for Alt's one); that bpy.context.scene is the scene -S selected, since
        a layer of another scene is refused; that the expression's generator
        sees the name it reads; that sys.exit with a message stops Blender with
        a non-zero status before -a renders, naming the missing layer and
        leaving no output; and that a name containing quotes arrives intact.
        Not shown: what -S does when the scene does not exist, Blender 4.x, and
        the #### caveats of blender-batch-render beyond padding.
    tier2:
      case: TestPresetDCC_Blender_ViewLayerRender
      requires_app: blender
    tier3:
      case: TestPresetTier3/blender-view-layer-render/default
      required_on: [linux, darwin, windows]

  - name: maya-layer-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Autodesk's documented Maya Render command-line flags
        (Render -r <renderer> -s/-e -rl <layer> -rd <dir> <scene>). The goldens
        cover the shipped one-frame-per-task shape and a patched chunk size of 5
        (1-5 then 6-10, so both bound ends are reviewed). No Maya render session has
        executed it, so whether the chosen renderer honours -rl and -rd, and whether
        -r file resolves the scene's own renderer, are unverified. A stepped
        Frames range is not covered by these goldens; it splits into one chunk
        per run of consecutive frames, so -s/-e cannot span an excluded frame.
    tier3:
      case: TestPresetTier3/maya-layer-render/default
      required_on: [linux, darwin, windows]

  - name: maya-scene-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from Autodesk's documented Maya Render command-line flags
        (Render -r <renderer> -s/-e -rd <dir> <scene>). Same coverage and same gaps
        as maya-layer-render, minus -rl: the goldens review the shipped
        one-frame-per-task shape and a patched chunk size of 5, and no Maya render
        session has executed either. Which layers Maya treats as renderable,
        which decides what this variant renders, is not visible in argv.
    tier3:
      case: TestPresetTier3/maya-scene-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-boutique-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from SGO's documented Mistika Boutique/Ultima command-line
        invocation (mistika -r <scene> -s/-e). No Mistika installation has
        executed it and sqi has no in-application Mistika submitter to
        cross-check against, so the command token (mistika) is unverified as
        well as its flags. The preset ships chunks.defaultTaskCount 10, but a
        stepped Frames range splits into one chunk per run of consecutive
        frames, so -s/-e never spans an excluded frame: the stepped-range
        golden shows Frame=1-20:2 reaching the renderer as ten single-frame
        tasks (-s 1 -e 1, -s 3 -e 3, ...), each loading the scene again.
    tier3:
      case: TestPresetTier3/mistika-boutique-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-vr-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from SGO's documented Mistika VR command-line invocation
        (vr -r <scene> -s/-e). No Mistika installation has executed it and sqi
        has no in-application Mistika submitter to cross-check against, so the
        command token (vr) is unverified as well as its flags. The preset ships
        chunks.defaultTaskCount 10, but a stepped Frames range splits into one
        chunk per run of consecutive frames, so -s/-e never spans an excluded
        frame: mistika-boutique-render's stepped-range golden shows
        Frame=1-20:2 reaching the renderer as ten single-frame tasks (-s 1 -e 1,
        -s 3 -e 3, ...), each loading the scene again.
    tier3:
      case: TestPresetTier3/mistika-vr-render/default
      required_on: [linux, darwin, windows]

  - name: mistika-workflows-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk]
      caveat: >-
        argv derived from SGO's documented Mistika Workflows command-line
        invocation (workflows -r <scene> -s/-e). No Mistika installation has
        executed it and sqi has no in-application Mistika submitter to
        cross-check against, so the command token (workflows) is unverified as
        well as its flags. The preset ships chunks.defaultTaskCount 10, but a
        stepped Frames range splits into one chunk per run of consecutive
        frames, so -s/-e never spans an excluded frame: mistika-boutique-render's
        stepped-range golden shows Frame=1-20:2 reaching the renderer as ten
        single-frame tasks (-s 1 -e 1, -s 3 -e 3, ...), each loading the scene
        again.
    tier3:
      case: TestPresetTier3/mistika-workflows-render/default
      required_on: [linux, darwin, windows]

  - name: houdini-rop-render
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from SideFX's documented hython command-line convention for
        driving a ROP via an embedded Python driver script. The golden shows
        both the chunk the driver receives and the driver's parser, so the two
        can be read against each other. The chunks are NONCONTIGUOUS, which sqi
        spells as a compact frame range: the default case's 1-24 becomes 1-8,
        9-16 and 17-24, and the stepped-range case's thirty frames become three
        tasks such as 1-19:2. The driver renders each lo-hi:step part in one
        rop.render(frame_range=(lo, hi, step)) call, merging parts that
        continue one another because sqi lists a run of two frames as 7,8: a
        stepped chunk is one call, and a gapped chunk such as 1-5,8-12 is two.
        TestHoudiniROPRender_DriverRendersEachRange checks those calls against
        a stub hou module. Tier 2 runs it under a real hython (Houdini 22.0.466,
        Apprentice) against a Geometry ROP and shows that hou.hipFile.load,
        hou.node and RopNode.render(frame_range=...) work, including a stepped
        frame_range, that hython hands the driver its arguments in the order the
        driver reads them, and that stepped (1-12:2), listed (1-3,7,8) and
        multi-chunk (1-24, three tasks) ranges write exactly their frames, each
        file read back to the right frame. Not shown: a render ROP (Mantra,
        Karma, an OpenGL ROP), a scene using the ROP's own frame range, the
        Apprentice resolution limit, or any Houdini but 22.0.466.
    tier2:
      case: TestPresetDCC_Houdini_ROPRender
      requires_app: houdini
    tier3:
      case: TestPresetTier3/houdini-rop-render/default
      required_on: [linux, darwin, windows]

  - name: nuke-write-render
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from Foundry's documented nuke -x batch-render flags
        (-X <write node> -F <frame list>). The stepped-range golden shows a
        stepped Frames range expanding to one single-frame task per requested
        frame (-F 1-1, -F 3-3, ...), because a CONTIGUOUS chunk never spans a
        gap, so -F never receives OpenJD's colon step syntax (1-19:2) where
        Foundry documents x (1-19x2). Tier 2 runs it against a real Nuke 17.1v2
        (Non-commercial, so the test passes --nc) and shows that Nuke reads
        -F 1-1 as the single frame 1, and that -X renders only the named Write
        node: a 1-4:3 range wrote exactly wr2.0001.png and wr2.0004.png. Not
        shown: a commercial license, a colon or x step, or Nuke on Linux or
        macOS. The chunks
        are CONTIGUOUS because Foundry's Command Line Operations page documents
        -F only as one frame, a-b or a-bxN (repeating -F for more ranges), with
        no comma-list form, so a NONCONTIGUOUS chunk such as 1-19:2 or 1-3,7,8
        could reach Nuke only through a wrapper script that rewrites it. A
        stepped range therefore costs one task, and one script load, per frame.
    tier2:
      case: TestPresetDCC_Nuke_WriteRender
      requires_app: nuke
    tier3:
      case: TestPresetTier3/nuke-write-render/default
      required_on: [linux, darwin, windows]

  - name: nuke-script-render
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, stepped-range]
      caveat: >-
        argv derived from Foundry's documented nuke -x batch-render flags
        (-F <frame list>, rendering every enabled Write node), so which Write
        nodes are enabled, and so what this variant renders, is invisible in
        argv. Its chunks are CONTIGUOUS for nuke-write-render's reason, and its
        stepped-range golden shows the same single-frame expansion (-F 1-1,
        -F 3-3, ...): no step separator reaches -F, and a stepped range costs
        one task per frame. Tier 2 runs it against a real Nuke 17.1v2
        (Non-commercial) and shows that, with no -X, every enabled Write node
        renders every requested frame (two Write nodes, frames 1-4, eight
        files). Not shown: a disabled Write node, a stepped range (covered for
        nuke-write-render), or a commercial license.
    tier2:
      case: TestPresetDCC_Nuke_ScriptRender
      requires_app: nuke
    tier3:
      case: TestPresetTier3/nuke-script-render/default
      required_on: [linux, darwin, windows]

  # Standalone renderers: each renders an exported scene description without
  # the application that wrote it. Every argv below is derived from vendor
  # documentation and has not run against a real renderer; Tier 3 drives a
  # stub through the real worker path.
  - name: arnold-kick-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from kick's help text (-i, -dw, -dp, -v); no Arnold
        installation has executed it. No stdin or crash-dialog flag is passed;
        the worker gives kick a null stdin. The goldens show the scene-pattern
        substitution: #### padding with 12345 written in full, not truncated,
        and a ###### run setting six-digit padding over a stepped range. A
        pattern with no run of # or with two runs is rejected at submission
        (TestPerFilePresets_RejectABadScenePattern). Unverified: licensing, and
        whether the exported .ass carries the output paths the user expects.
    tier3:
      case: TestPresetTier3/arnold-kick-render/default
      required_on: [linux, darwin, windows]

  - name: vray-standalone-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range]
      caveat: >-
        argv derived from Chaos's V-Ray Standalone documentation and vray -h:
        -sceneFile, -frames=START-END (inclusive), -display=0 (no frame
        buffer), -autoClose=1 (exit when done), and -progressUseColor=0 with
        -progressUseCR=0 (plain, newline-terminated progress lines). No V-Ray
        installation has executed it. The goldens show the chunk bounds at the
        shipped one frame per task, at a patched chunk size of 5 (-frames=1-5
        then -frames=6-10), and a stepped range as single-frame tasks
        (-frames=1-1, 5-5, 9-9), so -frames never spans an excluded frame.
        Unverified: licensing, and whether the .vrscene's own output settings
        are what the user expects.
    tier3:
      case: TestPresetTier3/vray-standalone-render/default
      required_on: [linux, darwin, windows]

  - name: husk-usd-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, renderer]
      caveat: >-
        argv derived from SideFX's husk documentation for Houdini 22.0:
        --renderer, --frame, --frame-count, --make-output-path, --no-mplay,
        -V 2a (line-per-update progress), and the USD stage as a positional
        argument. No Houdini installation has executed it. The start frame and
        count are computed with EXPR (min and len of the chunk's range),
        because SQI_CHUNK_BOUNDS's .Start/.End do not resolve on an EXPR
        range_expr. The goldens show them at one frame per task, at a patched
        chunk size of 4, which balances 1-10 into chunks of 4, 3 and 3
        (start/count 1/4, 5/3, 8/3), and over a stepped range (each
        --frame-count 1). With the Hydra Delegate empty no
        --renderer is passed and husk uses the stage's husk:delegate render
        setting; the renderer case shows the flag when a delegate is named.
        Its BRAY_HdKarmaXPU is an example, not a verified delegate name.
        Unverified: licensing and the stage's render products.
    tier3:
      case: TestPresetTier3/husk-usd-render/default
      required_on: [linux, darwin, windows]

  - name: redshift-standalone-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step, windows-path]
      caveat: >-
        argv derived from Maxon's redshiftCmdLine documentation: one exported
        .rs file per frame, every other option (-oip, -gpu, -cachepath, ...)
        an override, so the preset passes the scene file alone. No Redshift
        installation has executed it. The goldens show the shared
        scene-pattern substitution; the windows-path case shows a native
        C:\... pattern reaching the renderer intact. A bad pattern is rejected
        at submission. Scheduling gates on the redshift install tag, not on a
        detected GPU: sqi's GPU probe sees only NVIDIA on Linux, and Redshift
        also renders on Windows and Apple Silicon. The operator excludes a host
        with no usable GPU (capabilities.disable). Unverified: licensing,
        device selection and exit codes.
    tier3:
      case: TestPresetTier3/redshift-standalone-render/default
      required_on: [linux, darwin, windows]

  - name: prman-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from Pixar's prman documentation: -Progress (one progress
        line per update) and the RIB file as a positional argument. -t and
        -cwd are not passed, so prman uses every core and the task's working
        directory. No RenderMan installation has executed it. The goldens show
        the shared scene-pattern substitution; a bad pattern is rejected at
        submission. Unverified: licensing, and how RenderMan 27 chooses
        between RIS and XPU for a command-line render.
    tier3:
      case: TestPresetTier3/prman-render/default
      required_on: [linux, darwin, windows]

  - name: arnold-kick-tile-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, uneven]
      caveat: >-
        argv derived from kick's help text (-r resolution, -rg minx miny maxx
        maxy render region, -o output) and OpenImageIO's oiiotool
        documentation (--paste:mergeroi=1:all=1 +0+0 pastes every image on the
        stack at its data-window offset into one image sized to their union).
        No Arnold installation has executed it. The goldens show every tile's
        region, its output path and the generated assembly list; the uneven
        case shows a width 3 does not divide split with no gap or overlap
        (0-332, 333-665, 666-999), and
        TestArnoldKickTileRender_RegionsPartitionTheImage checks further
        sizes. Unverified: that -rg bounds are inclusive pixel coordinates,
        that the y-origin is the top edge, and that kick writes a region
        render as a full display window with a region-sized data window, which
        --paste depends on; if kick writes full-size pixels outside the
        region, the last tile pasted wins. A bad pattern, or more tiles than
        pixels in either direction, is rejected at submission. Assembly waits
        for the whole Render step; jobtemplate-2023-09 has no task-level
        dependencies. The Assemble step's tile list is built at submission, so
        its cost grows with the grid: the largest grid, 16 x 16, costs 536
        operations and 16,448 live bytes, inside the default server EXPR
        limits. With openjd.expr_memory_limit at its 4,096-byte floor, the
        largest square grid that submits is 7 x 7, whatever the output path's
        length. TestArnoldKickTileRender_GridCostAtTheLimits pins both
        figures.
    tier3:
      case: TestPresetTier3/arnold-kick-tile-render/default
      required_on: [linux, darwin, windows]

  - name: 3delight-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from 3Delight's "Rendering NSI file" documentation
        (renderdl -progress <file.nsi>). renderdl documents no frame-range
        option and renders one .nsi file per frame, so this preset uses the
        per-file shape, not chunk bounds. -t is not passed, so renderdl uses
        every core. No 3Delight installation has executed it. The goldens show
        the shared scene-pattern substitution; a bad pattern is rejected at
        submission. Unverified: licensing and the handling of a separate
        .static.nsi file.
    tier3:
      case: TestPresetTier3/3delight-render/default
      required_on: [linux, darwin, windows]

  - name: mantra-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, padding-and-step]
      caveat: >-
        argv derived from SideFX's batch-rendering documentation for Houdini
        22.0: mantra -f <file.ifd>, one IFD per command, with -V 2a
        (line-per-update progress). -j is not passed, so mantra uses every
        core. Mantra ships but is unsupported by SideFX; the readme points to
        husk-usd-render. No Houdini installation has executed it. The goldens
        show the shared scene-pattern substitution; a bad pattern is rejected
        at submission. Unverified: licensing.
    tier3:
      case: TestPresetTier3/mantra-render/default
      required_on: [linux, darwin, windows]

  - name: cinema4d-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, blank-output]
      caveat: >-
        argv derived from Maxon's documented Commandline flags (Maxon help 2026
        and the support article on Commandline rendering arguments):
        -nogui -render <scene> -frame <start> <end> -oimage <path>. The goldens
        show the spaced scene path as one argument, chunk bounds 1-5 then 6-10
        under a patched chunk size, and 1-9:4 splitting into -frame 1 1,
        -frame 5 5 and -frame 9 9, and a blank OutputPath leaving -oimage out
        (an EXPR conditional, so the scene's own save path applies). The frame
        bounds are the chunk's min() and max() under EXPR. No Cinema 4D has
        executed it. Unverified: whether the -frame end is inclusive (documented by example only); the exit status on failure,
        which Maxon does not document; the macOS Commandline path. Every node
        also needs licensing before it can render.
    tier3:
      case: TestPresetTier3/cinema4d-render/default
      required_on: [linux, darwin, windows]

  - name: cinema4d-take-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, blank-output]
      caveat: >-
        argv derived from Maxon's documented Commandline flags (Maxon help 2026
        and the support article on Commandline rendering arguments):
        -nogui -render <scene> -frame <start> <end> -take <take> -oimage <path>.
        The goldens show the spaced scene path and a take name containing double
        quotes each as one argument, chunk bounds 1-5 then 6-10 under a patched
        chunk size, and 1-9:4 splitting into -frame 1 1, -frame 5 5 and
        -frame 9 9, and a blank OutputPath leaving -oimage out (an EXPR
        conditional). No Cinema 4D has executed it. Unverified: -take with a
        child take's name alone, and with "all"; what Commandline renders when
        -take is omitted, as cinema4d-render omits it; whether the -frame end
        is inclusive; the exit status on failure, which Maxon does
        not document; the macOS Commandline path. Every node also needs
        licensing before it can render.
    tier3:
      case: TestPresetTier3/cinema4d-take-render/default
      required_on: [linux, darwin, windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]),
  # so this entry's Tier-3 claim is required_on [windows] alone.
  # TestThreeDSMaxRender_IsWindowsOnly pins the gate, and
  # TestPresetTier3RequiredOnMatchesOSGate the required_on it implies.
  - name: 3dsmax-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, blank-output]
      caveat: >-
        argv derived from Autodesk's documented 3dsmaxcmd switches (the 3ds Max
        2026 command-line switches page): -v:5 -rfw:0 -start:<n> -end:<n>
        -outputName:<path> <scene>. The goldens show the spaced scene path as
        one argument, chunk bounds 1-5 then 6-10 under a patched chunk size,
        and 1-9:4 splitting into frames 1, 5 and 9, and a blank OutputPath
        leaving -outputName: out (an EXPR conditional, so the scene's own
        render output applies). The frame bounds are the chunk's min() and
        max() under EXPR. No 3ds Max has executed it. Unverified: whether the
        -end frame is inclusive; the exit status on
        failure, which Autodesk does not document; whether it renders from a
        worker with no interactive session (session 0).
    tier3:
      case: TestPresetTier3/3dsmax-render/default
      required_on: [windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]),
  # so both After Effects Windows entries' Tier-3 claims are required_on
  # [windows] alone. Tier 3 runs the real powershell and stubs aerender
  # (stub_inner), and expect_inner_argv pins the argv the wrapper forwards.
  # TestPresetAfterEffects_WrapperFailsOnLoggedError, which is not a registry
  # case, tests the wrapper's exit status.
  - name: after-effects-render-windows
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, movie-one-task, stepped-range]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -rqindex
        <n> -s <start> -e <end> -v ERRORS_AND_PROGRESS -close
        DO_NOT_SAVE_CHANGES, passed through an embedded PowerShell wrapper the
        goldens print in full (its leading UTF-8 BOM is invisible there).
        aerender is reported to exit 0 when a render fails (in Adobe community
        and Thinkbox forum reports, not Adobe's documentation), so the wrapper
        also fails the task when any output line contains "aerender ERROR" in
        any letter case. That marker comes from the same reports and is
        unverified against a real failing render. The goldens show the scene
        path with a space and an apostrophe as one argument, 1-20 at ten frames
        per task as 1-10 and 11-20, a 240-frame movie kept whole by Frames Per
        Task 240, and 1-9:4 as frames 1, 5 and 9. No After Effects has executed
        it. Unverified: how -s/-e number frames in a comp whose display start
        is not 0; that -s/-e override the -rqindex item's own time span, which
        Adobe implies ("like with the -comp flag") rather than states. Nothing
        in the preset keeps a movie output to one task: the artist must set
        Frames Per Task to at least the frame count and enter the range without
        a step or gaps, since a stepped or listed range always splits at each
        gap.
    tier3:
      case: TestPresetTier3/after-effects-render-windows/default
      required_on: [windows]

  - name: after-effects-queue-render-windows
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -v
        ERRORS_AND_PROGRESS -close DO_NOT_SAVE_CHANGES, which renders the
        saved queue as is (Adobe: with no -comp, -s, -e, -i and -output are
        ignored), passed through the same embedded PowerShell wrapper as
        after-effects-render-windows, whose "aerender ERROR" failure marker is
        equally unverified against a real failing render. The golden shows the
        scene path with a space and an apostrophe as one argument. No After
        Effects has executed it. The whole queue is one task on one machine, so
        frame numbering and movie splitting do not arise.
    tier3:
      case: TestPresetTier3/after-effects-queue-render-windows/default
      required_on: [windows]

  # macOS-only by hostRequirements (attr.worker.os.family anyOf ["macos"]),
  # so both After Effects macOS entries' Tier-3 claims are required_on
  # [darwin] alone, and no CI job runs Tier 3 on macOS. Tier 3 runs the real
  # /bin/sh and stubs aerender (stub_inner), and expect_inner_argv pins the
  # argv the wrapper forwards. Linux CI runs the same sh wrapper, with the
  # os.family gate stripped, in
  # TestPresetAfterEffects_WrapperFailsOnLoggedError, which is not a registry
  # case and tests the wrapper's exit status on both OSes.
  - name: after-effects-render-macos
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, movie-one-task, stepped-range]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -rqindex
        <n> -s <start> -e <end> -v ERRORS_AND_PROGRESS -close
        DO_NOT_SAVE_CHANGES, the same argv as after-effects-render-windows,
        passed through an embedded POSIX sh wrapper run by /bin/sh, which the
        goldens print in full. The wrapper fails the task on the same
        "aerender ERROR" marker as the Windows wrapper, equally unverified
        against a real failing render. The goldens show the scene path with a
        space and an apostrophe as one argument, 1-20 at ten frames per task as
        1-10 and 11-20, a 240-frame movie kept whole by Frames Per Task 240,
        and 1-9:4 as frames 1, 5 and 9. No After Effects has executed it, and
        the wrapper has run only under Linux's dash, never macOS's /bin/sh.
        Unverified: how -s/-e number frames in a comp whose display start is
        not 0; that -s/-e override the -rqindex item's own time span, which
        Adobe implies ("like with the -comp flag") rather than states. Nothing
        in the preset keeps a movie output to one task: the artist must set
        Frames Per Task to at least the frame count and enter the range without
        a step or gaps, since a stepped or listed range always splits at each
        gap.
    tier3:
      case: TestPresetTier3/after-effects-render-macos/default
      required_on: [darwin]

  - name: after-effects-queue-render-macos
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from Adobe's "Automated rendering and network rendering"
        page (Wayback copy of 2026-05-27): aerender -project <scene> -v
        ERRORS_AND_PROGRESS -close DO_NOT_SAVE_CHANGES, which renders the
        saved queue as is (Adobe: with no -comp, -s, -e, -i and -output are
        ignored), the same argv as after-effects-queue-render-windows, passed
        through the same embedded POSIX sh wrapper as
        after-effects-render-macos, whose "aerender ERROR" failure marker is
        equally unverified against a real failing render. The golden shows the
        scene path with a space and an apostrophe as one argument. No After
        Effects has executed it, and the wrapper has run only under Linux's
        dash, never macOS's /bin/sh. The whole queue is one task on one machine, so
        frame numbering and movie splitting do not arise.
    tier3:
      case: TestPresetTier3/after-effects-queue-render-macos/default
      required_on: [darwin]

  # P5b-1: DCC breadth presets, each declaring SQI_LOG_CHECKS. Every argv is
  # derived from vendor documentation and no application has executed any of
  # them; Tier 3 drives a stub through the real worker path, including the
  # outcome case that proves the log check fails a task whose process exited 0.
  #
  # required_on must name exactly the platforms the template's os.family
  # requirements admit (TestPresetTier3RequiredOnMatchesOSGate). Katana runs on
  # Linux and Windows only, but the preset carries no os.family gate, as its
  # detector has no macOS entry rather than a refusal, so it is required on all
  # three.
  - name: katana-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, target-with-space, logged-error]
      caveat: >-
        argv derived from Foundry's Katana batch mode documentation (katana
        --batch --katana-file=<scene> --render-node=<node> -t <first>-<last>),
        with -t's start-end form as Deadline's Katana plugin passes it; no
        Katana has executed it. The goldens cover the shipped one-frame-per-task
        shape, a FramesPerTask of 5 (1-5 then 6-10), a stepped range splitting
        into single frames because Foundry documents no step form for -t, and a
        scene path and Render node name that each contain a space as one
        argument. The failOn pattern (ERROR +\|) is Deadline's Katana plugin's,
        not observed from a real failing render, so what Katana prints and
        which exit status it returns on failure are unverified. Tier 3 runs the
        stub through a real worker, and the logged-error case proves a task
        whose process exited 0 still fails on a matching line. The Foundry-
        documented batch render that hangs on a missing ImageRead file is not
        tested, and the preset sets no timeout for it. The detector's Linux and
        Windows install paths are unverified.
    tier3:
      case: TestPresetTier3/katana-render/default
      required_on: [linux, darwin, windows]

  - name: fusion-render
    source: presets/sqi
    tier: 1
    tier1:
      cases: [default, multi-frame-chunk, stepped-range, target-with-space, logged-error]
      caveat: >-
        argv derived from the Fusion 21 manual's command-line page
        (FusionRenderNode <comp> -render -start <first> -end <last> -quiet
        -verbose -quit); no Fusion Render Node has executed it. The goldens
        cover the shipped ten-frames-per-task shape (1-25 as 1-9, 10-17, 18-25),
        a FramesPerTask of 5, a stepped range splitting into single frames, and
        a comp path containing a space as one argument. The two failOn strings
        (The fusion renderer reported that the render failed, Failed to load the
        comp) are Deadline's Fusion plugin's. It is UNVERIFIED whether they reach
        the render node's standard output with -verbose, or appear only in a
        -log file (Deadline drives the node through its own scripting connection
        and reads its log), in which case the check never fires and a failed
        render is caught only by an exit status that is also undocumented. Fusion
        8 once reported a successful render exiting -1073741819; that is recorded
        and not handled. Tier 3 runs the stub through a real worker, and the
        logged-error case proves a task whose process exited 0 still fails on a
        matching line. Rendering needs a Fusion Studio licence; the detector's
        install paths on all three platforms are unverified.
    tier3:
      case: TestPresetTier3/fusion-render/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-transcode
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default]
      caveat: >-
        the tier2 case runs real ffmpeg. The Tier-1 golden reviews the argv
        without executing it; one case covers the whole preset, since it
        declares no parameter space. Neither tier proves that -crf means
        anything when VideoCodec is copy: ffmpeg ignores it with a warning, and
        no assertion notices.
    tier2:
      case: TestFFmpegPreset_TranscodeProducesPlayableOutput
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-transcode/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-sequence-encode
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, offset-range]
      caveat: >-
        the tier2 case runs real ffmpeg once. The two Tier-1 cases add what
        that run cannot show: the EXPR-derived output filename under both
        separator shapes (beauty_%04d and .plate.%04d, the underscore and the
        dot that rstrip(..., '_-.') must strip) and -frames:v at a start frame
        other than 1 (1001-1048 gives 48, a count rather than an end frame).
        The preset has no parameter space, so each case is one task. Neither
        tier checks colour handling: the preset applies no colour transform,
        so a linear EXR sequence encoded to yuv420p will look dark.
    tier2:
      case: TestFFmpegPreset_SequenceEncodeNamesOutputAfterPattern
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-sequence-encode/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-segment-transcode-bash
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        the tier2 case runs real ffmpeg and a real bash. The two Tier-1 cases
        add a review that test cannot do: the goldens put the join script's
        glob (<dir>/<stem>_seg_*.<ext>) next to the exact slice paths the
        Transcode step writes, at 3 slices and at 4 (uneven-tail, 7s in 2s
        slices, the shape a truncating division would get wrong). The goldens
        show the computed file body, not the bytes the worker writes, so they
        do not prove that endOfLine LF reaches a Windows worker's disk, and the
        tier2 case is not required on windows, so no enforced test runs the
        join script under bash on Windows. Neither tier proves the concat
        list's quoting: slice paths are written as file '<path>', unescaped,
        so a path containing a single quote would break the concat parse.
    tier2:
      case: TestFFmpegPreset_BashSegmentTranscodeJoins
      # Not required on windows: the test skips when the worker process cannot
      # resolve bash.exe on PATH, and the Windows CI runner has not been seen
      # to provide one. ci.yml's preset-harness-windows job states when to add
      # windows here.
      required_on: [linux, darwin]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-bash/default
      required_on: [linux, darwin, windows]

  - name: ffmpeg-segment-transcode-expr
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        the tier2 case runs real ffmpeg on the template's own EXPR-generated
        concat list, joining the segments with no shell. The two Tier-1
        goldens print the resolved concat-list body and the Transcode step's
        slice paths in full, side by side, and they are character-identical at
        3 slices and at 4 (uneven-tail). Neither tier proves the concat list's
        quoting: file '<path>' is not escaped, so a slice path containing a
        single quote would break the concat parse.
    tier2:
      case: TestFFmpegPreset_PortableSegmentTranscodeJoins
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-expr/default
      required_on: [linux, darwin, windows]

  # Windows-only by hostRequirements (attr.worker.os.family anyOf ["windows"]).
  # The worker reports its real runtime.GOOS, so no other platform can run it,
  # and both claims are required_on [windows] alone.
  - name: ffmpeg-segment-transcode-powershell
    source: presets/sqi
    tier: 2
    tier1:
      cases: [default, uneven-tail]
      caveat: >-
        the tier2 case runs real ffmpeg and real PowerShell on a Windows
        worker. The Tier-1 goldens are the only review this variant gets off
        Windows, and they pin two properties it depends on: the embedded
        file's on-disk name is join.ps1, which powershell -File requires, and
        its body carries no byte-order mark. The cases use native C:\... paths
        and show them passing through the POSIX-flavoured path engine intact,
        because a backslash is an ordinary character in a POSIX path. Tier 2
        and Tier 3 both run the join script under a real powershell.exe. The
        join sorts slices by name, and that order is exercised only at three
        and four slices, where lexical and numeric order coincide for any
        padding; TestFFmpegPreset_SliceNamesAreZeroPadded covers the
        eleven-slice case on the portable variant, not this one.
    tier2:
      case: TestFFmpegPreset_PowerShellSegmentTranscodeJoins
      required_on: [windows]
    tier3:
      case: TestPresetTier3/ffmpeg-segment-transcode-powershell/default
      required_on: [windows]

  - name: script
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default, stub-fails]
      caveat: >-
        argv derived from the /bin/sh -c convention documented in the product's
        own readme. Tier 3 executes it: a real worker runs a real /bin/sh, which
        resolves the fixture's otherwise nonexistent command
        (sqi-stub-command --frame 1) from PATH, so the stub is observed being
        invoked from inside -c. That cannot show the argv of the shell itself:
        /bin/sh is an absolute path, so nothing shadows it and the
        observed-vs-computed cross-check does not apply (the fixture declares
        stub_inner: true; see Case.StubInner in internal/presettest/cases.go).
        The -c string is evidenced only by the Tier-1 golden and by the shell
        finding the stub in it.
    tier3:
      case: TestPresetTier3/script/default
      required_on: [linux, darwin]

  - name: script-powershell
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the documented powershell -NoProfile -NonInteractive
        -ExecutionPolicy Bypass -File convention in the product's own readme,
        and the golden prints the embedded command.ps1 in full (including its
        leading UTF-8 BOM, which is invisible there). Tier 3 executes it: a real
        worker runs a real powershell.exe, which resolves the fixture's
        otherwise nonexistent command (sqi-stub-command --frame 1) from PATH, so
        the stub is observed being invoked from inside command.ps1. That cannot
        show the argv of the shell itself, which is evidenced only by the
        Tier-1 golden. Neither tier shows the exit-status wrapper working,
        because the stub always exits 0; TestScriptPowerShell_ExitStatus covers
        that. It is not a registry case, so only its by-name PASS assertion in
        ci.yml's preset-harness-windows job ensures it runs.
    tier3:
      case: TestPresetTier3/script-powershell/default
      required_on: [windows]

  - name: command-sequence
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        argv derived from the /bin/sh -c convention documented in the product's
        own readme, with the four SQI_FRAME* exports prefixed to Command. The
        goldens show that prefix at one frame per task, at five per task with a
        multi-line Command ending in a comment, and over a frame list, where
        the chunks stop at every gap (1,5,10-20 at five per task is 1-1, 5-5,
        10-13, 14-17, 18-20). Tier 3
        executes it: a real /bin/sh runs the export prefix and hands the
        expanded variables to the stub, and expect_inner_argv pins the exact
        values each of the three tasks received. What neither tier observes is
        the argv of the shell itself, which is an absolute path nothing
        shadows (stub_inner: true), so the -c string is evidenced by the golden
        alone.
    tier3:
      case: TestPresetTier3/command-sequence/default
      required_on: [linux, darwin]

  # Windows-only by hostRequirements, so its Tier-3 claim is required_on
  # [windows] alone, as for ffmpeg-segment-transcode-powershell.
  - name: command-sequence-powershell
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        argv derived from script-powershell's documented -File convention; the
        goldens print the embedded command.ps1 in full, showing the four
        $env:SQI_FRAME* assignments between the (invisible) BOM and Command, and
        script-powershell's exit-status trailer unchanged after it. Tier 3
        executes it: a real powershell.exe assigns the variables and hands them
        to the stub, and expect_inner_argv pins the exact values each of the
        three tasks received. Not re-proven here: the trailer's exit-status
        behaviour, which TestScriptPowerShell_ExitStatus carries for
        script-powershell; TestBuiltins_PowerShellExitTrailersMatch pins this
        product's copy of the trailer to that one.
    tier3:
      case: TestPresetTier3/command-sequence-powershell/default
      required_on: [windows]

  - name: python-sequence
    source: internal/product/builtins
    tier: 2
    tier1:
      cases: [default, chunked, frame-list]
      caveat: >-
        the tier2 case runs the launcher under a real Python. The Tier-1
        goldens add the launcher's argv per task (the three frame values after
        the two embedded-file paths) and the launcher's full text, which
        contains no format string. Tier 3 runs the stub as the interpreter, so
        it observes that argv through a real worker and the
        observed-vs-computed cross-check applies. No tier covers an
        interpreter whose sys.executable cannot run a script file (an embedded
        DCC Python launched through its host application): the launcher
        re-runs sys.executable, so Interpreter must be a real Python.
    tier2:
      case: TestPresetPythonSequence_LauncherContract
      required_on: [linux, darwin, windows]
    tier3:
      case: TestPresetTier3/python-sequence/default
      required_on: [linux, darwin, windows]

  - name: python
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the interpreter-plus-script-path convention documented
        in the product's own readme (<Interpreter> <embedded script.py>); no
        Python interpreter has executed the resulting script under this
        harness.
    tier3:
      case: TestPresetTier3/python/default
      required_on: [linux, darwin, windows]

  - name: container
    source: internal/product/builtins
    tier: 1
    tier1:
      cases: [default]
      caveat: >-
        argv derived from the documented "docker run --rm <image>" convention
        in the product's own readme; no Docker daemon has pulled or run the
        resulting image under this harness.
    tier3:
      case: TestPresetTier3/container/default
      required_on: [linux, darwin, windows]
