name: houdini-rop-render
title: Houdini ROP Render
description: >-
  Renders a ROP from a saved Houdini hip file with hython, in frame chunks.
readme: |
  # Houdini ROP Render

  Renders one render operator (ROP) from a saved Houdini `.hip` file. Each task
  runs `hython` against a short Python script the template carries as an embedded
  file, which opens the hip, finds the ROP and renders the frames it was given.

  Each task renders a chunk of frames, ten per task by default. A chunk may
  skip frames, so a stepped range such as `1-100:2` still renders ten of its
  frames per task, loading the hip file once for each ten.

  ## Parameters

  - **Scene File** - the `.hip` file to render. It must be reachable from every
    worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **ROP Path** - the full node path of the ROP to render, for example
    `/out/mantra1`.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, ten frames per
  task by default. Each task receives its own frames as a comma-separated list
  of single frames (for example `1,3,5`) and passes it straight to the embedded
  script, which renders each run of consecutive frames in one `rop.render` call
  (so `1,2,3,7` is two calls, frames 1-3 and frame 7), so this preset needs no
  chunk-bounds extension.

  ## Requirements

  - Workers tagged `attr.worker.tag.houdini = true`
  - `hython` on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Houdini ROP Render
  extensions: [TASK_CHUNKING]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: RopPath
      type: STRING
      userInterface: { control: LINE_EDIT, label: ROP Path }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.houdini
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frames
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: NONCONTIGUOUS
      script:
        embeddedFiles:
          # name is an <Identifier> (spec 6.1) and is the key Task.File
          # references resolve against, so it cannot contain a dot. The
          # on-disk basename goes in filename instead.
          - name: render_chunk
            type: TEXT
            filename: render_chunk.py
            data: |
              import sys
              import hou

              hip, rop_path, frames = sys.argv[1], sys.argv[2], sys.argv[3]
              hou.hipFile.load(hip, ignore_load_warnings=True)
              rop = hou.node(rop_path)
              if rop is None:
                  raise SystemExit("no such ROP: " + rop_path)
              # sqi hands a chunk over as single frames. Merge each run of
              # consecutive frames into one render call; a lo-hi:step part is
              # rendered as written.
              run = None
              for part in frames.split(","):
                  expr, _, step = part.partition(":")
                  lo, _, hi = expr.partition("-")
                  if hi or step:
                      if run:
                          rop.render(frame_range=(run[0], run[1], 1))
                          run = None
                      rop.render(frame_range=(int(lo), int(hi or lo), int(step or 1)))
                  elif run and int(lo) == run[1] + 1:
                      run[1] = int(lo)
                  else:
                      if run:
                          rop.render(frame_range=(run[0], run[1], 1))
                      run = [int(lo), int(lo)]
              if run:
                  rop.render(frame_range=(run[0], run[1], 1))
        actions:
          onRun:
            command: hython
            args:
              - "{{Task.File.render_chunk}}"
              - "{{Param.SceneFile}}"
              - "{{Param.RopPath}}"
              - "{{Task.Param.Frames}}"
