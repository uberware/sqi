name: houdini-rop-render
title: Houdini ROP Render
description: >-
  Renders a ROP from a saved Houdini hip file with hython, in frame chunks.
readme: |
  # Houdini ROP Render

  Renders one render operator (ROP) from a saved Houdini `.hip` file. Each task
  runs `hython` against a short Python script the template carries as an embedded
  file, which opens the hip, finds the ROP and renders the frames it was given.

  ## Parameters

  - **Scene File** - the `.hip` file to render. It must be reachable from every
    worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **ROP Path** - the full node path of the ROP to render, for example
    `/out/mantra1`.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, up to ten
  frames per task by default, and each task loads the hip file once. A chunk
  may skip frames, so a stepped range such as `1-100:2` still puts up to ten
  frames in each task. Each task passes its frames as a compact frame range
  such as `1-10`, `1-19:2` or `1-3,7` straight to the embedded script, so this
  preset needs no chunk-bounds extension. The script renders each part of the
  range in one `rop.render` call and merges a part that continues a run of
  consecutive frames into that run's call, so `1-19:2` is one call and
  `1-3,7,8` is two.

  ## Requirements

  - Workers tagged `attr.worker.tag.houdini = true`
  - `hython`: the worker finds the newest Houdini install on Windows and Linux;
    on macOS put it on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Houdini ROP Render
  extensions: [TASK_CHUNKING]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: RopPath
      type: STRING
      userInterface: { control: LINE_EDIT, label: ROP Path }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.houdini
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frames
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: NONCONTIGUOUS
      script:
        embeddedFiles:
          # name is an <Identifier> (spec 6.1) and is the key Task.File
          # references resolve against, so it cannot contain a dot. The
          # on-disk basename goes in filename instead.
          - name: render_chunk
            type: TEXT
            filename: render_chunk.py
            data: |
              import re
              import sys
              import hou

              hip, rop_path, frames = sys.argv[1], sys.argv[2], sys.argv[3]
              hou.hipFile.load(hip, ignore_load_warnings=True)
              rop = hou.node(rop_path)
              if rop is None:
                  raise SystemExit("no such ROP: " + rop_path)
              # The chunk is a compact frame range such as 1-10, 1-19:2 or
              # 1-3,7,8, and frames may be negative (-5-5, -3--1). Each
              # lo-hi:step part is one render call, and parts that continue
              # one another (7,8 above, a run of two) merge into one.
              part_re = re.compile(r"(-?\d+)(?:-(-?\d+)(?::(\d+))?)?")
              ranges = []
              for part in frames.split(","):
                  m = part_re.fullmatch(part)
                  if m is None:
                      raise SystemExit("not a frame range part: " + part)
                  lo, hi, step = int(m[1]), int(m[2] or m[1]), int(m[3] or 1)
                  last = ranges[-1] if ranges else None
                  if last and step == last[2] == 1 and lo == last[1] + 1:
                      last[1] = hi
                  else:
                      ranges.append([lo, hi, step])
              for lo, hi, step in ranges:
                  rop.render(frame_range=(lo, hi, step))
        actions:
          onRun:
            command: hython
            args:
              - "{{Task.File.render_chunk}}"
              - "{{Param.SceneFile}}"
              - "{{Param.RopPath}}"
              - "{{Task.Param.Frames}}"
