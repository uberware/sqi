name: redshift-standalone-render
title: Redshift Standalone Render
description: >-
  Renders exported Redshift scene files with redshiftCmdLine, one frame per task.
readme: |
  # Redshift Standalone Render

  Renders a sequence of exported Redshift scene files (`.rs`) with
  `redshiftCmdLine`, Redshift's standalone renderer, so the farm never loads the
  application the scene came from. Redshift exports each frame of an animation
  as its own file, and each task renders one of them.

  ## Parameters

  - **Scene File Pattern** - the path of the exported scene files, with the
    frame number replaced by a run of `#` characters, e.g. `shot.####.rs`.
    The files must be reachable from every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  Each frame is its own task. The task's frame number replaces the run of `#`
  characters, padded with zeros to the run's length: frame 7 of
  `shot.####.rs` is `shot.0007.rs`. A frame number longer than the run is
  written in full.

  The pattern must contain exactly one run of `#` characters. A pattern with
  none, or with the `#` characters split into more than one run, is rejected
  when the job is submitted.

  Output paths come from the scene files themselves, as the exporter wrote them;
  this preset does not override them.

  Redshift renders on the GPU. This preset sends work to any worker with
  Redshift installed, not only to workers sqi has seen a GPU on: sqi detects
  GPUs only on Linux hosts with NVIDIA drivers, while Redshift also renders on
  Windows and on Apple Silicon Macs. On a worker that has Redshift installed but
  no GPU it can use, list `redshift` under `capabilities.disable` in the worker's
  configuration so it is not handed Redshift work.

  ## Requirements

  - Workers tagged `attr.worker.tag.redshift = true`
  - `redshiftCmdLine` on the worker's `PATH`
  - A GPU Redshift supports, and a Redshift license
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Redshift Standalone Render
  extensions: [EXPR]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File Pattern
        fileFilters:
          - label: Redshift scene files
            patterns: ["*.rs"]
        fileFilterDefault:
          label: Redshift scene files
          patterns: ["*.rs"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.redshift
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: INT
            range: "{{Param.Frames}}"
      script:
        let:
          - pad = Param.SceneFile.name.count('#')
          - "scene = Param.SceneFile.parent / Param.SceneFile.name.replace('#' * pad, zfill(Task.Param.Frame, pad)) if pad > 0 and '#' * pad in Param.SceneFile.name else fail('Scene File Pattern must contain exactly one run of # characters marking the frame number, e.g. shot.####.ass')"
        actions:
          onRun:
            command: redshiftCmdLine
            args: ["{{ scene }}"]
