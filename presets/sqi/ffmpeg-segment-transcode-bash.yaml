name: ffmpeg-segment-transcode-bash
title: FFmpeg Segment Transcode (Bash)
description: >-
  Splits a video into fixed-length slices, transcodes each on a different
  worker, then joins them with a bash script, so it needs Linux or macOS
  workers.
readme: |
  # FFmpeg Segment Transcode (Bash)

  Splits one source video into fixed-length slices, transcodes each slice on
  a different worker, then joins the finished slices back into a single
  output file. The join step is a bash script, so this variant needs Linux
  or macOS workers - use the Portable variant on Windows or a mixed farm.

  ## Parameters

  - **SourceFile** - the video to split.
  - **OutputFile** - the joined result. Its parent directory and stem also
    name the intermediate slice files the join step globs for.
  - **DurationSeconds** - the source's length in seconds. Type it in: nothing
    in the job template can measure a source file before the job is
    submitted. Too small silently drops the tail of the source - the last
    slice(s) are never scheduled. Too large schedules an extra task past the
    real end of the source: `ffmpeg` transcodes silence or a frozen frame for
    that slice, wasting a task, but the join step still globs it up, joins
    it in, and deletes it same as every other slice.
  - **SegmentSeconds** - the length of each slice, and so the number of
    tasks.
  - **VideoCodec**, **Quality** (CRF, lower is better), **AudioCodec** -
    passed straight to `ffmpeg` for every slice.

  ## How work is divided

  1. **Transcode** - fans out into one task per slice. Each task runs:
     `ffmpeg -ss <offset> -t <SegmentSeconds> -i SourceFile ...` and writes
     `<OutputFile stem>_seg_<00001>.<OutputFile suffix>` beside `OutputFile`.
     The number of tasks is `ceil(DurationSeconds / SegmentSeconds)`.
  2. **Join** - depends on every Transcode task, and runs an embedded bash
     script on the worker. The script globs `<dir>/<stem>_seg_*.<ext>` next
     to `OutputFile` - zero-padded slice numbers make lexical glob order the
     same as numeric order - builds a concat file list from the matches,
     then runs `ffmpeg -f concat -safe 0` to copy the streams into
     `OutputFile` with no re-encode. On success it deletes the slice files
     it just joined.

  The join script removes every slice file it globbed once the concat
  succeeds. If the join fails, the slice files are left on disk for you to
  inspect or remove by hand.

  ## Requirements

  `ffmpeg` and `bash` must be on `PATH` for every worker that runs this job,
  and workers must be tagged `attr.worker.tag.ffmpeg = true`. There is
  deliberately no `attr.worker.os.family` requirement: what this variant needs
  is a working `bash`, not a particular operating system, and tagging the
  workers that have one says so directly. This is a starting point - duplicate
  it to customize for your own pipeline.
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Segment Transcode
  extensions: [EXPR]
  parameterDefinitions:
    - name: SourceFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source File }
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output File }
    - name: DurationSeconds
      type: INT
      minValue: 1
      default: 600
      userInterface: { control: SPIN_BOX, label: Source Duration (seconds) }
    - name: SegmentSeconds
      type: INT
      minValue: 1
      default: 60
      userInterface: { control: SPIN_BOX, label: Slice Length (seconds) }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
    - name: AudioCodec
      type: STRING
      default: aac
      allowedValues: [aac, copy]
      userInterface: { control: DROPDOWN_LIST, label: Audio Codec }
  steps:
    - name: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Segment
            type: INT
            range: "0-{{ ceil(Param.DurationSeconds / Param.SegmentSeconds) - 1 }}"
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-ss"
              - "{{ Task.Param.Segment * Param.SegmentSeconds }}"
              - "-t"
              - "{{ Param.SegmentSeconds }}"
              - "-i"
              - "{{ Param.SourceFile }}"
              - "-c:v"
              - "{{ Param.VideoCodec }}"
              - "-crf"
              - "{{ Param.Quality }}"
              - "-c:a"
              - "{{ Param.AudioCodec }}"
              - "{{ Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(Task.Param.Segment, 5) + Param.OutputFile.suffix) }}"
    - name: Join
      dependencies:
        - dependsOn: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      script:
        embeddedFiles:
          - name: join
            type: TEXT
            runnable: true
            # LF is explicit, not incidental. This script may run under git-bash
            # on Windows, where a CRLF body fails at the first line with
            # "$'\r': command not found" rather than anything diagnosable.
            endOfLine: LF
            data: |
              #!/usr/bin/env bash
              set -euo pipefail

              out="$1"

              # Windows (git-bash): a drive-letter or UNC path arrives with
              # backslashes, which are not separators to dirname/basename or to
              # the glob below, so every path operation here would silently
              # produce garbage. Fold them to forward slashes, which bash, the
              # glob, and ffmpeg.exe all accept on Windows. Guarded on the
              # Windows path prefixes so a POSIX path that legitimately contains
              # a backslash is left untouched.
              case "$out" in
                [A-Za-z]:[\\/]* | \\\\*) out="${out//\\//}" ;;
              esac

              dir="$(dirname "$out")"
              base="$(basename "$out")"
              stem="${base%.*}"
              ext="${base##*.}"

              shopt -s nullglob
              segs=("${dir}/${stem}_seg_"*".${ext}")
              if [ ${#segs[@]} -eq 0 ]; then
                echo "no slices found matching ${dir}/${stem}_seg_*.${ext}" >&2
                exit 1
              fi

              # Zero-padded slice numbers make lexical order numeric order, so
              # the glob above is already in the right sequence.
              #
              # The list is written beside the output rather than in $TMPDIR
              # because ffmpeg is a native binary: under git-bash an mktemp path
              # like /tmp/tmp.XXXX reaches ffmpeg.exe through MSYS argument
              # conversion, and the name below is already host-native. It cannot
              # collide with the glob above, which requires "_seg_" and the
              # output's own extension.
              list="${dir}/${stem}_concat.txt"
              trap 'rm -f "$list"' EXIT
              : > "$list"
              for s in "${segs[@]}"; do
                printf "file '%s'\n" "$s" >> "$list"
              done

              ffmpeg -y -f concat -safe 0 -i "$list" -c copy "$out"
              rm -f "${segs[@]}"
        actions:
          onRun:
            # bash is invoked explicitly rather than relying on the shebang:
            # executing a shebang script directly is a POSIX kernel feature
            # (binfmt_script) with no Windows equivalent, so "command: bash"
            # is what lets this variant run under git-bash on Windows as well
            # as on Linux and macOS.
            command: bash
            args: ["{{Task.File.join}}", "{{Param.OutputFile}}"]
