name: ffmpeg-transcode
title: FFmpeg Transcode
description: >-
  Converts one video file to another format on a single worker, start to
  finish.
readme: |
  # FFmpeg Transcode

  Transcodes one video file into another with a single `ffmpeg` invocation on one
  worker. The whole file is converted by one task, so the job finishes no faster
  than one machine can encode it.

  Use FFmpeg Segment Transcode instead to split a long source across the farm.

  ## Parameters

  - **Source File** - the video to convert. It must be reachable from the worker
    that runs the job.
  - **Output File** - where the converted video is written. Its extension decides
    the container format.
  - **Video Codec** - `libx264`, `libx265`, or `copy` to pass the video through
    without re-encoding.
  - **Quality** - the constant rate factor passed as `-crf`. Lower is better
    quality and a larger file; 20 is a reasonable default.
  - **Audio Codec** - `aac`, or `copy` to pass the audio through untouched.

  ## How work is divided

  It is not. This product defines one step with one task and declares no OpenJD
  extensions, which also means it is never withheld from a worker on expression
  limits.

  ## Requirements

  - Workers tagged `attr.worker.tag.ffmpeg = true`
  - `ffmpeg` on the worker's `PATH`
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Transcode
  parameterDefinitions:
    - name: SourceFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source File }
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output File }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265, copy]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
    - name: AudioCodec
      type: STRING
      default: aac
      allowedValues: [aac, copy]
      userInterface: { control: DROPDOWN_LIST, label: Audio Codec }
  steps:
    - name: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-i"
              - "{{Param.SourceFile}}"
              - "-c:v"
              - "{{Param.VideoCodec}}"
              - "-crf"
              - "{{Param.Quality}}"
              - "-c:a"
              - "{{Param.AudioCodec}}"
              - "{{Param.OutputFile}}"
