name: cinema4d-take-render
title: Cinema 4D Take Render
description: >-
  Renders one named take of a saved Cinema 4D scene headless with Commandline,
  one frame per task by default.
readme: |
  # Cinema 4D Take Render

  Renders one take of a saved `.c4d` file with Maxon's `Commandline`, using the
  render settings stored in the scene. Each task renders a contiguous slice of
  the frame range, one frame per task by default. Use Cinema 4D Render instead
  to render the scene without naming a take.

  ## Parameters

  - **Scene File** - the `.c4d` file to render. It must be reachable from every
    worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **Take** - the name of the take to render, passed as `-take`. Takes are
    named, not pathed: enter the take's name alone. Whether a child take's name
    alone resolves is unverified.
  - **Output Path** - the output image path passed to Commandline as
    `-oimage`. Enter one. The flag is always passed, so an empty value reaches
    Commandline as an empty path rather than being omitted, and what it does
    with that is unverified.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking. The
  `SQI_CHUNK_BOUNDS` extension gives each task the first and last frame of its
  own slice, which is what lets the command pass `-frame <start> <end>`. A
  stepped range such as `1-9:4` splits into one task per frame, so a step
  argument is never needed.

  One frame per task is the default. Raise the chunk size to batch a frame range
  into a single Commandline launch, which trades parallelism for fewer scene
  loads.

  ## Requirements

  - Workers tagged `attr.worker.tag.cinema4d = true`
  - `Commandline` on the worker's `PATH`. On Linux, source Maxon's
    `setup_c4d_env` first so the command resolves.
  - Each render node must be licensed before it can render: run `Commandline`
    once interactively and sign in, or configure a licence model in
    `config.txt`. A node that has not been licensed is the most likely
    first-run failure.
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Cinema 4D Take Render
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: Cinema 4D scenes
            patterns: ["*.c4d"]
        fileFilterDefault:
          label: Cinema 4D scenes
          patterns: ["*.c4d"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: Take
      type: STRING
      userInterface: { control: LINE_EDIT, label: Take }
    - name: OutputPath
      type: PATH
      objectType: FILE
      dataFlow: OUT
      default: ""
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output Path }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.cinema4d
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 1
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: Commandline
            args:
              - "-nogui"
              - "-render"
              - "{{Param.SceneFile}}"
              - "-frame"
              - "{{Task.Param.Frame.Start}}"
              - "{{Task.Param.Frame.End}}"
              - "-take"
              - "{{Param.Take}}"
              - "-oimage"
              - "{{Param.OutputPath}}"
