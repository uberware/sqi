name: maya-scene-render
title: Maya Scene Render
description: >-
  Renders every renderable layer of a saved Maya scene with the Render batch
  command, one frame per task by default.
readme: |
  # Maya Scene Render

  Renders a saved Maya scene with Maya's `Render` batch command, writing image
  files to a directory you choose. Every layer the scene marks renderable is
  rendered; use Maya Layer Render instead to render one named layer.

  Each task renders a contiguous slice of the frame range, one frame per task by
  default.

  ## Parameters

  - **Scene File** - the `.ma` or `.mb` file to render. It must be reachable from
    every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **Output Directory** - where rendered images are written, passed to Maya as
    `-rd`.
  - **Renderer** - the Maya renderer token passed as `-r`. `file` uses the
    renderer stored in the scene.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, one frame per
  task by default. Raise the chunk size to batch several frames into a single
  Maya launch, which trades parallelism for fewer scene loads.

  The `SQI_CHUNK_BOUNDS` extension gives each task the first and last frame of
  its own slice, which is what lets the command pass `-s` and `-e` rather than a
  frame list.

  ## Requirements

  - Workers tagged `attr.worker.tag.maya = true`
  - `Render` on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Maya Scene Render
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: OutputDir
      type: PATH
      objectType: DIRECTORY
      dataFlow: OUT
      userInterface: { control: CHOOSE_DIRECTORY, label: Output Directory }
    - name: Renderer
      type: STRING
      default: file
      userInterface: { control: LINE_EDIT, label: Renderer }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.maya
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 1
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: Render
            args:
              - "-r"
              - "{{Param.Renderer}}"
              - "-s"
              - "{{Task.Param.Frame.Start}}"
              - "-e"
              - "{{Task.Param.Frame.End}}"
              - "-rd"
              - "{{Param.OutputDir}}"
              - "{{Param.SceneFile}}"
