name: prman-render
title: RenderMan Render
description: >-
  Renders exported RenderMan RIB files with prman, one frame per task.
readme: |
  # RenderMan Render

  Renders a sequence of exported RenderMan scene files (`.rib`) with `prman`,
  RenderMan's standalone renderer, so the farm never loads the application the
  scene came from. Each task renders one frame's RIB file.

  ## Parameters

  - **Scene File Pattern** - the path of the exported scene files, with the
    frame number replaced by a run of `#` characters, e.g. `shot.####.rib`.
    The files must be reachable from every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  Each frame is its own task. The task's frame number replaces the run of `#`
  characters, padded with zeros to the run's length: frame 7 of
  `shot.####.rib` is `shot.0007.rib`. A frame number longer than the run is
  written in full.

  The pattern must contain exactly one run of `#` characters. A pattern with
  none, or with the `#` characters split into more than one run, is rejected
  when the job is submitted.

  Output paths come from the RIB files themselves, as the exporter wrote them;
  this preset does not override them. `prman` resolves relative paths inside a
  RIB file against the task's working directory, not the RIB file's folder, so
  export RIB files with absolute paths.

  ## Requirements

  - Workers tagged `attr.worker.tag.renderman = true`
  - `prman` on the worker's `PATH`
  - A RenderMan license
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: RenderMan Render
  extensions: [EXPR]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File Pattern
        fileFilters:
          - label: RenderMan RIB files
            patterns: ["*.rib"]
        fileFilterDefault:
          label: RenderMan RIB files
          patterns: ["*.rib"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.renderman
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: INT
            range: "{{Param.Frames}}"
      script:
        let:
          - pad = Param.SceneFile.name.count('#')
          - "scene = Param.SceneFile.parent / Param.SceneFile.name.replace('#' * pad, zfill(Task.Param.Frame, pad)) if pad > 0 and '#' * pad in Param.SceneFile.name else fail('Scene File Pattern must contain exactly one run of # characters marking the frame number, e.g. shot.####.ass')"
        actions:
          onRun:
            command: prman
            args: ["-Progress", "{{ scene }}"]
