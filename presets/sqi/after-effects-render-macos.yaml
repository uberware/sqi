name: after-effects-render-macos
title: After Effects Render (macOS)
description: >-
  Renders one render-queue item of a saved After Effects project with aerender
  on macOS workers, ten frames per task by default.
readme: |
  # After Effects Render (macOS)

  Renders one item of a saved `.aep` project's render queue with Adobe's
  `aerender`, using that item's own render settings and output module. Each
  task renders a contiguous slice of the frame range, ten frames per task by
  default. Use After Effects Queue Render (macOS) instead to render
  everything the project has queued on one machine.

  This is the macOS variant. Its sibling, `after-effects-render-windows`, has
  the same parameters and passes `aerender` the same arguments; pick the one
  that matches your render nodes.

  ## Parameters

  - **Scene File** - the `.aep` project to render. It must be reachable from
    every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame. Each task passes its slice to `aerender`
    as `-s <start> -e <end>`; the end frame is inclusive.
  - **Render Queue Item** - the item's position in the render queue, counting
    from 1, passed as `-rqindex`.
  - **Frames Per Task** - how many frames each task renders. `aerender` is
    slow to start, so the default is 10 rather than 1.

  **A movie output must be one task.** After Effects cannot render one movie
  file (a QuickTime or other container, as opposed to an image sequence) from
  several machines. If the item writes a movie, set Frames Per Task to at
  least the number of frames in the range, so the whole range is one task.
  The preset cannot see the output format, so nothing enforces this.

  ## Why aerender runs through a wrapper

  `aerender` is reported to exit with status 0 even when a render fails, so a
  task that trusted its exit status would report every failure as a success.
  The task therefore runs a small `sh` script that runs `aerender`, streams
  its output to the task log unchanged, and fails the task when `aerender`
  exits non-zero or when any line of its output contains `aerender ERROR`, in
  any letter case.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking. The
  `SQI_CHUNK_BOUNDS` extension gives each task the first and last frame of its
  own slice. A stepped range such as `1-9:4` splits into one task per frame,
  so a step argument is never needed, and `aerender`'s `-i` is never used: it
  repeats frames rather than skipping them.

  ## Requirements

  - **macOS workers only.** The step requires `attr.worker.os.family` =
    `macos` as well as the tag.
  - Workers tagged `attr.worker.tag.aftereffects = true`
  - `aerender` on the worker's `PATH`. It lives in the install's folder, e.g.
    `/Applications/Adobe After Effects 2026`; add that folder to `PATH`.
  - `/bin/sh`, which ships with macOS, runs the wrapper.
  - On each render node, Adobe's render-only marker: an empty file named
    `ae_render_only_node.txt` in `/Users/Shared/Adobe`. It runs After Effects
    in its non-royalty-bearing, render-only mode; Adobe's network rendering
    page gives the licensing terms.
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: After Effects Render
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: After Effects projects
            patterns: ["*.aep"]
        fileFilterDefault:
          label: After Effects projects
          patterns: ["*.aep"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: RenderQueueItem
      type: INT
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Render Queue Item }
    - name: FramesPerTask
      type: INT
      default: 10
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Frames Per Task }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.aftereffects
            anyOf: ["true"]
          - name: attr.worker.os.family
            anyOf: ["macos"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: "{{Param.FramesPerTask}}"
              rangeConstraint: CONTIGUOUS
      script:
        embeddedFiles:
          # The aerender wrapper; after-effects-queue-render-macos carries the
          # same file byte for byte, and after-effects-render-windows carries a
          # PowerShell script with the same contract. /bin/sh runs it with
          # aerender's argv as its arguments, which "$@" passes on unchanged.
          # It keeps to POSIX sh: macOS's /bin/sh is bash in POSIX mode, and
          # Linux CI runs it under dash, with the os.family gate stripped, in
          # TestAfterEffectsPreset_WrapperFailsOnLoggedError.
          #
          # 2>&1 sends aerender's stderr down the same pipe, so a marker
          # printed on either stream is seen. tee streams every line to the
          # task log as it arrives and keeps a copy, which grep -i searches
          # for the marker case-insensitively, as PowerShell's -like does in
          # the Windows wrapper, once aerender has exited.
          #
          # POSIX sh has no pipefail: a pipeline's status is its last
          # command's, here tee's. So aerender's own status is written to a
          # file from inside the pipeline and read back, which keeps a
          # non-zero code (127 when aerender is not on PATH) rather than
          # tee's 0. A missing status file, a failed tee or an unreadable log
          # copy fails the task too: each means the output was not checked.
          #
          # The temporary directory under ${TMPDIR:-/tmp} is removed on every
          # exit. The HUP/INT/TERM traps turn a signal into an exit, so the
          # EXIT trap runs; the worker signals the whole process group, so
          # aerender and tee stop too. Only SIGKILL leaves the directory
          # behind.
          - name: aerender_wrapper
            type: TEXT
            filename: aerender_wrapper.sh
            data: |
              dir=
              trap '[ -z "$dir" ] || rm -rf "$dir"' EXIT
              trap 'exit 129' HUP
              trap 'exit 130' INT
              trap 'exit 143' TERM
              dir=$(mktemp -d "${TMPDIR:-/tmp}/aerender_wrapper.XXXXXX") || { echo 'aerender_wrapper: cannot create a temporary directory' >&2; exit 1; }
              { aerender "$@" 2>&1; echo "$?" >"$dir/status"; } | tee "$dir/log" || { echo 'aerender_wrapper: tee failed, so the output was not checked' >&2; exit 1; }
              status=$(cat "$dir/status" 2>/dev/null)
              case $status in
              0) ;;
              '') echo 'aerender_wrapper: aerender exit status unknown' >&2; exit 1 ;;
              *) exit "$status" ;;
              esac
              grep -qiF 'aerender ERROR' "$dir/log"
              case $? in
              0) exit 1 ;;
              1) exit 0 ;;
              *) echo 'aerender_wrapper: cannot read the output back' >&2; exit 1 ;;
              esac
        actions:
          onRun:
            command: /bin/sh
            args:
              - "{{Task.File.aerender_wrapper}}"
              - "-project"
              - "{{Param.SceneFile}}"
              - "-rqindex"
              - "{{Param.RenderQueueItem}}"
              - "-s"
              - "{{Task.Param.Frame.Start}}"
              - "-e"
              - "{{Task.Param.Frame.End}}"
              - "-v"
              - "ERRORS_AND_PROGRESS"
              - "-close"
              - "DO_NOT_SAVE_CHANGES"
