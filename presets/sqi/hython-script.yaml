name: hython-script
title: Run a Python Script in Houdini
description: >-
  Loads a Houdini hip file and runs a Python script in that session, once per
  frame or chunk of frames.
readme: |
  # Run a Python Script in Houdini

  Loads a Houdini hip file with `hython`, then runs your Python script inside
  that same Houdini session, once for every frame in a range or once for every
  chunk of frames. Use it for simulation caches, geometry exports, and scene
  checks or edits that need `hou`.

  ## Parameters

  - **Scene File** - the `.hip`, `.hiplc` or `.hipnc` file to load. It must be
    reachable from every worker that runs the job.
  - **Python Script** - the script body each task runs.
  - **Frame Range** - the frames to cover, in OpenJD range syntax: `1-100`,
    `1-100:2` for every second frame, or a list such as `1,5,10-20`.
  - **Frames per Task** - the most consecutive frames one task covers, one by
    default. A range that does not divide evenly is split into near-equal
    chunks: `1-10` at 4 is `1-4`, `5-7`, `8-10`.

  ## Frame variables

  The script reads its frames from `os.environ`:

  - `SQI_FRAME_START` - the task's first frame.
  - `SQI_FRAME_END` - the task's last frame.
  - `SQI_FRAMES` - the task's frames as OpenJD writes them, always `START-END`.
  - `SQI_FRAME` - the same as `SQI_FRAME_START`, the natural name at one frame
    per task.

  Before the script starts, the hip is loaded and the playbar is set to the
  task's first frame, so `hou.frame()` and `$F` start at `SQI_FRAME_START`. A
  task never covers a gap in the range: frames are grouped only while they are
  consecutive.

  ## Example

  This cooks a geometry ROP once for each frame of the task's chunk:

  ```python
  import os
  import hou

  rop = hou.node("/out/geo1")
  for frame in range(int(os.environ["SQI_FRAME_START"]), int(os.environ["SQI_FRAME_END"]) + 1):
      hou.setFrame(frame)
      rop.parm("execute").pressButton()
  ```

  ## How work is divided

  Each task loads the hip file once, then runs the script once, however many
  frames it covers. A simulation has to be cooked in order from its first frame,
  so it must be a single task: set **Frames per Task** to at least the number of
  frames in the range.

  ## How it runs

  The script is written to a file, `script.py`. A small launcher, started by
  `hython`, loads the hip and runs that file in the same process, so the script
  sees the loaded session. `__name__` is `"__main__"` and `sys.argv[0]` is the
  script's own path. An exception, or a non-zero `SystemExit`, fails the task.

  ## Requirements

  - Workers tagged `attr.worker.tag.houdini = true`
  - `hython`: the worker finds the newest Houdini install on Windows and Linux;
    on macOS put it on the worker's `PATH`
  - A Houdini license available to `hython`

  The script runs as the account the worker runs under and can run arbitrary
  code. On a shared farm, set **run as user** on the queue, which runs every
  task as an account the operator chooses; see the sqi documentation on task
  isolation.
category: General
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Hython Script
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: Houdini scenes
            patterns: ["*.hip", "*.hiplc", "*.hipnc"]
        fileFilterDefault:
          label: Houdini scenes
          patterns: ["*.hip", "*.hiplc", "*.hipnc"]
    - name: Script
      type: STRING
      minLength: 1
      userInterface:
        control: MULTILINE_EDIT
        label: Python Script
    - name: Frames
      type: STRING
      userInterface:
        control: LINE_EDIT
        label: Frame Range
    - name: FramesPerTask
      type: INT
      default: 1
      minValue: 1
      userInterface:
        control: SPIN_BOX
        label: Frames per Task
  steps:
    - name: Run
      hostRequirements:
        attributes:
          - name: attr.worker.tag.houdini
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: "{{Param.FramesPerTask}}"
              rangeConstraint: CONTIGUOUS
      script:
        embeddedFiles:
          - name: script
            type: TEXT
            filename: script.py
            data: "{{Param.Script}}"
          # Static text with no format strings: the hip path and the frame
          # values reach it as argv and are never substituted into Python
          # source.
          - name: launcher
            type: TEXT
            filename: launcher.py
            data: |
              # sqi hython-script launcher: sets the four SQI_FRAME* variables,
              # loads the hip, moves the playbar to the task's first frame and
              # runs the user's script in this process, so the script sees the
              # loaded Houdini session. An exception or a non-zero SystemExit
              # leaves hython with a non-zero exit status, which fails the task.
              import os
              import runpy
              import sys

              hip, script, start, end, frames = sys.argv[1:6]
              os.environ.update(SQI_FRAME=start, SQI_FRAME_START=start, SQI_FRAME_END=end, SQI_FRAMES=frames)

              import hou

              hou.hipFile.load(hip, ignore_load_warnings=True)
              hou.setFrame(int(start))

              sys.argv = [script]
              runpy.run_path(script, run_name="__main__")
        actions:
          onRun:
            command: hython
            args:
              - "{{Task.File.launcher}}"
              - "{{Param.SceneFile}}"
              - "{{Task.File.script}}"
              - "{{Task.Param.Frame.Start}}"
              - "{{Task.Param.Frame.End}}"
              - "{{Task.Param.Frame}}"
