name: husk-usd-render
title: Husk USD Render
description: >-
  Renders a USD stage with SideFX husk through Karma or any Hydra delegate, one
  frame per task by default.
readme: |
  # Husk USD Render

  Renders a USD stage with `husk`, SideFX's command-line USD renderer, without
  opening Houdini. `husk` renders through Karma or any other Hydra delegate
  installed on the worker.

  ## Parameters

  - **Scene File** - the USD stage to render (`.usd`, `.usda`, `.usdc` or
    `.usdz`). It must be reachable from every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **Hydra Delegate** - the render delegate `husk` uses, passed as
    `--renderer`. Leave it empty to use the delegate the stage's render
    settings choose. `husk --list-renderers` prints the names a worker
    accepts.

  ## How work is divided

  Each task renders a contiguous chunk of the frame range, one frame per task
  by default. The task passes `husk` its first frame and its frame count, so a
  larger chunk size renders several frames in one `husk` launch, with fewer
  stage loads and less parallelism. A stepped range such as `1-100:2` always
  runs one task per frame, so `husk` never renders a frame the range leaves
  out.

  Output paths come from the stage's render products; `husk` creates any
  missing output directories.

  ## Requirements

  - Workers tagged `attr.worker.tag.husk = true`
  - `husk` on the worker's `PATH`
  - A Houdini license available to `husk`, and a Karma license when rendering
    with Karma
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Husk USD Render
  extensions: [TASK_CHUNKING, EXPR]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: USD stages
            patterns: ["*.usd", "*.usda", "*.usdc", "*.usdz"]
        fileFilterDefault:
          label: USD stages
          patterns: ["*.usd", "*.usda", "*.usdc", "*.usdz"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: Renderer
      type: STRING
      default: ""
      userInterface: { control: LINE_EDIT, label: Hydra Delegate }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.husk
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 1
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: husk
            args:
              - "{{ ['--renderer', Param.Renderer] if Param.Renderer != '' else [] }}"
              - "--frame"
              - "{{ min(Task.Param.Frame) }}"
              - "--frame-count"
              - "{{ len(Task.Param.Frame) }}"
              - "--make-output-path"
              - "--no-mplay"
              - "-V"
              - "2a"
              - "{{Param.SceneFile}}"
