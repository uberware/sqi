name: nuke-write-render
title: Nuke Write Render
description: >-
  Renders one named Write node from a saved Nuke script, in frame chunks.
readme: |
  # Nuke Write Render

  Renders a single named Write node from a saved Nuke script with `nuke -x -X`.
  Use Nuke Script Render instead to render every enabled Write node in one job.

  Each task renders a contiguous chunk of frames, ten per task by default.

  ## Parameters

  - **Scene File** - the `.nk` script to render. It must be reachable from every
    worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **Write Node** - the name of the Write node to render, passed to Nuke as `-X`.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, ten frames per
  task by default. Each task receives its own frames as a list and passes them to
  Nuke's `-F` flag directly, so this preset needs no chunk-bounds extension.

  ## Requirements

  - Workers tagged `attr.worker.tag.nuke = true`
  - `nuke` on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Nuke Write Render
  extensions: [TASK_CHUNKING]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: WriteNode
      type: STRING
      userInterface: { control: LINE_EDIT, label: Write Node }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.nuke
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frames
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: nuke
            args:
              - "-x"
              - "-X"
              - "{{Param.WriteNode}}"
              - "-F"
              - "{{Task.Param.Frames}}"
              - "{{Param.SceneFile}}"
