name: nuke-script-render
title: Nuke Script Render
description: >-
  Renders every enabled Write node of a saved Nuke script, in frame chunks.
readme: |
  # Nuke Script Render

  Renders a saved Nuke script with `nuke -x`, executing every Write node the
  script leaves enabled. Use Nuke Write Render instead to render one named Write
  node.

  ## Parameters

  - **Scene File** - the `.nk` script to render. It must be reachable from every
    worker that runs the job. A worker running Non-commercial Nuke renders only
    scripts saved by Non-commercial Nuke (`.nknc`), not a plain `.nk` from a
    commercial Nuke.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, up to ten
  frames per task by default. Each task passes its frames, as a `start-end`
  range, to Nuke's `-F` flag directly, so this preset needs no chunk-bounds
  extension. A chunk never spans a gap, so a stepped range such as `1-100:2`
  becomes one task per frame.

  Change the step's `chunks.defaultTaskCount` to trade parallelism against the
  cost of loading the script once per task.

  The task's progress bar moves as Nuke finishes each frame, once every
  enabled Write node has written it.

  ## Requirements

  - Workers tagged `attr.worker.tag.nuke = true`
  - A `nuke` command the worker can resolve: its `worker.commands` entry, a
    `nuke` on its `PATH`, or the Nuke install it detects. Non-commercial Nuke
    also needs `args: ["--nc"]` in that entry, and its output is limited to
    1920 x 1080.
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Nuke Script Render
  extensions: [TASK_CHUNKING, SQI_LOG_PROGRESS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.nuke
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frames
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: CONTIGUOUS
      SQI_LOG_PROGRESS:
        # From Nuke 17.1v2's output (test/integration/testdata/progress):
        # after the last Write node has written a frame, Nuke prints
        # "Frame N (i of n)" on a line of its own, once per frame however
        # many Write nodes render. The "Writing ... took" lines before it
        # repeat once per Write node and are left alone.
        progress:
          - '^Frame (?P<framedone>-?\d+) \(\d+ of \d+\)'
        status:
          - '^(?P<status>Frame -?\d+ \(\d+ of \d+\))'
      script:
        actions:
          onRun:
            command: nuke
            args:
              - "-x"
              - "-F"
              - "{{Task.Param.Frames}}"
              - "{{Param.SceneFile}}"
