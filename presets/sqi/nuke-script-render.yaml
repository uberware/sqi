name: nuke-script-render
title: Nuke Script Render
description: >-
  Renders every enabled Write node of a saved Nuke script, in frame chunks.
readme: |
  # Nuke Script Render

  Renders a saved Nuke script with `nuke -x`, executing every Write node the
  script leaves enabled. Use Nuke Write Render instead to render one named Write
  node.

  Each task renders a contiguous chunk of frames, ten per task by default.

  ## Parameters

  - **Scene File** - the `.nk` script to render. It must be reachable from every
    worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, ten frames per
  task by default. Each task receives its own frames as a list and passes them to
  Nuke's `-F` flag directly, so this preset needs no chunk-bounds extension.

  Raise or lower the chunk size to trade parallelism against the cost of loading
  the script once per task.

  ## Requirements

  - Workers tagged `attr.worker.tag.nuke = true`
  - `nuke` on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Nuke Script Render
  extensions: [TASK_CHUNKING]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Scene File }
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.nuke
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frames
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: nuke
            args:
              - "-x"
              - "-F"
              - "{{Task.Param.Frames}}"
              - "{{Param.SceneFile}}"
