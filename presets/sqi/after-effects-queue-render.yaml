name: after-effects-queue-render
title: After Effects Queue Render
description: >-
  Renders everything a saved After Effects project has queued, as one task on
  one Windows or macOS worker, with aerender.
readme: |
  # After Effects Queue Render

  Renders whatever the saved `.aep` project has queued in its render queue, on
  one machine, as a single task. Each queued item renders with its own render
  settings, output module and time span, exactly as the project was saved.
  Use After Effects Render instead to split one queue item's frames across
  machines.

  ## Parameters

  - **Scene File** - the `.aep` project to render. It must be reachable from
    the worker that runs the job. Queue the items you want rendered and save
    the project before submitting.

  ## How failures are detected

  `aerender` is reported to exit with status 0 even when a render fails, so a
  task that trusted its exit status would report every failure as a success.
  This preset therefore declares the `SQI_LOG_CHECKS` extension: the task also
  fails when any line of `aerender`'s output contains `aerender ERROR`, in any
  letter case. A failure that neither makes `aerender` exit non-zero nor
  prints `aerender ERROR` is still reported as a success.

  ## Requirements

  - **Windows or macOS workers only.** The step requires
    `attr.worker.os.family` = `windows` or `macos` as well as the tag.
  - Workers tagged `attr.worker.tag.aftereffects = true`
  - An `aerender` command the worker can resolve: its `worker.commands`
    entry, an `aerender` on its `PATH`, or the After Effects install it
    detects, e.g.
    `C:\Program Files\Adobe\Adobe After Effects 2026\Support Files\aerender.exe`
    or `/Applications/Adobe After Effects 2026/aerender`.
  - On each render node, Adobe's render-only marker: an empty file named
    `ae_render_only_node.txt` in `C:\Users\Public\Documents\Adobe` on Windows
    or `/Users/Shared/Adobe` on macOS. It runs After Effects in its
    non-royalty-bearing, render-only mode; Adobe's network rendering page gives
    the licensing terms.
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: After Effects Queue Render
  extensions: [SQI_LOG_CHECKS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: After Effects projects
            patterns: ["*.aep"]
        fileFilterDefault:
          label: After Effects projects
          patterns: ["*.aep"]
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.aftereffects
            anyOf: ["true"]
          - name: attr.worker.os.family
            anyOf: ["windows", "macos"]
      SQI_LOG_CHECKS:
        failOn:
          - "(?i)aerender ERROR"
      script:
        actions:
          onRun:
            command: aerender
            args:
              - "-project"
              - "{{Param.SceneFile}}"
              - "-v"
              - "ERRORS_AND_PROGRESS"
              - "-close"
              - "DO_NOT_SAVE_CHANGES"
