name: ffmpeg-segment-transcode-expr
title: FFmpeg Segment Transcode (Portable)
description: >-
  Splits a video into fixed-length slices, transcodes each on a different
  worker, then joins them with a template-generated file list so it runs on
  Linux, macOS and Windows workers alike.
readme: |
  # FFmpeg Segment Transcode (Portable)

  Splits one source video into fixed-length slices, transcodes each slice on a
  different worker, then joins the finished slices back into a single output
  file. This variant needs no shell on the worker: the file list the join step
  reads is generated by the job template itself using OpenJD's `EXPR`
  extension, so the same template runs unchanged on Linux, macOS and Windows
  workers.

  ## Parameters

  - **SourceFile** - the video to split.
  - **OutputFile** - the joined result. Its parent directory and stem also
    name the intermediate slice files.
  - **DurationSeconds** - the source's length in seconds. Type it in: nothing
    in the job template can measure a source file before the job is
    submitted. Too small silently drops the tail of the source - the last
    slice(s) are never scheduled. Too large schedules an extra task past the
    real end of the source: `ffmpeg` transcodes silence or a frozen frame for
    that slice, wasting a task, and its slice file is still concatenated
    into the join, then left on disk afterward (see Cleanup).
  - **SegmentSeconds** - the length of each slice, and so the number of
    tasks.
  - **VideoCodec**, **Quality** (CRF, lower is better), **AudioCodec** -
    passed straight to `ffmpeg` for every slice.

  ## How work is divided

  1. **Transcode** - fans out into one task per slice. Each task runs:
     `ffmpeg -ss <offset> -t <SegmentSeconds> -i SourceFile ...` and writes
     `<OutputFile stem>_seg_<00001>.<OutputFile suffix>` beside `OutputFile`.
     The number of tasks is `ceil(DurationSeconds / SegmentSeconds)`.
  2. **Join** - depends on every Transcode task. An embedded file lists every
     slice path as `file '<path>'`, one per line, built with an `EXPR`
     `join()` expression over a `range()` comprehension - no script, no loop
     on the worker. `ffmpeg -f concat -safe 0` reads that list and copies the
     streams into `OutputFile` with no re-encode.

  Building the join step's file list is charged against this template's
  `EXPR` evaluation budget at submission time, and that cost grows with the
  number of slices. It comfortably fits jobs of up to about 400 slices; a
  longer source needs a longer `SegmentSeconds` to stay under that, or use
  the Bash or PowerShell variant instead, whose join step costs the same
  regardless of slice count (it lists slices with a directory glob at run
  time, not at submission time).

  Unlike the Bash and PowerShell variants, this template does not remove the
  per-slice files after a successful join - there is no shell step to do it
  in. They are left beside `OutputFile` for you to delete.

  ## Requirements

  `ffmpeg` must be on `PATH` for every worker that runs this job, and workers
  must be tagged `attr.worker.tag.ffmpeg = true`. This is a starting point -
  duplicate it to customize for your own pipeline.
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Segment Transcode
  extensions: [EXPR]
  parameterDefinitions:
    - name: SourceFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source File }
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output File }
    - name: DurationSeconds
      type: INT
      minValue: 1
      default: 600
      userInterface: { control: SPIN_BOX, label: Source Duration (seconds) }
    - name: SegmentSeconds
      type: INT
      minValue: 1
      default: 60
      userInterface: { control: SPIN_BOX, label: Slice Length (seconds) }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
    - name: AudioCodec
      type: STRING
      default: aac
      allowedValues: [aac, copy]
      userInterface: { control: DROPDOWN_LIST, label: Audio Codec }
  steps:
    - name: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Segment
            type: INT
            range: "0-{{ ceil(Param.DurationSeconds / Param.SegmentSeconds) - 1 }}"
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-ss"
              - "{{ Task.Param.Segment * Param.SegmentSeconds }}"
              - "-t"
              - "{{ Param.SegmentSeconds }}"
              - "-i"
              - "{{ Param.SourceFile }}"
              - "-c:v"
              - "{{ Param.VideoCodec }}"
              - "-crf"
              - "{{ Param.Quality }}"
              - "-c:a"
              - "{{ Param.AudioCodec }}"
              - "{{ Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(Task.Param.Segment, 5) + Param.OutputFile.suffix) }}"
    - name: Join
      dependencies:
        - dependsOn: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      script:
        embeddedFiles:
          - name: segments
            type: TEXT
            data: |
              {{ join(["file '" + string(Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(i, 5) + Param.OutputFile.suffix)) + "'" for i in range(ceil(Param.DurationSeconds / Param.SegmentSeconds))], "\n") }}
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-f"
              - "concat"
              - "-safe"
              - "0"
              - "-i"
              - "{{Task.File.segments}}"
              - "-c"
              - "copy"
              - "{{Param.OutputFile}}"
