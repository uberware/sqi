# SPDX-License-Identifier: AGPL-3.0-or-later
name: ffmpeg-segment-transcode-expr
title: FFmpeg Segment Transcode (Portable)
description: >-
  Splits a video into fixed-length slices, converts each on a different worker,
  then joins them back into one file. Enter the source's length in seconds -
  nothing can measure it before the job is submitted, and a value that is too
  small silently drops the tail. Needs no shell at all: the join step's file
  list is written by the template itself, so this variant runs on Linux, macOS
  and Windows workers alike. The cost of writing that list is charged at
  submission and grows with the slice count, so it suits jobs of up to 400
  slices - a longer source needs a longer slice to stay under that. Past 400,
  use the Bash or PowerShell variant, whose cost does not grow. Slice files are
  left beside the output for you to remove. Requires ffmpeg on PATH. A starting
  point - duplicate to customize for your pipeline.
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Segment Transcode
  extensions: [EXPR]
  parameterDefinitions:
    - name: SourceFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source File }
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output File }
    - name: DurationSeconds
      type: INT
      minValue: 1
      default: 600
      userInterface: { control: SPIN_BOX, label: Source Duration (seconds) }
    - name: SegmentSeconds
      type: INT
      minValue: 1
      default: 60
      userInterface: { control: SPIN_BOX, label: Slice Length (seconds) }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
    - name: AudioCodec
      type: STRING
      default: aac
      allowedValues: [aac, copy]
      userInterface: { control: DROPDOWN_LIST, label: Audio Codec }
  steps:
    - name: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Segment
            type: INT
            range: "0-{{ ceil(Param.DurationSeconds / Param.SegmentSeconds) - 1 }}"
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-ss"
              - "{{ Task.Param.Segment * Param.SegmentSeconds }}"
              - "-t"
              - "{{ Param.SegmentSeconds }}"
              - "-i"
              - "{{ Param.SourceFile }}"
              - "-c:v"
              - "{{ Param.VideoCodec }}"
              - "-crf"
              - "{{ Param.Quality }}"
              - "-c:a"
              - "{{ Param.AudioCodec }}"
              - "{{ Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(Task.Param.Segment, 5) + Param.OutputFile.suffix) }}"
    - name: Join
      dependencies:
        - dependsOn: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      script:
        embeddedFiles:
          - name: segments
            type: TEXT
            data: |
              {{ join(["file '" + string(Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(i, 5) + Param.OutputFile.suffix)) + "'" for i in range(ceil(Param.DurationSeconds / Param.SegmentSeconds))], "\n") }}
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-f"
              - "concat"
              - "-safe"
              - "0"
              - "-i"
              - "{{Task.File.segments}}"
              - "-c"
              - "copy"
              - "{{Param.OutputFile}}"
