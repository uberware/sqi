name: ffmpeg-sequence-encode
title: FFmpeg Sequence Encode
description: >-
  Encodes a numbered image sequence into a single video file on one worker.
readme: |
  # FFmpeg Sequence Encode

  Encodes a numbered image sequence - the frames a render produces - into one
  video file. A single `ffmpeg` invocation on one worker reads the sequence and
  writes the movie.

  ## Parameters

  - **Source Pattern** - the image sequence to read, as an ffmpeg pattern such as
    `render.%04d.exr`. It must be reachable from the worker that runs the job.
  - **Start Frame** - the first frame number to read, passed as `-start_number`.
  - **End Frame** - the last frame number to read. Together with the start frame
    it decides how many frames are encoded.
  - **Frame Rate** - frames per second of the resulting video.
  - **Output Directory** - where the encoded video is written.
  - **Video Codec** - `libx264` or `libx265`.
  - **Quality** - the constant rate factor passed as `-crf`. Lower is better
    quality and a larger file.

  ## How work is divided

  It is not. This product defines one step with one task: encoding a sequence
  into a single container is inherently sequential.

  The frame count handed to ffmpeg is computed from the start and end frames by
  an expression, which is why the template declares the `EXPR` extension.

  ## Requirements

  - Workers tagged `attr.worker.tag.ffmpeg = true`
  - `ffmpeg` on the worker's `PATH`
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Sequence Encode
  extensions: [EXPR]
  parameterDefinitions:
    - name: SourcePattern
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source Pattern }
    - name: StartFrame
      type: INT
      default: 1
      userInterface: { control: SPIN_BOX, label: First Frame }
    - name: EndFrame
      type: INT
      default: 100
      userInterface: { control: SPIN_BOX, label: Last Frame }
    - name: FrameRate
      type: INT
      default: 24
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Frame Rate }
    - name: OutputDir
      type: PATH
      objectType: DIRECTORY
      dataFlow: OUT
      userInterface: { control: CHOOSE_DIRECTORY, label: Output Directory }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
  steps:
    - name: Encode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-framerate"
              - "{{Param.FrameRate}}"
              - "-start_number"
              - "{{Param.StartFrame}}"
              - "-i"
              - "{{Param.SourcePattern}}"
              - "-frames:v"
              - "{{ Param.EndFrame - Param.StartFrame + 1 }}"
              - "-c:v"
              - "{{Param.VideoCodec}}"
              - "-crf"
              - "{{Param.Quality}}"
              - "-pix_fmt"
              - "yuv420p"
              - "{{ Param.OutputDir / (rstrip(split(Param.SourcePattern.stem, '%')[0], '_-.') + '.mp4') }}"
