name: ffmpeg-segment-transcode-powershell
title: FFmpeg Segment Transcode (PowerShell)
description: >-
  Splits a video into fixed-length slices, transcodes each on a different
  worker, then joins them with a PowerShell script, so it needs Windows
  workers.
readme: |
  # FFmpeg Segment Transcode (PowerShell)

  Splits one source video into fixed-length slices, transcodes each slice on
  a different worker, then joins the finished slices back into a single
  output file. The join step is a PowerShell script, so this variant needs
  Windows workers - use the Portable variant on a mixed farm.

  ## Parameters

  - **SourceFile** - the video to split.
  - **OutputFile** - the joined result. Its parent directory and stem also
    name the intermediate slice files the join step lists.
  - **DurationSeconds** - the source's length in seconds. Type it in: nothing
    in the job template can measure a source file before the job is
    submitted. Too small silently drops the tail of the source - the last
    slice(s) are never scheduled. Too large schedules an extra task past the
    real end of the source: `ffmpeg` transcodes silence or a frozen frame for
    that slice, wasting a task, but the join step still lists it, joins it
    in, and deletes it same as every other slice.
  - **SegmentSeconds** - the length of each slice, and so the number of
    tasks.
  - **VideoCodec**, **Quality** (CRF, lower is better), **AudioCodec** -
    passed straight to `ffmpeg` for every slice.

  ## How work is divided

  1. **Transcode** - fans out into one task per slice. Each task runs:
     `ffmpeg -ss <offset> -t <SegmentSeconds> -i SourceFile ...` and writes
     `<OutputFile stem>_seg_<00001>.<OutputFile suffix>` beside `OutputFile`.
     The number of tasks is `ceil(DurationSeconds / SegmentSeconds)`.
  2. **Join** - depends on every Transcode task, and runs an embedded
     PowerShell script on the worker. The script lists
     `<dir>\<stem>_seg_*<ext>` next to `OutputFile` with `Get-ChildItem`,
     sorted by name - zero-padded slice numbers make that the same as
     numeric order - writes the matches to a BOM-less UTF-8 concat file list
     (a BOM breaks the concat demuxer's parse of the first line), then runs
     `ffmpeg -f concat -safe 0` to copy the streams into `OutputFile` with no
     re-encode. On success it deletes the slice files it just joined.

  The join script removes every slice file it listed once the concat
  succeeds. If the join fails, the slice files are left on disk for you to
  inspect or remove by hand.

  ## Requirements

  `ffmpeg` and `powershell` must be on `PATH` for every worker that runs this
  job, and workers must be tagged `attr.worker.tag.ffmpeg = true` with
  `attr.worker.os.family` set to `windows`. This is a starting point -
  duplicate it to customize for your own pipeline.
category: Transcoding
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: FFmpeg Segment Transcode
  extensions: [EXPR]
  parameterDefinitions:
    - name: SourceFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface: { control: CHOOSE_INPUT_FILE, label: Source File }
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface: { control: CHOOSE_OUTPUT_FILE, label: Output File }
    - name: DurationSeconds
      type: INT
      minValue: 1
      default: 600
      userInterface: { control: SPIN_BOX, label: Source Duration (seconds) }
    - name: SegmentSeconds
      type: INT
      minValue: 1
      default: 60
      userInterface: { control: SPIN_BOX, label: Slice Length (seconds) }
    - name: VideoCodec
      type: STRING
      default: libx264
      allowedValues: [libx264, libx265]
      userInterface: { control: DROPDOWN_LIST, label: Video Codec }
    - name: Quality
      type: INT
      default: 20
      minValue: 0
      maxValue: 51
      userInterface: { control: SPIN_BOX, label: Quality (CRF, lower is better) }
    - name: AudioCodec
      type: STRING
      default: aac
      allowedValues: [aac, copy]
      userInterface: { control: DROPDOWN_LIST, label: Audio Codec }
  steps:
    - name: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
          - name: attr.worker.os.family
            anyOf: ["windows"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Segment
            type: INT
            range: "0-{{ ceil(Param.DurationSeconds / Param.SegmentSeconds) - 1 }}"
      script:
        actions:
          onRun:
            command: ffmpeg
            args:
              - "-y"
              - "-ss"
              - "{{ Task.Param.Segment * Param.SegmentSeconds }}"
              - "-t"
              - "{{ Param.SegmentSeconds }}"
              - "-i"
              - "{{ Param.SourceFile }}"
              - "-c:v"
              - "{{ Param.VideoCodec }}"
              - "-crf"
              - "{{ Param.Quality }}"
              - "-c:a"
              - "{{ Param.AudioCodec }}"
              - "{{ Param.OutputFile.parent / (Param.OutputFile.stem + '_seg_' + zfill(Task.Param.Segment, 5) + Param.OutputFile.suffix) }}"
    - name: Join
      dependencies:
        - dependsOn: Transcode
      hostRequirements:
        attributes:
          - name: attr.worker.tag.ffmpeg
            anyOf: ["true"]
          - name: attr.worker.os.family
            anyOf: ["windows"]
      script:
        embeddedFiles:
          - name: join
            filename: join.ps1
            type: TEXT
            runnable: true
            data: |
              $ErrorActionPreference = 'Stop'

              $out = $args[0]
              $dir = Split-Path -Parent $out
              $stem = [System.IO.Path]::GetFileNameWithoutExtension($out)
              $ext = [System.IO.Path]::GetExtension($out)

              # Zero-padded slice numbers make lexical order numeric order.
              $segs = Get-ChildItem -Path $dir -Filter "$stem`_seg_*$ext" | Sort-Object Name
              if ($segs.Count -eq 0) {
                Write-Error "no slices found matching $dir\$stem`_seg_*$ext"
                exit 1
              }

              $list = [System.IO.Path]::GetTempFileName()
              try {
                $lines = $segs | ForEach-Object { "file '" + $_.FullName + "'" }
                # Encoding is explicit and deliberate: ASCII (Set-Content's implicit
                # choice) silently mangles non-ASCII slice paths, and -Encoding UTF8
                # writes a BOM on Windows PowerShell 5.1 that breaks the concat
                # demuxer's parse of the first "file" line. BOM-less UTF-8 avoids both.
                [System.IO.File]::WriteAllLines($list, $lines, (New-Object System.Text.UTF8Encoding $false))
                ffmpeg -y -f concat -safe 0 -i $list -c copy $out
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                $segs | Remove-Item -Force
              } finally {
                Remove-Item -Force $list -ErrorAction SilentlyContinue
              }
        actions:
          onRun:
            command: powershell
            args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "{{Task.File.join}}", "{{Param.OutputFile}}"]
