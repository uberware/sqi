name: mistika-vr-render
title: Mistika VR Render
description: >-
  Renders a saved Mistika VR project on the command line, in frame chunks.
readme: |
  # Mistika VR Render

  Renders a saved Mistika VR project by invoking `vr` in render mode. Each task
  renders a contiguous slice of the frame range.

  ## Parameters

  - **Scene File** - the Mistika VR project to render. It must be reachable from
    every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  The frame range expands into tasks through OpenJD task chunking, ten frames per
  task by default. The `SQI_CHUNK_BOUNDS` extension gives each task the first and
  last frame of its own slice, which is what lets the command pass `-s` and `-e`
  rather than a frame list.

  There is no in-application submitter for this product: build the job from the
  sqi web UI or the Python client rather than from inside the application.

  ## Requirements

  - Workers tagged `attr.worker.tag.mistikavr = true`
  - `vr` on the worker's `PATH`
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Mistika VR Render
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: Mistika render jobs
            patterns: ["*.rnd"]
        fileFilterDefault:
          label: Mistika render jobs
          patterns: ["*.rnd"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.mistikavr
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 10
              rangeConstraint: CONTIGUOUS
      script:
        actions:
          onRun:
            command: vr
            args:
              - "-r"
              - "{{Param.SceneFile}}"
              - "-s"
              - "{{Task.Param.Frame.Start}}"
              - "-e"
              - "{{Task.Param.Frame.End}}"
