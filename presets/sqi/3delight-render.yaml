name: 3delight-render
title: 3Delight Render
description: >-
  Renders exported 3Delight NSI files with renderdl, one frame per task.
readme: |
  # 3Delight Render

  Renders a sequence of exported 3Delight scene files (`.nsi`) with `renderdl`,
  3Delight's standalone renderer, so the farm never loads the application the
  scene came from. 3Delight exports each frame of an animation as its own file,
  and each task renders one of them.

  ## Parameters

  - **Scene File Pattern** - the path of the exported scene files, with the
    frame number replaced by a run of `#` characters, e.g. `shot.####.nsi`.
    The files must be reachable from every worker that runs the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.

  ## How work is divided

  Each frame is its own task. The task's frame number replaces the run of `#`
  characters, padded with zeros to the run's length: frame 7 of
  `shot.####.nsi` is `shot.0007.nsi`. A frame number longer than the run is
  written in full.

  The pattern must contain exactly one run of `#` characters. A pattern with
  none, or with the `#` characters split into more than one run, is rejected
  when the job is submitted.

  Output paths come from the scene files themselves, as the exporter wrote them;
  this preset does not override them. A separate static-geometry file that a
  frame's file refers to is read from wherever the exporter wrote it.

  ## Requirements

  - Workers tagged `attr.worker.tag.3delight = true`
  - `renderdl` on the worker's `PATH`
  - A 3Delight license
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: 3Delight Render
  extensions: [EXPR]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File Pattern
        fileFilters:
          - label: 3Delight NSI files
            patterns: ["*.nsi", "*.nsia"]
        fileFilterDefault:
          label: 3Delight NSI files
          patterns: ["*.nsi", "*.nsia"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.3delight
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: INT
            range: "{{Param.Frames}}"
      script:
        let:
          - pad = Param.SceneFile.name.count('#')
          - "scene = Param.SceneFile.parent / Param.SceneFile.name.replace('#' * pad, zfill(Task.Param.Frame, pad)) if pad > 0 and '#' * pad in Param.SceneFile.name else fail('Scene File Pattern must contain exactly one run of # characters marking the frame number, e.g. shot.####.ass')"
        actions:
          onRun:
            command: renderdl
            args: ["-progress", "{{ scene }}"]
