name: usdrecord-render
title: USD Record Render
description: >-
  Renders image frames of a USD stage with Houdini's usdrecord, for quick
  review renders and turntables.
readme: |
  # USD Record Render

  Renders image frames of a USD stage with `usdrecord`, the recorder that ships
  with Houdini, without opening Houdini. Use it for review renders and
  turntables. It uses Houdini's copy of `usdrecord`; a plain OpenUSD
  `usdrecord` is not used. For final-quality USD renders, use the Husk USD
  Render preset.

  ## Parameters

  - **Scene File** - the USD stage to render (`.usd`, `.usda`, `.usdc` or
    `.usdz`). It must be reachable from every worker that runs the job.
  - **Output Image Pattern** - where the frames are written, e.g.
    `/mnt/show/review/preview.####.png`. The file name must contain exactly one
    run of `#`, and the length of the run is the frame number's padding:
    `preview.####.png` writes `preview.0007.png`. A pattern with no `#`, or
    with two separate runs, is rejected when you submit the job. The file type
    comes from the extension. Missing folders in the path are created. The path
    may not contain `#` outside the file name's run, or any `{` or `}`:
    `usdrecord` reads a `#` in a folder as a second frame number and formats the
    path with Python's `str.format`, which reads braces as fields, so such a
    path is rejected when you submit the job.
  - **Frames** - the frame range, in OpenJD range syntax, e.g. `1-100` or
    `1-100:2` for every second frame.
  - **Frames per Task** - the most consecutive frames one task renders, ten by
    default. A range that does not divide evenly is split into near-equal
    chunks: `1-12` at 5 is `1-4`, `5-8` and `9-12`.
  - **Renderer** - the Hydra renderer, by the name `usdrecord --help` lists.
    Leave it empty to use `usdrecord`'s default, Storm.
  - **Camera** - the camera to render through, by its prim name (`cam`) or its
    full path (`/World/cam`). Leave it empty to use the stage's default camera.
  - **Image Width** - the width of each image in pixels, 960 by default. The
    height follows the camera's aspect ratio.

  ## Renderers

  Houdini 22.0 lists `Storm`, `Houdini VK`, `Karma CPU`, `Karma XPU`,
  `Houdini Hydra Debugger` and `GL`. The set depends on the Houdini version and
  what is installed. Storm, the default, draws with the GPU and needs a working
  OpenGL context on the worker, so a worker with no GPU or no display should
  use `Karma CPU`. Karma checks out a Karma license.

  ## How work is divided

  Each task renders a contiguous chunk of the frame range, ten frames by
  default. A negative frame keeps its sign inside the padding: frame -2 at four
  digits is `-002`. A stepped range such as `1-100:2` runs one task per frame,
  so no frame the range leaves out is rendered. A larger chunk loads the stage
  fewer times, at the cost of less parallelism.

  The task's progress bar moves as `usdrecord` starts each frame of the chunk.

  ## How it runs

  Houdini's own `usdrecord` command on Windows cannot start when Houdini is
  installed under a folder whose name has a space, which is where it installs
  by default. The task starts `hython` instead, with a small launcher that runs
  the `usdrecord` script in Houdini's `bin` folder.

  ## Requirements

  - Workers tagged `attr.worker.tag.houdini = true`
  - `hython`: the worker finds the newest Houdini install on Windows and Linux;
    on macOS put it on the worker's `PATH`
  - A Houdini license available to `hython`, and a Karma license when rendering
    with Karma
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: USD Record Render
  extensions: [TASK_CHUNKING, EXPR, SQI_LOG_PROGRESS]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
      userInterface:
        control: CHOOSE_INPUT_FILE
        label: Scene File
        fileFilters:
          - label: USD stages
            patterns: ["*.usd", "*.usda", "*.usdc", "*.usdz"]
        fileFilterDefault:
          label: USD stages
          patterns: ["*.usd", "*.usda", "*.usdc", "*.usdz"]
    - name: OutputFile
      type: PATH
      objectType: FILE
      dataFlow: OUT
      userInterface:
        control: CHOOSE_OUTPUT_FILE
        label: Output Image Pattern
        fileFilters:
          - label: Images
            patterns: ["*.png", "*.jpg", "*.exr"]
        fileFilterDefault:
          label: Images
          patterns: ["*.png", "*.jpg", "*.exr"]
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: FramesPerTask
      type: INT
      default: 10
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Frames per Task }
    - name: Renderer
      type: STRING
      default: ""
      userInterface: { control: LINE_EDIT, label: Renderer }
    - name: Camera
      type: STRING
      default: ""
      userInterface: { control: LINE_EDIT, label: Camera }
    - name: ImageWidth
      type: INT
      default: 960
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Image Width }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.tag.houdini
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: "{{Param.FramesPerTask}}"
              rangeConstraint: CONTIGUOUS
      SQI_LOG_PROGRESS:
        # Houdini 21.0.631's usdrecord prints "Recording time code: F.000000"
        # before it records each frame, and nothing after the last one (sample
        # output: test/integration/testdata/progress).
        progress:
          - '^Recording time code: (?P<frame>-?\d+)\.0+$'
        status:
          - '^(?P<status>Recording time code: -?\d+)\.0+$'
      script:
        let:
          - pad = Param.OutputFile.name.count('#')
          # usdrecord reads a # anywhere in the path, not only the file name, as
          # a frame placeholder, and formats the path with str.format, so a # in
          # a folder or a brace anywhere makes it fail at run time.
          - "output = Param.OutputFile if pad > 0 and '#' * pad in Param.OutputFile.name and '#' not in string(Param.OutputFile.parent) and '{' not in string(Param.OutputFile) and '}' not in string(Param.OutputFile) else fail('Output Image Pattern must contain exactly one run of # characters marking the frame number, e.g. preview.####.png, with no # in its folders and no { or } anywhere')"
        embeddedFiles:
          # Static text. Houdini's usdrecord.cmd runs hython on an unquoted
          # %HFS% and fails when the install path has a space, so this runs
          # the usdrecord script under hython directly. hython sets HFS.
          - name: launcher
            type: TEXT
            filename: launcher.py
            data: |
              import os, runpy, sys
              script = os.path.join(os.environ["HFS"], "bin", "usdrecord")
              # usdrecord does not create the output folder; the last argument
              # is the output pattern.
              folder = os.path.dirname(sys.argv[-1])
              if folder:
                  os.makedirs(folder, exist_ok=True)
              sys.argv = [script] + sys.argv[1:]
              runpy.run_path(script, run_name="__main__")
        actions:
          onRun:
            command: hython
            args:
              - "{{Task.File.launcher}}"
              - "{{ ['--renderer', Param.Renderer] if Param.Renderer != '' else [] }}"
              - "{{ ['--camera', Param.Camera] if Param.Camera != '' else [] }}"
              - "--imageWidth"
              - "{{Param.ImageWidth}}"
              - "--frames={{ min(Task.Param.Frame) }}:{{ max(Task.Param.Frame) }}"
              - "{{Param.SceneFile}}"
              - "{{ output }}"
