name: test-render-powershell
title: Test Render (PowerShell)
description: >-
  Simulates a render on any Windows worker without a renderer installed,
  sleeping per frame and optionally failing or hanging chosen frames.
readme: |
  # Test Render (PowerShell)

  A no-op render simulator for exercising a farm end to end without installing
  any DCC application. Each task sleeps for a configurable time, optionally
  prints progress, optionally writes a placeholder file, and then succeeds - or
  fails, or hangs, if you asked it to.

  Use it to check scheduling, retries, timeouts, cancellation, log streaming and
  progress reporting on a farm that has no renderer on it yet.

  ## Parameters

  - **Frame Range** - the frames to simulate, in OpenJD range syntax. One task per
    frame.
  - **Sleep Seconds** - how long each frame pretends to work before succeeding.
  - **Emit Progress** - whether each task prints OpenJD progress messages, so the
    progress bar in the web UI has something to show.
  - **Fail Frames** - a range of frames that exit non-zero instead of succeeding,
    for exercising retries and failure reporting. Empty means none fail.
  - **Hang Frames** - a range of frames that stop responding instead of finishing,
    for exercising task timeouts and cancellation. Empty means none hang.
  - **Hang Seconds** - how long a hung frame stays hung before giving up.
  - **Output Directory** - where each frame writes its placeholder file. Left
    empty, nothing is written.

  ## How work is divided

  One task per frame, with no chunking. The template declares `SQI_PATH_TRANSLATION`, so the output directory is
  translated per worker platform - which makes this preset useful for checking
  path mapping on a mixed farm.

  ## Requirements

  No capability tag and no renderer: that is the point. These presets exist to
  exercise the farm itself, so they run on any worker that can execute their
  script. This is the PowerShell variant and gates on
  Windows workers; use the bash variant on Linux and macOS.
category: Testing
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Test Render
  extensions: [SQI_PATH_TRANSLATION]
  parameterDefinitions:
    - name: FrameRange
      type: STRING
      default: "1-50"
      userInterface: { control: LINE_EDIT, label: Frame Range, groupLabel: Frames }
    - name: SleepSeconds
      type: INT
      default: 5
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Sleep (seconds), groupLabel: Render }
    - name: EmitProgress
      type: STRING
      default: "true"
      allowedValues: ["true", "false"]
      userInterface: { control: CHECK_BOX, label: Emit Progress, groupLabel: Behavior }
    - name: FailFrames
      type: STRING
      default: ""
      userInterface: { control: LINE_EDIT, label: Fail Frames, groupLabel: Behavior }
    - name: HangFrames
      type: STRING
      default: ""
      userInterface: { control: LINE_EDIT, label: Hang Frames, groupLabel: Behavior }
    - name: HangSeconds
      type: INT
      default: 300
      minValue: 1
      userInterface: { control: SPIN_BOX, label: Hang Duration (seconds), groupLabel: Behavior }
    - name: OutputDir
      type: PATH
      objectType: DIRECTORY
      dataFlow: OUT
      default: ""
      userInterface: { control: CHOOSE_DIRECTORY, label: Output Directory, groupLabel: Output }
  steps:
    - name: render
      hostRequirements:
        attributes:
          - name: attr.worker.os.family
            anyOf: ["windows"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: INT
            range: "{{Param.FrameRange}}"
      script:
        embeddedFiles:
          - name: main
            filename: render.ps1
            type: TEXT
            data: |
              $ErrorActionPreference = 'Stop'

              $frame        = '{{Task.Param.Frame}}'
              $sleepSeconds = [double]'{{Param.SleepSeconds}}'
              $emitProgress = '{{Param.EmitProgress}}'
              $failFrames   = '{{Param.FailFrames}}'
              $hangFrames   = '{{Param.HangFrames}}'
              $hangSeconds  = [int]'{{Param.HangSeconds}}'
              $outputDir    = [string]$args[0]  # from onRun arg so stage_locally path translation applies (not embedded)

              function Test-InList($needle, $list) {
                foreach ($item in ($list -split ',')) {
                  if ($item.Trim() -ne '' -and $item.Trim() -eq $needle) { return $true }
                }
                return $false
              }
              function Stamp { Get-Date -Format 'yyyy-MM-dd HH:mm:ss' }

              Write-Output ("{0} frame {1}: start" -f (Stamp), $frame)
              if ($emitProgress -eq 'true') { Write-Output "openjd_status: rendering frame $frame" }

              $sliceMs = [int](($sleepSeconds / 10) * 1000)
              if ($sliceMs -lt 100) { $sliceMs = 100 }
              for ($k = 1; $k -le 10; $k++) {
                Start-Sleep -Milliseconds $sliceMs
                if ($emitProgress -eq 'true') { Write-Output ("openjd_progress: {0}" -f ($k * 10)) }
              }

              if ($outputDir -ne '') {
                New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
                $name = 'frame.{0:D4}.txt' -f [int]$frame
                ("frame {0} rendered at {1}" -f $frame, (Stamp)) | Set-Content -Path (Join-Path $outputDir $name)
              }

              if (Test-InList $frame $hangFrames) {
                Write-Output "openjd_status: frame $frame hanging for $hangSeconds s"
                Start-Sleep -Seconds $hangSeconds
              }

              if (Test-InList $frame $failFrames) {
                [Console]::Error.WriteLine("ERROR: simulated failure on frame $frame")
                exit 1
              }

              Write-Output ("{0} frame {1}: done" -f (Stamp), $frame)
        actions:
          # OutputDir is passed as a command arg so SQI_PATH_TRANSLATION
          # (stage_locally) rewrites it to the worker scratch dir before the task
          # runs — path translation only rewrites the command and args, never an
          # embedded script's body. The script reads it from $args[0].
          onRun:
            command: powershell
            args: ["-NoProfile", "-ExecutionPolicy", "Unrestricted", "-File", "{{Task.File.main}}", "{{Param.OutputDir}}"]
            timeout: 120
  SQI_PATH_TRANSLATION:
    # stage_locally copies IN/OUT paths to/from the worker scratch dir;
    # swap_in_place rewrites the task's command/args (e.g. the OutputDir arg
    # above) to the scratch paths so the task actually reads/writes there.
    # Both are required — stage_locally alone copies files but leaves the task
    # pointing at the original paths, so copy-out finds nothing in scratch.
    deliveries: [stage_locally, swap_in_place]
