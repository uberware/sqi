name: maya-batch-render
title: Maya Batch Render
description: >-
  Renders a saved Maya scene with the Render batch command, one frame per
  task. Requires workers tagged maya=true with Render on PATH. A starting
  point - duplicate to customize for your pipeline.
category: Rendering
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Maya Batch Render
  extensions: [TASK_CHUNKING]
  parameterDefinitions:
    - name: SceneFile
      type: PATH
      objectType: FILE
      dataFlow: IN
    - name: Frames
      type: STRING
      userInterface: { control: LINE_EDIT, label: Frame Range }
    - name: OutputDir
      type: PATH
      objectType: DIRECTORY
      dataFlow: OUT
    - name: Renderer
      type: STRING
      default: file
      userInterface: { control: LINE_EDIT, label: Renderer }
    - name: RenderLayer
      type: STRING
      default: masterLayer
      userInterface: { control: LINE_EDIT, label: Render Layer }
  steps:
    - name: Render
      hostRequirements:
        attributes:
          - name: attr.worker.maya
            anyOf: ["true"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: 1
      script:
        actions:
          onRun:
            command: Render
            args:
              - "-r"
              - "{{Param.Renderer}}"
              - "-s"
              - "{{Task.Param.Frame}}"
              - "-e"
              - "{{Task.Param.Frame}}"
              - "-rl"
              - "{{Param.RenderLayer}}"
              - "-rd"
              - "{{Param.OutputDir}}"
              - "{{Param.SceneFile}}"
