[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqi-submitter"
description = "DCC submitter framework for sqi (Maya, Houdini, Nuke, Blender) on top of sqi-sdk"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Robin Scher", email = "robin@uberware.net" }]
maintainers = [{ name = "Uberware Inc.", email = "robin@uberware.net" }]
keywords = ["render-farm", "openjd", "vfx", "sqi", "maya", "houdini", "nuke", "blender"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["sqi-sdk>=0.1"]
dynamic = ["version"]

[project.optional-dependencies]
qt = ["PySide6"]
dev = ["ruff", "mypy<2", "pytest", "pytest-cov", "respx", "PyYAML", "types-PyYAML"]

[project.scripts]
sqi-submit = "sqi_submitter.qt.dialog:main"

[project.urls]
Homepage = "https://github.com/uberware/sqi"
Repository = "https://github.com/uberware/sqi"
Documentation = "https://github.com/uberware/sqi/blob/main/docs/dcc-submitters.md"
Issues = "https://github.com/uberware/sqi/issues"

[tool.hatch.version]
path = "src/sqi_submitter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqi_submitter"]

[tool.hatch.build.targets.wheel.force-include]
"src/sqi_submitter/py.typed" = "sqi_submitter/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "FA"]

[tool.ruff.lint.isort]
known-first-party = ["sqi_submitter", "sqi_client"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# PySide6/PySide6.*: qt/_compat.py type-checks against the real PySide6 stubs
# when the qt extra is installed; without it, treat PySide6 as Any so
# `mypy src` still passes in Qt-less environments (DCC-bundled bindings).
module = ["PySide6", "PySide6.*", "PySide2.*", "maya.*", "hou", "nuke", "bpy", "bpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qt/dialog.py subclasses QtCore.QThread and QtWidgets.QDialog. qt/_compat.py
# imports the real PySide6 under TYPE_CHECKING so attribute typos are caught
# when the qt extra *is* installed; when it is not (Qt-less environments, e.g.
# this CI lint job which installs only the `dev` extra), the PySide6.* override
# above makes mypy treat the import as Any via ignore_missing_imports. `strict`
# also turns on disallow_subclassing_any, which then flags every class that
# subclasses that Any as a [misc] error — defeating the point of the override.
# Relax just that one check for this module; every other strict check still
# applies.
module = "sqi_submitter.qt.dialog"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# sqi-sdk (our own dependency, pulled in via `pip install -e ../python`) depends
# on httpx, which pulls in anyio transitively. Modern anyio (>= 4.x) uses 3.10+
# `match` statements internally. mypy parses followed imports with the 3.9
# target grammar (python_version above), so following anyio's source makes
# `mypy src` fail to parse it (a [syntax] error) even though sqi-submitter never
# imports anyio directly. Skip following it — the public sqi-sdk/httpx surface
# we depend on stays fully typed. Mirrors the same override in
# clients/python/pyproject.toml; drop both when the floor is 3.10+.
module = "anyio.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=sqi_submitter --cov-report=term-missing --cov-fail-under=60"
markers = [
  "integration: tests that require a running sqi-server (deselected by default)",
]

[tool.coverage.run]
# Qt widget/dialog code and pure-registration DCC glue are exercised only where
# a Qt binding / real DCC exists (separate CI job / manual checklist).
omit = ["*/qt/widgets.py", "*/qt/dialog.py", "*/hosts/blender/addon.py", "*/hosts/*/startup/*"]
