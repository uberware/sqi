<!--
  The sqi submitter kit for Modo. Copy this folder (sqi/) into the user Scripts folder and
  restart Modo; the command sqi.submit then exists. The import below puts the kit's lxserv
  folder on Modo's script path, where Modo imports every Python module it finds at startup
  (the module blesses the command). Run sqi.submit from the command entry (F-key area at the
  bottom of the window) or map it to a key; a menu entry is left to the artist's own
  configuration.
-->
<configuration kit="sqi">
  <import>kit_sqi:lxserv</import>
</configuration>
