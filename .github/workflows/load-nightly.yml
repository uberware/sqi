name: Load nightly

# Runs a load scenario (ci-medium by default) against sqi-server on SQLite and
# on PostgreSQL, every night and on demand. Give `duration` to run it as a
# soak of that length instead (at most 5h30m, so the job fits GitHub's six
# hour limit with room for the build and the artifact upload).
#
# This workflow asserts invariants and run validity, never latency: a non-zero
# exit from sqi-load (1 invariant failure, 2 INVALID run) fails the job, while
# thresholds are only reported in the summary. Shared runners are too noisy
# to gate on timings. Compare runs with `sqi-load compare` on the uploaded
# directories.
#
# The `chaos` jobs run the whole chaos suite (docs/chaos-testing.md) on SQLite,
# one job per scenario. They ignore `scenario` and run on a dispatch only when
# `duration` is empty, so a soak dispatch runs the soak alone.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: Built-in scenario name
        required: false
        default: ci-medium
        type: string
      duration:
        description: Run as a soak of this length (for example 90m, 5h, 5h30m; at most 5h30m). Empty runs the scenario once at its own duration.
        required: false
        default: ""
        type: string

# Runs of the same workflow on the same ref queue rather than cancel one
# another: the 03:30 schedule must not kill a soak dispatched hours earlier,
# nor a dispatch kill the nightly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.store }})
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]

    # Started for both legs; only the postgres leg is given its DSN. Keep the
    # image in step with ci.yml's postgres-integration PG 18 entry.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SCENARIO: ${{ inputs.scenario || 'ci-medium' }}
      DURATION: ${{ inputs.duration || '' }}
      OUT_DIR: ${{ github.workspace }}/load-runs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The duration is read from the environment, never interpolated into the
      # script. Only whole hours, minutes and seconds are accepted (90m, 5h,
      # 5h30m, 1h15m30s); anything else, or more than 5h30m, fails the job
      # before any build starts.
      - name: Validate the duration
        shell: bash
        run: |
          if [ -z "$DURATION" ]; then
            echo "No duration: running $SCENARIO at its own duration."
            exit 0
          fi
          if ! [[ "$DURATION" =~ ^([0-9]+h)?([0-9]+m)?([0-9]+s)?$ ]]; then
            echo "::error::duration '$DURATION' is not of the form 90m, 5h or 5h30m"
            exit 1
          fi
          h=0 m=0 s=0
          rest="$DURATION"
          if [[ "$rest" =~ ^([0-9]+)h(.*)$ ]]; then h="${BASH_REMATCH[1]}"; rest="${BASH_REMATCH[2]}"; fi
          if [[ "$rest" =~ ^([0-9]+)m(.*)$ ]]; then m="${BASH_REMATCH[1]}"; rest="${BASH_REMATCH[2]}"; fi
          if [[ "$rest" =~ ^([0-9]+)s$ ]]; then s="${BASH_REMATCH[1]}"; fi
          total=$((10#$h * 3600 + 10#$m * 60 + 10#$s))
          max=$((5 * 3600 + 30 * 60))
          if [ "$total" -gt "$max" ]; then
            echo "::error::duration $DURATION is ${total}s; the CI soak cap is 5h30m (${max}s)"
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::duration $DURATION is zero"
            exit 1
          fi
          echo "Soaking $SCENARIO for $DURATION (${total}s)."

      # The service container has a health check; this only confirms the port
      # answers from the job before the harness is built and started.
      - name: Wait for PostgreSQL
        if: ${{ matrix.store == 'postgres' }}
        run: |
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "PostgreSQL is accepting connections."
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not come up"
          exit 1

      # sqi-load builds sqi-server and sqi-worker from this checkout. The
      # postgres leg sets the store and gives the DSN (sqi-load refuses a DSN
      # on a SQLite run). A DSN naming the postgres database is an admin DSN:
      # the harness creates a throwaway database for the run and drops it
      # afterwards.
      - name: Run the scenario
        shell: bash
        run: |
          args=(--scenario "$SCENARIO" --out "$OUT_DIR")
          if [ "${{ matrix.store }}" = "postgres" ]; then
            args+=(--set server.store=postgres --postgres-dsn "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable")
          fi
          if [ -n "$DURATION" ]; then
            go run ./cmd/sqi-load soak "${args[@]}" --duration "$DURATION"
          else
            go run ./cmd/sqi-load run "${args[@]}"
          fi

      - name: Add the summary to the job page
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in "$OUT_DIR"/*/summary.md; do
            {
              echo "### ${{ matrix.store }}: $(basename "$(dirname "$f")")"
              cat "$f"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the run directories
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-runs-${{ matrix.store }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  # The chaos suite: every built-in chaos-* scenario, each a fault injected
  # into real sqi-server and sqi-worker processes (`make chaos SCENARIO=...`,
  # SQLite), plus the suite's framework test (`make chaos-framework`). Each
  # runs in a job of its own, all at once: a scenario spends most of its time
  # waiting, and a runner to itself keeps a timing-sensitive one from sharing
  # a CPU. chaos-plan lists the scenarios from the library, so a new one joins
  # without an edit here.
  #
  # Only the tests listed under `gated` below fail their job. The list is
  # empty: every test is advisory and raises a warning annotation when it does
  # not pass, the framework test included, since it runs a real scenario
  # (chaos-server-term). A test moves to the gated list after 20 consecutive
  # passing runs on GitHub-hosted runners; add its name (TestChaos/<scenario>,
  # or TestChaos_<name>) to that one list to promote it.
  chaos-plan:
    name: Chaos suite plan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.duration == '' }}
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List the chaos scenarios
        id: list
        shell: bash
        run: |
          names=(framework)
          for f in internal/loadtest/scenario/library/chaos-*.yaml; do
            names+=("$(basename "$f" .yaml)")
          done
          json=$(printf '%s\n' "${names[@]}" | jq -R . | jq -cs .)
          echo "scenarios=$json" >> "$GITHUB_OUTPUT"

  chaos:
    name: Chaos suite (sqlite, ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: chaos-plan
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.chaos-plan.outputs.scenarios) }}

    env:
      CHAOS_OUT: ${{ github.workspace }}/chaos-runs
      CHAOS_LOG: ${{ github.workspace }}/chaos.log

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make chaos` exits non-zero when its scenario fails, an advisory one
      # included, so its status is not what fails the job: the next step reads
      # the log and decides.
      - name: Run the chaos test
        shell: bash
        env:
          SQI_LOAD_OUT: ${{ env.CHAOS_OUT }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [ "$SCENARIO" = framework ]; then
            target=(chaos-framework)
          else
            target=(chaos "SCENARIO=$SCENARIO")
          fi
          make "${target[@]}" 2>&1 | tee "$CHAOS_LOG" || echo "make exited non-zero; the next step decides what fails the job"

      - name: Upload the run directories
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chaos-runs-sqlite-${{ matrix.scenario }}
          path: |
            ${{ env.CHAOS_OUT }}
            ${{ env.CHAOS_LOG }}
          if-no-files-found: warn
          retention-days: 30

      # A skipped or filtered test would still leave `go test` green, so each
      # is asserted by name. The trailing space keeps a name from matching a
      # longer one with the same prefix.
      - name: Assert the gated tests passed
        if: ${{ always() }}
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          gated=(
          )
          if [ "$SCENARIO" = framework ]; then
            mapfile -t tests < <(grep -ho '^func TestChaos_[A-Za-z0-9_]*' test/chaos/*_test.go | sed 's/^func //')
          else
            tests=("TestChaos/$SCENARIO")
          fi
          fail=0
          {
            echo "| Test | Gating | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tests[@]}"; do
            if printf '%s\n' "${gated[@]}" | grep -qxF "$t"; then
              gating=gated
            else
              gating=advisory
            fi
            if grep -q -- "--- PASS: $t " "$CHAOS_LOG"; then
              result=PASS
            elif [ "$gating" = gated ]; then
              echo "::error::$t did not pass (or did not run)"
              result=FAIL
              fail=1
            else
              echo "::warning::advisory test $t did not pass (or did not run)"
              result="not passed"
            fi
            echo "| $t | $gating | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
