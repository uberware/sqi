name: CI

# Runs on every push to main, on every pull request, and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows manual triggering from the GitHub Actions UI

# A new push to the same ref cancels the run still in progress for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. changes adds pull-requests: read and docker-latest
# adds packages: write.
permissions:
  contents: read

jobs:
  # ── Change detection ─────────────────────────────────────────────────────────
  # Detects which areas changed so path-gated jobs run only when relevant: the
  # Python jobs on `clients/python/`, the submitter jobs on
  # `clients/submitter/` and `presets/sqi/`, preset-harness-windows on the
  # presets filter, and actionlint on the workflow files.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the PR diff via the API
    outputs:
      python: ${{ steps.filter.outputs.python }}
      submitter: ${{ steps.filter.outputs.submitter }}
      presets: ${{ steps.filter.outputs.presets }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'clients/python/**'
              - '.github/workflows/ci.yml'
            submitter:
              - 'clients/submitter/**'
              - 'presets/sqi/**'
              - '.github/workflows/ci.yml'
            # Gates preset-harness-windows below. Scoped to the presets and the
            # code that executes them, not internal/worker or internal/openjd,
            # to control runner cost: a wider filter would fire on nearly every
            # PR. A worker change that breaks a preset on Windows (the
            # PowerShell join, say) is caught by the push-to-main run instead.
            #
            # presets/validation-tiers.yaml is the tier registry (already
            # under 'presets/**', listed for clarity). test/stubproc/** and
            # test/integration/testdata/** are the preset harness's inputs:
            # the Tier-3 recording stub and the Tier-1 fixtures and goldens.
            #
            # internal/presettest/** and test/integration/preset_*.go are the
            # harness itself. Render() undoes the host's path flavor, so a
            # change there can break every golden on Windows without changing
            # a golden.
            #
            # internal/product/builtins/** holds seven registry entries, and
            # only preset-harness-windows executes script-powershell's
            # exit-status wrapper.
            presets:
              - 'presets/**'
              - 'internal/product/builtins/**'
              - 'presets/validation-tiers.yaml'
              - 'test/integration/ffmpeg_presets_test.go'
              - 'test/integration/preset_argv_test.go'
              - 'test/integration/worker_binary_test.go'
              - 'test/stubproc/**'
              - 'test/integration/testdata/**'
              - 'internal/presettest/**'
              - 'test/integration/preset_*.go'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  # ── Workflow linting ─────────────────────────────────────────────────────────
  # Lints the GitHub Actions workflow files with actionlint (run via `go run`,
  # pinned in the Makefile) whenever a workflow changes.
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run actionlint
        run: make lint-actions

  # ── Primary CI job ───────────────────────────────────────────────────────────
  # Tidy check, build, vet, lint, then the test suite with the race detector
  # and coverage gate. Any failing step stops the job.
  test:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Reads the Go and toolchain versions from go.mod. The module and
          # build caches are on by default.
          go-version-file: go.mod

      # Fails if go.mod or go.sum differs from its `go mod tidy` form.
      - name: Tidy module
        run: go mod tidy

      - name: Check go.mod is committed tidy
        run: git diff --exit-code go.mod go.sum

      # Fails if the module cache does not match go.sum, catching tampered or
      # corrupted dependencies before they reach the build.
      - name: Verify module integrity
        run: go mod verify

      - name: Build
        run: make build

      # Publishes the binaries so python-integration can use them without
      # rebuilding the web UI and Go code.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            bin/sqi-server
            bin/sqi-worker
          retention-days: 1

      - name: go vet
        run: make vet

      # Configuration is read from .golangci.yml at the repo root.
      #
      # version is pinned because "latest" lets each new golangci-lint
      # release, with its new analyzers, fail unrelated PRs. Bump it in its
      # own commit with the fallout fixed alongside.
      #
      # The floor is 2.13.0: .golangci.yml excludes errors.AsType from
      # errcheck by function name, and older errcheck cannot resolve a
      # generic function's name, so every errors.AsType call is reported.
      # Keep docs/development.md's required-version note in step with both.
      #
      # The path patterns mirror the Makefile's LINT_PKGS, which excludes
      # web/node_modules/ (third-party packages that contain Go files).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m ./cmd/... ./internal/... ./pkg/... ./test/... ./web

      # The internal/openjd/expr path-engine differentials compare against
      # python3's pathlib. sqi implements CPython 3.13 path semantics, so
      # those tests call requirePython313 and skip on older versions,
      # including ubuntu-latest's system 3.12. This pin makes them run. The
      # expr-oracle job has its own 3.12 pin for the openjd-model venv.
      - name: Set up Python (>= 3.13 for the expr path differentials)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The preset tests are untagged, so `make test-cover` runs
      # TestZZPresetTierRegistrySatisfied here, and the registry's tier2
      # blocks require the real-ffmpeg cases to run, not skip.
      - name: Install ffmpeg (the registry's tier-2 claims require it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # `make test-cover` runs the suite with -race (RACE=on, the Makefile
      # default), writes coverage.out, and fails below COVERAGE_MIN. The
      # threshold is set only in the Makefile (default 70).
      - name: Test (race detector + coverage gate)
        run: make test-cover

      # Needs the CODECOV_TOKEN repository secret (setup in
      # docs/development.md). fail_ci_if_error is false so a Codecov outage
      # does not break the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  # ── Web UI quality gates ─────────────────────────────────────────────────────
  # Prettier, ESLint, tsc and Vitest with a coverage gate, in parallel with the
  # Go test job.
  web-check:
    name: Web UI lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Node version comes from .nvmrc; web/package.json's engines field
      # states the same constraint.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Fails if any file would be reformatted.
      - name: Check formatting (Prettier)
        working-directory: web
        run: npm run format:check

      # --max-warnings 0 makes every warning a failure.
      - name: Lint (ESLint)
        working-directory: web
        run: npm run lint

      # tsc -b type-checks all project references (tsconfig.app.json +
      # tsconfig.node.json) without emitting output.
      - name: Type-check (tsc -b)
        working-directory: web
        run: npm run typecheck

      # V8 coverage; fails below the thresholds set in vite.config.ts.
      - name: Test with coverage gate (Vitest)
        working-directory: web
        run: npm run test:coverage

      # flags: web tracks web coverage separately from Go. fail_ci_if_error is
      # false so a Codecov outage does not break the build.
      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/coverage-final.json
          flags: web
          fail_ci_if_error: false

  # ── Web end-to-end (Playwright) ──────────────────────────────────────────────
  # Builds the real binaries (sqi-server embeds web/dist) and drives the embedded
  # UI in Chromium, Firefox, and WebKit. The Playwright global setup boots a
  # server + worker on an ephemeral loopback port, seeds a farm/queue, submits a
  # job through the /submit form, and asserts it runs to completion with logs.
  # See docs/cross-platform-validation.md for the manual per-OS equivalent.
  web-e2e:
    name: Web UI end-to-end (Playwright)
    runs-on: ubuntu-latest
    # The worker refuses to start as root unless this is set. The global
    # setup's worker inherits it, so the job does not depend on the runner's
    # user.
    env:
      SQI_WORKER_ALLOW_ROOT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The Playwright global setup would build bin/sqi-server and
      # bin/sqi-worker itself; building here makes a build failure obvious.
      - name: Build binaries (server embeds the UI)
        run: make build

      # Installs the three browser engines plus their Linux system libraries.
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (chromium, firefox, webkit)
        working-directory: web
        run: npm run test:e2e

      # Keeps the HTML report and traces of a failed run for diagnosis.
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ── Docker latest ────────────────────────────────────────────────────────────
  # Builds and pushes the sqi-server and sqi-worker :latest images to GHCR on
  # every push to main, from the multi-stage Dockerfiles (no goreleaser), once
  # the test and web-check jobs pass.
  docker-latest:
    name: Publish :latest to GHCR
    runs-on: ubuntu-latest
    needs: [test, web-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read  # required by actions/checkout
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Export GOVERSION
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sqi-server :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/uberware/sqi/sqi-server:latest
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            GOVERSION=${{ env.GOVERSION }}
          # A cache scope per image keeps the server and worker exports (both
          # mode=max) from overwriting each other's blob refs. ignore-error
          # keeps a flaky cache export ("error writing layer blob: not_found")
          # from failing the job after the image is pushed.
          cache-from: type=gha,scope=docker-latest-server
          cache-to: type=gha,scope=docker-latest-server,mode=max,ignore-error=true

      - name: Build and push sqi-worker :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/uberware/sqi/sqi-worker:latest
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            GOVERSION=${{ env.GOVERSION }}
          cache-from: type=gha,scope=docker-latest-worker
          cache-to: type=gha,scope=docker-latest-worker,mode=max,ignore-error=true

  # ── Cross-compilation matrix ─────────────────────────────────────────────────
  # Builds both binaries for every target platform. fail-fast is off so one
  # broken target does not hide the state of the others.
  #
  # `go build` never compiles _test.go files, so it cannot catch a
  # Windows-only break in test code (a POSIX-only test referencing
  # SysProcAttr.Credential, say). The windows/amd64 step builds every
  # internal package and vets internal/worker/..., cmd/... and the Windows
  # service packages (internal/winsvc, internal/secretin, internal/log); vet
  # type-checks _test.go files. test/winservice is behind the `winservice`
  # build tag and //go:build windows, so the vet line passes the tag (no
  # other package uses it).
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/sqi-server/...
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/sqi-worker/...

      # See the job comment for why `go build` cannot replace this. amd64
      # only: GOARCH does not change what vet's type-checking sees.
      - name: Windows internal packages build + vet
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          GOOS=windows GOARCH=amd64 go build ./internal/... ./cmd/...
          GOOS=windows GOARCH=amd64 go vet -tags winservice ./internal/worker/... ./internal/winsvc/... ./internal/secretin/... ./internal/log/... ./cmd/... ./test/winservice/...

  # ── Cross-platform runtime smoke ─────────────────────────────────────────────
  # Runs the binaries natively on macOS and Windows: start, register a worker,
  # execute a job and stream logs over REST and WebSocket. Linux is covered by
  # smoke-test and web-e2e. The manual VM-based equivalent is
  # docs/cross-platform-validation.md.
  #
  # macOS and Windows runner minutes cost about 10x Linux, so this skips pull
  # requests and runs on pushes to main and manual dispatch. fail-fast is off
  # so a Windows failure still reports the macOS result.
  cross-platform-runtime:
    name: Runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # The worker refuses to start as root on Linux and macOS unless this is
    # set. The runner users are not root, so this is only a safeguard.
    env:
      SQI_WORKER_ALLOW_ROOT: "true"
    # bash on every OS (Git Bash on Windows), so one smoke script runs
    # unchanged.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Provides a python with `websockets` so the smoke script's WebSocket
      # assertion runs for real (it otherwise degrades to a logged SKIP).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install websockets for the WS smoke check
        run: python -m pip install --upgrade pip websockets

      # The web bundle comes first because the server embeds web/dist.
      - name: Build web bundle and binaries
        run: |
          (cd web && npm ci && npm run build)
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -o "bin/sqi-server${ext}" ./cmd/sqi-server
          go build -o "bin/sqi-worker${ext}" ./cmd/sqi-worker

      # scripts/smoke.sh is what `make smoke` runs. Passing the prebuilt
      # binaries skips its internal `make build`, so the Windows runner needs
      # no GNU make.
      - name: End-to-end smoke (REST + WebSocket, plain / broker-auth / TLS)
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          export SQI_SERVER_BIN="bin/sqi-server${ext}"
          export SQI_WORKER_BIN="bin/sqi-worker${ext}"
          # Declare and assign separately so the command substitution's exit
          # status is not masked by `export` (shellcheck SC2155).
          SQI_SMOKE_PYTHON="$(command -v python)"
          export SQI_SMOKE_PYTHON
          bash scripts/smoke.sh 2>&1 | tee smoke-output.log
          status=${PIPESTATUS[0]}

          # The script runs three modes. Each must report a pass by name, or
          # a regression that skips a mode would leave this job green.
          missing=0
          for mode in noauth brokerauth tls; do
            if ! grep -q "SMOKE TEST PASSED (mode=$mode)" smoke-output.log; then
              echo "::error::smoke mode $mode did not report a pass"
              missing=1
            fi
          done
          if [ "$status" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "::error::the smoke test did not pass in all three modes (exit=$status)."
            exit 1
          fi
          echo "Confirmed all three smoke modes passed."

  # ── Docker smoke test ────────────────────────────────────────────────────────
  # Builds both Docker images locally (no push) and runs them together with
  # docker-compose.smoke.yml to check that the worker registers with the
  # server. Runs on pushes to main and on pull requests.
  #
  # Plain `docker build` avoids setup-buildx, which pulls moby/buildkit from
  # Docker Hub at job start and times out on congested runners. A
  # single-platform local build needs only the daemon's built-in BuildKit.
  smoke-test:
    name: Docker smoke test (server + worker)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Export GOVERSION
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      # The daemon's built-in BuildKit; see the job comment.
      - name: Build sqi-server image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f deploy/docker/Dockerfile \
            --build-arg VERSION=smoke \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.head.repo.updated_at || github.event.repository.updated_at }} \
            --build-arg GOVERSION=${{ env.GOVERSION }} \
            -t ghcr.io/uberware/sqi/sqi-server:latest \
            .

      - name: Build sqi-worker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f deploy/docker/worker/Dockerfile \
            --build-arg VERSION=smoke \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.head.repo.updated_at || github.event.repository.updated_at }} \
            --build-arg GOVERSION=${{ env.GOVERSION }} \
            -t ghcr.io/uberware/sqi/sqi-worker:latest \
            .

      - name: Start smoke stack
        run: docker compose -f deploy/docker-compose.smoke.yml up -d

      - name: Wait for sqi-server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/readyz > /dev/null; then
              echo "sqi-server is ready"
              exit 0
            fi
            echo "Waiting for sqi-server... ($i/30)"
            sleep 2
          done
          echo "ERROR: sqi-server did not become ready within 60 s"
          docker compose -f deploy/docker-compose.smoke.yml logs sqi-server
          exit 1

      - name: Wait for sqi-worker to register
        run: |
          for i in $(seq 1 30); do
            total=$(curl -sf http://localhost:8080/api/v1/workers \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('total', 0))" \
              2>/dev/null || echo "0")
            if [ "$total" -ge 1 ]; then
              echo "sqi-worker registered (total=$total)"
              exit 0
            fi
            echo "Waiting for worker... ($i/30)"
            sleep 2
          done
          echo "ERROR: no sqi-worker registered within 60 s"
          docker compose -f deploy/docker-compose.smoke.yml logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.smoke.yml down -v

  # ── Auth surface demo ────────────────────────────────────────────────────────
  # Runs scripts/auth-demo.sh (what `make auth-demo` runs) against real
  # binaries on a live local farm: auth enabled, a bootstrap admin, a second
  # non-admin account, and a worker executing a job.
  #
  # End-to-end test of session cookies, API keys, the CSRF guard, the RBAC
  # permission matrix and job owner scoping. Unit tests check each piece
  # alone and cannot catch a router that mounts the wrong middleware on a
  # real route.
  #
  # Linux only, on every run: it takes under a minute.
  #
  # The script needs curl, jq and python3 (for free loopback ports), all
  # preinstalled on hosted runners. SQI_*_BIN skips its internal
  # `make build`.
  #
  # No Node build: the tracked placeholder web/dist/index.html keeps the
  # server's //go:embed valid, and this job uses only the REST API.
  auth-demo:
    name: Auth surface demo (live farm)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          go build -o bin/sqi-server ./cmd/sqi-server
          go build -o bin/sqi-worker ./cmd/sqi-worker

      - name: Auth surface demo (sessions, API keys, CSRF, RBAC, owner scoping)
        env:
          SQI_SERVER_BIN: bin/sqi-server
          SQI_WORKER_BIN: bin/sqi-worker
        run: bash scripts/auth-demo.sh

  # ── LDAP: real-directory integration ─────────────────────────────────────────
  # Runs the LDAP tests against a real OpenLDAP server in a container. This is
  # the only coverage of sqi's go-ldap wire usage (search scopes, attribute
  # names, filter syntax, how a real server answers a request it does not
  # support); every other LDAP test drives a fake connection.
  #
  # The test starts its own container, so no service definition is needed. It
  # skips, rather than fails, without Docker. Tagged `integration`, so the
  # default `make test` does not run it.
  ldap-integration:
    name: LDAP integration (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test

    # Both architectures, because the image's amd64 and arm64 variants differ
    # in test-visible ways: the memberof module registers its schema seconds
    # later on amd64, a race a fixture can hit on one architecture only.
    # Native runners, not QEMU, so the timing tested is the runner's.
    #
    # fail-fast is off: when the two disagree, both results are needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pulled explicitly so a registry problem fails here with a clear
      # message, not inside the test run as a skip.
      - name: Pull OpenLDAP image
        run: docker pull osixia/openldap:1.5.0

      - name: Run LDAP integration tests
        run: make test-ldap

  # ── SSO against a real identity provider ─────────────────────────────────────
  # The SSO unit tests drive a fake provider that signs real tokens, but a
  # fake cannot show what a real provider omits. Keycloak emits no group
  # claim without a protocol mapper, and a token with no groups still
  # validates, so every user silently lands on default_role. This job runs
  # the SSO flow against a real Keycloak. It also pins the two vendor
  # behaviors the logout flow relies on (see test/integration/oidc_test.go).
  #
  # One architecture: no arch divergence is known for the Keycloak image, a
  # JVM application. Add arm64 if one appears.
  #
  # The test starts its own container, so no service definition is needed. It
  # skips, rather than fails, without Docker. Tagged `integration`, so the
  # default `make test` does not run it.
  oidc-integration:
    name: OIDC integration
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pulled explicitly so a registry problem fails here with a clear
      # message, not inside the test run as a skip.
      #
      # Keep this tag in step with keycloakImage in test/integration/oidc_test.go:
      # the test scrapes Keycloak's login form, so the exact tag matters.
      - name: Pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:26.0.7

      - name: Run OIDC integration tests
        run: make test-oidc

  # ── Task isolation: run-as-user integration ──────────────────────────────────
  # Runs the run-as-user isolation suite as root against real unprivileged OS
  # accounts inside a container. This is the only coverage of uid/gid
  # switching, session-directory ownership, environment filtering and
  # process-group kill; internal/worker/isolation's fake Provider sees none
  # of it.
  #
  # Both architectures, on native runners, because raw syscalls
  # (setuid/setgid/setgroups, SysProcAttr.Credential) are where an arch
  # divergence could hide.
  #
  # `make test-isolation` builds its own image from a staged copy of the repo
  # (see the Makefile comment above the target), so no image is pulled here.
  #
  # `make test-isolation` exits 0 with a message when Docker is unavailable,
  # so the job does not trust its exit code: it fails if that message appears
  # or if any of the 11 TestIsolation_ tests is not confirmed PASS.
  isolation-integration:
    name: Isolation integration (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fails on a Docker-unavailable skip or unless all 11 TestIsolation_
      # tests report PASS; see the job comment.
      - name: Run isolation integration tests
        run: |
          set +e
          make test-isolation 2>&1 | tee isolation-output.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -q "docker unavailable" isolation-output.log; then
            echo "::error::Docker was unavailable — the isolation suite did not run. A skip here proves nothing, so this is a hard failure."
            exit 1
          fi

          pass_count=$(grep -c '^--- PASS: TestIsolation_' isolation-output.log || true)
          expected=11
          if [ "$status" -ne 0 ] || [ "$pass_count" -ne "$expected" ]; then
            echo "::error::Expected $expected TestIsolation_ tests to pass (exit=$status, found=$pass_count). Failing so a partial or failed run cannot look green."
            exit 1
          fi

          echo "Confirmed $pass_count/$expected TestIsolation_ tests passed."

  # ── State store on PostgreSQL ────────────────────────────────────────────────
  # Runs everything that needs a real PostgreSQL: the shared SQL layer's
  # concurrency races, schema parity with the SQLite migrations, the
  # atomic-submission and readiness tests, backup, restore and store copy,
  # the scheduler stress test, and the integration suite with the state store
  # on PostgreSQL. SQLite cannot stand in: its single write connection
  # serializes what PostgreSQL runs concurrently, so lock-order and isolation
  # mistakes show up only here.
  #
  # Runs on 16 (the oldest supported major) and 18 (the newest tested):
  # pg_dump must be at least the server's major version, and lock and planner
  # behavior differ between majors. Only the 18 leg runs the smoke test
  # (below), which does not depend on the major.
  #
  # scripts/test-postgres.sh starts its own container from the image the
  # matrix pulls (SQI_TEST_POSTGRES_IMAGE). The script's local-run defaults
  # carry the same pins; change both.
  #
  # `make test-postgres` exits 0 without Docker, and every PostgreSQL test
  # skips without a DSN, so the job does not trust the exit code: it fails
  # unless the suite reached its last line, each named test passed, and no
  # PostgreSQL subtest was skipped. It asserts by name because a count stays
  # green when a test is renamed or stops running.
  postgres-integration:
    name: PostgreSQL integration (${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: '16'
            image: postgres:16.15 # keep in step with scripts/test-postgres.sh's default
          - pg: '18'
            image: postgres:18.6 # keep in step with scripts/test-postgres.sh's default

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pulled explicitly so a registry problem fails here with a clear
      # message, not inside the test run as a skip.
      - name: Pull PostgreSQL image
        run: docker pull ${{ matrix.image }}

      # The backup test restores a pg_dump archive into the server, so the
      # client must match the server's major version. The runner's own client
      # may not, so the matrix major is installed from PGDG and put first on
      # PATH.
      #
      # ffmpeg: test-postgres.sh's last phase runs the whole
      # ./test/integration/ package (all but the LDAP, OIDC and isolation
      # tests), and presets/validation-tiers.yaml requires the ffmpeg presets'
      # tier-2 cases on linux, so TestZZPresetTierRegistrySatisfied fails
      # without it. The version line fails if the install did not happen.
      - name: Install PostgreSQL ${{ matrix.pg }} client tools and ffmpeg
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"
          ffmpeg -version | head -1

      # Asserts the suite ran to its last line, each named test passed, at
      # least one `/postgres` subtest passed and none was skipped, over the
      # whole run and again within the forced-retry phase.
      #
      # The trailing space in the PASS pattern keeps a name from matching a
      # longer one with the same prefix. A parent test's PASS line means no
      # subtest failed, not that none was skipped, hence the separate
      # `/postgres` skip check.
      #
      # The two TestPGRace_G7_ tests cover the same race at its two call
      # sites.
      #
      # The restore and store copy tests are listed because each skips without
      # PostgreSQL, so a run that never reached a server would pass them all.
      # TestBackupRestore_FarmResumes and TestUpgrade_OlderBinaryRefused run in
      # the integration phase with the server on PostgreSQL.
      # TestStoreCopy_SQLiteToPostgres skips in integration-tests (no
      # PostgreSQL there), so only this job asserts it.
      # TestPostgres_OpenRefusesANewerSchema is named apart from the SQLite
      # package's TestOpen_RefusesANewerSchema, whose PASS line would
      # otherwise satisfy the check.
      - name: Run PostgreSQL tests
        run: |
          set +e
          SQI_TEST_POSTGRES_IMAGE=${{ matrix.image }} make test-postgres PG_VERSION=${{ matrix.pg }} 2>&1 | tee pg-output.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -q "docker unavailable" pg-output.log; then
            echo "::error::Docker was unavailable; the PostgreSQL suite did not run. A skip here proves nothing, so this is a hard failure."
            exit 1
          fi

          expected=(
            TestPGRace_G1_AReportedTaskIsNeverReaped
            TestPGRace_G2_PoolCapHoldsUnderConcurrentLeases
            TestPGRace_G3_ReaperReturnsExactlyWhatItReset
            TestPGRace_G4_CancelReportsALeaseThatRaced
            TestPGRace_G5_RetryAndCancelSerialize
            TestPGRace_G6_RetentionSparesAJobRetriedMeanwhile
            TestPGRace_G7_DeleteJobHoldsOffALogThatRaced
            TestPGRace_G7_RetentionHoldsOffALogThatRaced
            TestPGRace_G8_NoDemotionUnderALease
            TestPGRace_G9_OfflineReclaimsEveryTaskALeaseCommitted
            TestPGRace_G10_TwoAdminDeletionsLeaveOneAdmin
            TestPGRace_G11_LateReportCannotEndATaskReLeasedMeanwhile
            TestPGRace_G12_ReaperAndCompletionDoNotDeadlock
            TestSchemaParity
            TestJobStore_CreateJobSubmission_RollsBackEntirely
            TestCreateJobSubmission_ConcurrentObserverSeesWholeJobs
            TestPostgres_PingWhileLargeSubmission
            TestPostgres_BackupRestoreRoundTrip
            TestConcurrentStress_Postgres
            TestEXPRJobEndToEnd
            TestPostgres_RestoreRoundTrip
            TestPostgres_RestoreOfACorruptArchiveLeavesTheDatabaseEmpty
            TestPostgres_SchemaVersionDSN
            TestPostgres_OpenRefusesANewerSchema
            TestPostgres_RestoreSkipsGrantsToAbsentRoles
            TestPostgres_RequireEmptyDatabaseSeesTablesTheRoleCannotAccess
            TestPostgres_ArchiveSchemaVersionReportsToolProblemsAsSuch
            TestPostgres_ReadsAMixedCaseSchema
            TestMigration00038_DedupesLogChunksOnPostgreSQL
            TestLockDatabase_ExcludesAServerAndIsReleasable
            TestParity_ListOpenAttempts/postgres
            TestParity_CreateTaskLog_DuplicateChunkIsAConflict/postgres
            TestRestorePostgres_FencesAndRefusesANonEmptyTarget
            TestRestorePostgres_RefusesANewerBackupWithoutTouchingTheTarget
            TestRestorePostgres_RefusesAFileThatIsNotAnSQIBackup
            TestRestorePostgres_InPlaceFencesTheConfiguredDatabase
            TestRestorePostgres_InPlaceRefusesAnEmptyDatabase
            TestRestorePostgres_InPlaceRefusesANewerSchema
            TestRestorePostgres_AMissingPgRestoreIsNotABadBackup
            TestStoreCopy_CopiesEveryRowVerbatim
            TestStoreCopy_NeverWritesASourceWithAPendingWAL
            TestStoreCopy_RefusesANonEmptyTarget
            TestStoreCopy_RefusesASourceBehindTheBinary
            TestStoreCopy_RefusesASourceAheadOfTheBinary
            TestStoreCopy_RefusesATargetAtAnotherVersion
            TestStoreCopy_RefusesWhileAServerHoldsTheSource
            TestStoreCopy_RefusesWhileAServerHoldsTheTarget
            TestStoreCopy_RefusesAForeignTableInTheTarget
            TestStoreCopy_RefusesANonBooleanInABooleanColumn
            TestStoreCopy_NamesTheRowAndColumnPostgreSQLRefuses
            TestStoreCopyCmd_CopiesIntoPostgres
            TestStoreCopy_SQLiteToPostgres
            TestBackupRestore_FarmResumes
            TestUpgrade_OlderBinaryRefused
          )
          missing=0
          for name in "${expected[@]}"; do
            if ! grep -q -- "--- PASS: $name " pg-output.log; then
              echo "::error::$name did not pass"
              missing=1
            fi
          done
          if grep -E -- '--- SKIP: .*/postgres' pg-output.log; then
            echo "::error::a PostgreSQL subtest was skipped"
            missing=1
          fi
          # No skips does not mean the backend ran: a run that collected no
          # /postgres subtests has none to skip.
          pg_passes=$(grep -c -E -- '--- PASS: .*/postgres' pg-output.log || true)
          if [ "$pg_passes" -lt 1 ]; then
            echo "::error::no /postgres subtest passed; the PostgreSQL backend was not exercised"
            missing=1
          fi
          # The forced-retry phase (store packages only, every transaction
          # retried once) is checked on its own. The race tests skip in it but
          # are top-level tests, so they match neither pattern.
          sed -n '/^== BEGIN FORCED-RETRY PHASE$/,/^== END FORCED-RETRY PHASE$/p' pg-output.log > pg-retry.log
          if ! grep -q '^== END FORCED-RETRY PHASE$' pg-retry.log; then
            echo "::error::the forced-retry phase did not run to its end"
            missing=1
          fi
          retry_passes=$(grep -c -E -- '--- PASS: .*/postgres' pg-retry.log || true)
          if [ "$retry_passes" -lt 1 ]; then
            echo "::error::no /postgres subtest passed in the forced-retry phase"
            missing=1
          fi
          if grep -E -- '--- SKIP: .*/postgres' pg-retry.log; then
            echo "::error::a PostgreSQL subtest was skipped in the forced-retry phase"
            missing=1
          fi
          if ! grep -q "POSTGRES TESTS PASSED (PG_VERSION=${{ matrix.pg }})" pg-output.log; then
            echo "::error::the PostgreSQL suite did not reach its final line"
            missing=1
          fi
          if [ "$status" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "::error::the PostgreSQL suite did not all pass (exit=$status)."
            exit 1
          fi

          echo "Confirmed the PostgreSQL ${{ matrix.pg }} suite passed, including ${#expected[@]} named tests and ${retry_passes} /postgres subtests under forced retry."

      # ── Smoke test with the server on PostgreSQL (18 only) ─────────────────
      # `make smoke` builds both binaries and the web UI, so it needs the same
      # Node and Python setup as cross-platform-runtime. The next three steps
      # are copied from that job; keep them in step.
      - name: Set up Node.js
        if: ${{ matrix.pg == '18' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Provides a python with `websockets` so the smoke script's WebSocket
      # assertion runs for real (it otherwise degrades to a logged SKIP).
      - name: Set up Python
        if: ${{ matrix.pg == '18' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install websockets for the WS smoke check
        if: ${{ matrix.pg == '18' }}
        run: python -m pip install --upgrade pip websockets

      # A fresh container, because the smoke run creates a farm named "smoke
      # farm" and farm names are unique. With SQI_SMOKE_POSTGRES_DSN set,
      # scripts/smoke.sh runs its three SQLite modes and then a fourth with
      # the state store on PostgreSQL.
      #
      # The readiness probe uses TCP (-h 127.0.0.1): on first boot the image
      # runs a temporary server on the Unix socket only, which a socket probe
      # would mistake for the real one. Docker picks the host port, read back
      # with `docker port`.
      - name: End-to-end smoke with the server on PostgreSQL
        if: ${{ matrix.pg == '18' }}
        run: |
          name=sqi-smoke-pg
          docker run -d --rm --name "$name" --tmpfs /var/lib/postgresql \
            -e POSTGRES_PASSWORD=sqi -p 127.0.0.1::5432 ${{ matrix.image }}
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::the smoke PostgreSQL container never became ready"
            docker logs "$name" || true
            exit 1
          fi
          port="$(docker port "$name" 5432/tcp | head -n 1 | sed 's/.*://')"
          if [ -z "$port" ]; then
            echo "::error::could not read the published port of $name"
            exit 1
          fi

          # Declare and assign separately so the command substitution's exit
          # status is not masked by `export` (shellcheck SC2155).
          SQI_SMOKE_PYTHON="$(command -v python)"
          export SQI_SMOKE_PYTHON
          export SQI_SMOKE_POSTGRES_DSN="postgres://postgres:sqi@127.0.0.1:${port}/postgres?sslmode=disable"

          set +e
          make smoke 2>&1 | tee smoke-pg.log
          status=${PIPESTATUS[0]}
          set -e

          # Each mode must report a pass by name, so a dropped mode cannot
          # leave this job green.
          missing=0
          for mode in noauth brokerauth tls postgres; do
            if ! grep -q "SMOKE TEST PASSED (mode=$mode)" smoke-pg.log; then
              echo "::error::smoke mode $mode did not report a pass"
              missing=1
            fi
          done
          if [ "$status" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "::error::the smoke test did not pass in all four modes (exit=$status)."
            exit 1
          fi
          echo "Confirmed all four smoke modes passed, the last with the state store on PostgreSQL."

  # ── Task isolation: run-as-user integration (Windows) ────────────────────────
  # Runs the Windows run-as-user isolation suite against real local accounts,
  # with its privileged tier running as SYSTEM. isolation-integration covers
  # POSIX.
  #
  # Two tiers because they need different privileges. CreateProcessAsUser,
  # which os/exec calls whenever SysProcAttr.Token is set, requires
  # SeAssignPrimaryTokenPrivilege, held by default only by LocalSystem and
  # the LOCAL/NETWORK SERVICE accounts. The runner user is an administrator
  # without it, so scripts/test-isolation-windows.ps1 runs the tests that
  # launch a process as the target account (TestIsolationWindowsSystem_*)
  # from a scheduled task with /ru SYSTEM. The rest (TestIsolationWindows_*:
  # ACL shape, credential storage, impersonated access checks) run in the
  # elevated admin shell.
  #
  # One arch: the Win32 APIs involved (ACLs, LogonUserW, CreateProcessAsUser)
  # are not architecture-dependent, and hosted windows-arm64 runners are not
  # generally available.
  #
  # This job also runs the Windows-only unit tests, because no other job
  # executes them: cross-platform-runtime skips pull requests, and
  # cross-compile's `GOOS=windows go vet` only type-checks. The package list
  # is every package with GOOS-conditional behavior. internal/worker/isolation,
  # internal/worker/executor, internal/worker/staging, cmd/sqi-worker and the
  # Windows service packages (internal/winsvc, internal/secretin, internal/log,
  # cmd/sqi-server) carry _windows.go or _windows_test.go files.
  # internal/worker/envutil and internal/worker/session branch on
  # runtime.GOOS in their tests, so only a Windows run executes the Windows
  # branch.
  #
  # scripts/test-isolation-windows.ps1 exits 0 with a message when the shell
  # is not elevated, so the assertion step fails on that message and requires
  # each test's PASS line by name instead of trusting the exit code.
  isolation-integration-windows:
    name: Isolation integration (windows)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The only lint of the Windows-only sources: the ubuntu lint step
      # type-checks with GOOS=linux and never compiles a *_windows.go file.
      #
      # The version matches the ubuntu step's pin; keep the two in step.
      # Scoped to the packages with per-GOOS code (the worker tree, both cmd
      # packages, internal/winsvc, internal/secretin, internal/log) plus
      # internal/brokerauth and internal/tlsutil, because a full-module run
      # would repeat the ubuntu job's findings. ./test/winservice/... is
      # behind the `winservice` build tag (set in .golangci.yml) and
      # //go:build windows, so only this step lints it.
      - name: golangci-lint (windows sources)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m ./cmd/sqi-worker/... ./cmd/sqi-server/... ./internal/worker/... ./internal/winsvc/... ./internal/secretin/... ./internal/log/... ./internal/brokerauth/... ./internal/tlsutil/... ./test/winservice/...

      # The job comment explains the package list. -count=1 disables the test
      # cache so a cached pass cannot stand in for a run. -v and the tee give
      # the assertion steps per-test PASS lines; without them a skip looks
      # like a pass.
      - name: Windows unit tests
        shell: bash
        run: |
          go test -count=1 -v \
            ./internal/worker/isolation/... \
            ./internal/worker/executor/... \
            ./internal/worker/envutil/... \
            ./internal/worker/session/... \
            ./internal/worker/staging/... \
            ./internal/winsvc/... \
            ./internal/secretin/... \
            ./internal/log/... \
            ./cmd/sqi-server/... \
            ./cmd/sqi-worker/... 2>&1 | tee windows-unit.log

      # Separate from the isolation assertion below because these have
      # different prerequisites (plain `go test`, no elevation, no throwaway
      # accounts), and a shared list would hide which one went missing.
      #
      # The two hardlink-refusal tests skip on a non-NTFS temp directory, so
      # every staging test is required to PASS by name.
      #
      # TestStageOut_SharingViolationIsNotReportedAsEscape is not listed: this
      # runner does not enforce a deny-all share mode (a second open of a file
      # held with dwShareMode 0 succeeds), so the test skips here. The
      # property it covers is required as
      # TestClassifyStageOutOpenError_SharingViolationIsUnreadable, which feeds
      # the classifier the real errno and so holds on every host.
      - name: Assert the windows staging tests actually ran
        shell: bash
        run: |
          expected=(
            TestCopyFile_RefusesHardlinkedStageInSourceOnWindows
            TestStageOut_OrdinaryFileUnaffected
            TestStageOut_RefusesHardlinkedSourceOnWindows
            TestStageOut_RefusesJunctionAtFinalComponent
            TestStageOut_RefusesJunctionedScratchSubdir
            TestClassifyStageOutOpenError_SharingViolationIsUnreadable
            TestStageOut_SwapAfterValidateIsRefused
          )
          missing=0
          for name in "${expected[@]}"; do
            # The trailing space anchors the match: `go test -v` emits
            # "--- PASS: <name> (0.01s)". Without it a future
            # TestStageOut_OrdinaryFileUnaffectedByX would satisfy the check
            # for TestStageOut_OrdinaryFileUnaffected.
            if ! grep -q -- "--- PASS: $name " windows-unit.log; then
              echo "::error::$name did not pass (skipped, missing, or failed)"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Confirmed all ${#expected[@]} named windows staging tests passed."
          fi
          exit $missing

      # The Windows service support's unit tests, required to PASS by name
      # because a green `go test` cannot tell a skip from a pass. The real-SCM
      # suite (test/winservice) has its own job.
      #
      # None of these touches a real service, account or system directory:
      # the handler is driven through a fake SCM request channel, the command
      # group through injected fake operations, and the ACL tests use temp
      # directories. Tests that can skip on this runner are not listed:
      #
      # TestNewCommand_EverySubcommandRequiresElevationFirst runs the real
      # operations, so it skips when the process is elevated, as this runner
      # is. Its property (every subcommand checks elevation first) is required
      # as TestNewCommand_ElevationCheckedBeforeAnyOperation, which injects a
      # failing elevation check and holds at any elevation.
      #
      # TestRotatingFile_RenameBlockedByOpenHandleKeepsAppending probes whether
      # the host blocks renaming a file held open without FILE_SHARE_DELETE
      # and skips when it does not, which is expected here. Its property (a
      # failed rotation rename keeps appending, loses nothing, and retries
      # later) is required as
      # TestRotatingFile_RenameFailureKeepsAppendingAndRetriesLater, which
      # injects the failure and holds on every host.
      - name: Assert the windows service unit tests actually ran
        shell: bash
        run: |
          expected=(
            # The SCM handler (internal/winsvc/handler_windows_test.go).
            TestHandler_StopCancelsAndExitsZero
            TestHandler_PreShutdownCancels
            TestHandler_FnErrorExitsServiceSpecificAndTraces
            TestHandler_CheckpointsAdvanceDuringSlowDrain
            TestHandler_StopDuringSlowStartup
            TestHandler_InterrogateAnsweredWhileRunningAndStopping
            TestHandler_ServiceNameFromArgs
            TestHandler_ChdirFailureIsReported
            TestHandler_NoConfigPathRefusedBeforeFn
            TestHandler_CanceledErrorAfterStopIsCleanExit
            TestHandler_CanceledErrorWithoutStopStillFails
            TestHandler_OtherErrorAfterStopStillFails
            TestHandler_TraceFallsBackToWorkDir
            TestHandler_TraceUsesDefaultLogWhenWritable
            TestHandler_NoTraceFallbackWithoutWorkDir
            # The `service` command group, driven by fake operations.
            TestNewCommand_ElevationCheckedBeforeAnyOperation
            TestInstall_ExistingServiceRefusedBeforeAnySideEffect
            TestInstall_DisplayNameForAnotherInstance
            # SCM helpers: stop-and-wait, the start settle window, create-error
            # mapping, elevation check.
            TestStopAndWait
            TestStopAndWait_NeverStopsIsBounded
            TestStopAndWait_OtherControlErrorFails
            TestAwaitStart
            TestCreateError_MapsServiceExists
            TestRequireElevated_MatchesProcessToken
            # Log-directory ACLs and junction refusal, on temp directories.
            TestEnsureLogDir_GrantsAccountOnExistingProtectedDir
            TestEnsureLogDir_CreatesProtectedDirForAccount
            TestEnsureLogDir_KeepsUnprotectedDirUnprotected
            TestEnsureLogDir_RefusesJunction
            TestEnsureLogDir_RefusesReparsePointParent
            TestEnsureLogDir_RefusesReparsePointParentOnCreate
            TestEnsureLogDir_LocalSystemExistingDirUnchanged
            TestEnsureLogDir_LocalSystemRefusesJunction
            TestEnsureLogDir_LocalSystemRefusesReparsePointParent
            TestEnsureLogDir_RefusesExistingFile
            TestCreateLogDir_MissingDirGetsProtectedDACL
            TestCreateLogDir_ExistingDirIsUntouched
            TestCreateLogDir_RefusesExistingJunction
            TestCreateLogDir_RefusesReparsePointParent
            TestCreateLogDir_RefusesExistingDirUnderReparsePointParent
            TestRuntimeLogDirsAreProtected
            # Service-mode log path resolution and the startup-failure trace.
            TestDefaultLogPath_UnderProgramData
            TestResolveLogFile_ServiceModeCreatesDirectory
            TestAppendTrace_WritesJSONLine
            TestFallbackTracePath
            # A service refuses to run without --config.
            TestRequireConfigFile
            # The rotating log file (internal/log).
            TestRotatingFile_RenameFailureKeepsAppendingAndRetriesLater
            TestRotatingFile_BlockedCurrentFileRenameKeepsBackups
            TestRotatingFile_BackupShiftFailurePutsCurrentFileBack
            TestRotatingFile_RecoversAfterFailedReopen
            TestRotatingFile_CloseAfterUnrecoveredReopenIsNil
            # Secret reading (internal/secretin), non-console fallback only:
            # these read from a strings.Reader, so the no-echo console path
            # is not exercised.
            TestReadLine_PipedInputUnchanged
            TestReadLine_EmptyInputErrors
            # Per-binary service wiring.
            TestServerServiceCommand_Registered
            TestServerDrainTimeout_IsShutdownTimeout
            TestWorkerServiceCommand_Registered
            TestWorkerDrainTimeout_FromConfig
            TestWorkerDrainBound_CoversGraceAndKillWindow
            TestConnectToBroker_FailedDialAfterCancelWrapsCanceled
          )
          missing=0
          for name in "${expected[@]}"; do
            # The trailing space anchors the match (see the staging step).
            if ! grep -q -- "--- PASS: $name " windows-unit.log; then
              echo "::error::$name did not pass (skipped, missing, or failed)"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Confirmed all ${#expected[@]} named windows service unit tests passed."
          fi
          exit $missing

      - name: Run windows isolation integration tests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-isolation-windows.ps1 2>&1 | Tee-Object -FilePath isolation-windows.log

      # The script exits 0 when not elevated, so this fails on that message
      # and requires all 17 tests to PASS by name: 8 TestIsolationWindows_*
      # (elevated admin) and 9 TestIsolationWindowsSystem_* (SYSTEM).
      - name: Assert the suite actually ran
        shell: bash
        run: |
          if grep -q "not elevated" isolation-windows.log; then
            echo "::error::The runner was not elevated — the isolation suite did not run. A skip here proves nothing, so this is a hard failure."
            exit 1
          fi
          expected=(
            TestIsolationWindows_CapableRejectsPlainAdmin
            TestIsolationWindows_ChownRecursiveDoesNotFollowJunction
            TestIsolationWindows_CredentialDirectoryExcludesUnprivilegedTrustees
            TestIsolationWindows_CredentialFileNotReadableByRunAsAccount
            TestIsolationWindows_CredentialMissingIsActionable
            TestIsolationWindows_CredentialRoundTrip
            TestIsolationWindows_SecondAccountCannotOpenSessionDir
            TestIsolationWindows_SessionDirACLIsProtected
            TestIsolationWindowsSystem_Capable
            TestIsolationWindowsSystem_ChildCanWriteSessionDir
            TestIsolationWindowsSystem_ChildRunsAsTargetUser
            TestIsolationWindowsSystem_CrossUserSessionDirDenied
            TestIsolationWindowsSystem_DaemonEnvNotInherited
            TestIsolationWindowsSystem_NoIsolationUnchanged
            TestIsolationWindowsSystem_ProfileEnvPointsAtTargetUser
            TestIsolationWindowsSystem_RunsAsSystem
            TestIsolationWindowsSystem_StageOutRefusesPlantedJunction
          )
          missing=0
          for name in "${expected[@]}"; do
            # The trailing space anchors the match (see the staging step).
            # Without it a future TestIsolationWindowsSystem_CapableXyz would
            # satisfy the check for TestIsolationWindowsSystem_Capable.
            if ! grep -q -- "--- PASS: $name " isolation-windows.log; then
              echo "::error::$name did not pass"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Confirmed all ${#expected[@]}/17 named isolation tests passed."
          fi
          exit $missing

  # ── Windows service: real Service Control Manager ────────────────────────────
  # Drives both binaries through the real Windows Service Control Manager:
  # install, start, stop, uninstall, a hand-registered New-Service worker, a
  # startup failure's trace, and a --user account. This is the only job that
  # installs a real service; the fake-driven unit tests run in
  # isolation-integration-windows.
  #
  # The suite prints "not elevated" and exits 0 without running on a
  # non-elevated shell, so the assertion step fails on that message and
  # requires every test to PASS by name.
  #
  # One arch: the SCM, LogonUserW and the LSA are not architecture-dependent,
  # and hosted windows-arm64 runners are not generally available.
  winservice-integration:
    name: Windows service integration
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -timeout matches `make test-service-windows`. TestMain builds both
      # binaries.
      - name: Run the Windows service suite
        shell: bash
        run: |
          go test -tags winservice -count=1 -v -timeout 20m ./test/winservice/... 2>&1 | tee winservice.log

      # Fails on the not-elevated message and unless all six tests PASS by
      # name; see the job comment.
      - name: Assert the suite actually ran
        shell: bash
        run: |
          if grep -q "not elevated" winservice.log; then
            echo "::error::The runner was not elevated — the service suite did not run. A skip here proves nothing, so this is a hard failure."
            exit 1
          fi
          expected=(
            TestWinService_ServerLifecycle
            TestWinService_InstallRefusesExisting
            TestWinService_WorkerLifecycle
            TestWinService_StartupFailureLeavesTrace
            TestWinService_HandRegisteredNewService
            TestWinService_UserAccount
          )
          missing=0
          for name in "${expected[@]}"; do
            # The trailing space anchors the match (see
            # isolation-integration-windows).
            if ! grep -q -- "--- PASS: $name " winservice.log; then
              echo "::error::$name did not pass (skipped, missing, or failed)"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Confirmed all ${#expected[@]}/6 named Windows service tests passed."
          fi
          exit $missing

  # ── Integration suite (whole package) ────────────────────────────────────────
  # Runs all of test/integration/ with `make test-integration`, with no -run
  # filter, so a new test is covered as soon as it is added. It builds a real
  # sqi-worker binary along the way (see worker_binary_test.go) and needs
  # nothing beyond Go, Docker and ffmpeg.
  #
  # The LDAP and OIDC tests run here too, against containers. Their images are
  # pulled first so a registry problem fails with a clear message instead of
  # a cold-pull timeout inside the test that reads as a skip. The isolation
  # tests need root (see isolation-integration) and skip here; this job
  # asserts nothing about them.
  #
  # A green `go test` proves nothing if the suite collected no tests (a
  # build-tag regression, a stray -run filter), so the job also requires a
  # fixed list of tests to PASS by name. A skip in the LDAP, OIDC or
  # isolation tests does not fail the job.
  integration-tests:
    name: Integration suite
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pulled explicitly so a registry problem fails here with a clear
      # message, not inside the test as a cold-pull timeout that reads as a
      # skip.
      - name: Pull OpenLDAP image
        run: docker pull osixia/openldap:1.5.0

      - name: Pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:26.0.7

      # The preset tests are untagged, so the `integration` build tag this job
      # adds does not exclude them: `make test-integration` runs
      # TestZZPresetTierRegistrySatisfied too, and the registry's tier2 blocks
      # require the real-ffmpeg cases to run, not skip.
      - name: Install ffmpeg (the registry's tier-2 claims require it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Run the integration suite
        run: |
          set +e
          # The Makefile's INTEGRATION_TEST_FLAGS default (-timeout 20m)
          # covers the backup/restore tests' reconcile-grace waits plus up to
          # ~90s of LDAP and ~180s of Keycloak container readiness.
          make test-integration 2>&1 | tee integration-output.log
          status=${PIPESTATUS[0]}
          set -e

          # Required by name, so a build-tag or filter regression that leaves
          # the suite collecting no tests cannot pass this job.
          expected=(
            TestDefaultConfig_NoBrokerAuth
            TestRevocation_DisconnectsAndReclaims
            TestEnrollment_ConnectsToRunningBrokerWithoutRestart
            TestEXPRParamTypes_BindAndCarry
            TestEXPRJobEndToEnd
            TestBackupRestore_FarmResumes
            TestRestore_MixedAgeNATSDir
            TestUpgrade_OlderBinaryRefused
            TestTaskFailureReason_VisibleEndToEnd
            TestWorkerBinaryStagingFailureReason
            TestProductSubmit_RetryOverrides
            TestAutoRetry_RetryThenSucceed
            TestTLSEndToEnd
            TestTLSWorkerWithoutCAIsRefused
            # Skips without a working Python 3. Runs the Houdini preset's
            # driver against every chunk spelling sqi emits.
            TestHoudiniROPRender_DriverRendersEachRange
            # The After Effects macOS presets' sh wrapper, run here with its
            # os.family gate stripped because no macOS runner exists
            # (preset-harness-windows asserts the Windows wrapper). The parent
            # passes even when every subtest skips (newTier3Env skips on a
            # host it cannot stage), so one leaf is named too: aerender
            # logging an error and exiting 0, on a macOS variant.
            TestPresetAfterEffects_WrapperFailsOnLoggedError
            TestPresetAfterEffects_WrapperFailsOnLoggedError/logged-error-exit-0/after-effects-render-macos
          )
          missing=0
          for name in "${expected[@]}"; do
            if ! grep -q -- "--- PASS: $name " integration-output.log; then
              echo "::error::$name did not pass"
              missing=1
            fi
          done
          if [ "$status" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "::error::the integration suite did not all pass (exit=$status)."
            exit 1
          fi
          echo "Confirmed all ${#expected[@]} named integration tests passed, and the whole suite exited 0."

  # ── mDNS discovery over real multicast ───────────────────────────────────────
  # Separate from integration-tests for two reasons. Whether a hosted runner
  # can multicast on loopback depends on the runner, so a runner that cannot
  # fails this job alone with a clear error. And the real-binary test binds
  # the test broker to all interfaces, which should happen only when
  # discovery testing was asked for; `make test-integration` skips it.
  #
  # SQI_TEST_REQUIRE_MULTICAST=1 (set by `make test-discovery`) turns the
  # capability skip into a failure, so this job cannot pass while covering
  # nothing.
  discovery-integration:
    name: mDNS discovery (real multicast)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The advertisement carries "<hostname>.local", which the worker dials.
      # macOS resolves that through mDNSResponder; a stock ubuntu runner has
      # no mDNS NSS module, so the worker would discover the server and then
      # fail to dial it.
      #
      # A hosts entry instead of libnss-mdns and avahi: avahi-daemon would
      # take port 5353, which the test's own responder binds.
      - name: Resolve this host's mDNS name locally
        run: |
          echo "127.0.0.1 $(hostname).local" | sudo tee -a /etc/hosts
          getent hosts "$(hostname).local" || {
            echo "::error::$(hostname).local still does not resolve"; exit 1; }

      # The tests advertise on loopback only, so a run never announces a
      # service on the network it is on, and never fall back to a real
      # interface. That needs two things macOS lo0 has and Linux lo lacks:
      #
      #  1. The MULTICAST flag. The tests select interfaces by it, so an
      #     untouched `lo` looks like a host that cannot multicast.
      #  2. A non-loopback address. zeroconf builds the advertisement's address
      #     records from the interface's addresses minus loopback ones
      #     (addrsForInterface: `!ipnet.IP.IsLoopback()`). Linux `lo` has only
      #     127.0.0.1 and ::1, so registration fails with "Could not determine
      #     host IP addresses". macOS lo0 also has fe80::1; adding it here
      #     makes the two alike, and a link-local address is not routed.
      - name: Prepare loopback for mDNS
        run: |
          ip -o addr show lo
          sudo ip link set lo multicast on
          ip link show lo | grep -q MULTICAST || {
            echo "::error::could not enable MULTICAST on lo"; exit 1; }
          sudo ip -6 addr add fe80::1/64 dev lo || true
          ip -o -6 addr show lo scope link | grep -q fe80 || {
            echo "::error::lo has no link-local address, so a loopback-only mDNS"
            echo "::error::advertisement cannot register — see the comment above"
            exit 1; }

      - name: Run the discovery suite over real multicast
        run: |
          set +e
          make test-discovery 2>&1 | tee discovery-output.log
          status=${PIPESTATUS[0]}
          set -e

          expected=(
            TestDiscovery_TLSRecordsCrossTheWire
            TestDiscovery_AdvertisedBrokerTLSReachesWorkerConfig
            TestDiscovery_RealBinaryFindsItsServerOverMDNS
          )
          missing=0
          for name in "${expected[@]}"; do
            if ! grep -q -- "--- PASS: $name " discovery-output.log; then
              echo "::error::$name did not pass"
              missing=1
            fi
          done
          if [ "$status" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "::error::the mDNS discovery suite did not pass (exit=$status)."
            echo "::error::if the runner cannot do multicast, the suite says so explicitly."
            exit 1
          fi
          echo "Confirmed all ${#expected[@]} discovery tests passed over real multicast."

  # Runs the official OpenJD conformance suite (a pinned submodule under
  # third_party/) against internal/openjd. Tagged `conformance`, so the
  # default `make test` does not run it.
  #
  # `make test-conformance` would succeed if the walker collected no
  # fixtures, so the assertion step requires each test's PASS line.
  #
  # TestConformance_Templates scores EXPR/job_templates along with the other
  # suites. TestConformance_LetBindingFixtures asserts named EXPR fixtures by
  # their exact rejection message, so requiring it keeps a zero-fixture run
  # from looking green. TestConformance_TaskChunkingJobOutputs scores the
  # TASK_CHUNKING jobs/ fixtures (how chunks are spelled and sized), which
  # TestConformance_Templates does not read.
  conformance:
    name: OpenJD conformance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository and the conformance suite
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run the official OpenJD conformance suite
        shell: bash
        run: make test-conformance 2>&1 | tee /tmp/conformance.log

      - name: Assert the suite actually ran
        run: |
          grep -q -- '--- PASS: TestConformance_SuitePresent' /tmp/conformance.log
          grep -q -- '--- PASS: TestConformance_Templates' /tmp/conformance.log
          grep -q -- '--- PASS: TestConformance_LetBindingFixtures' /tmp/conformance.log
          grep -q -- '--- PASS: TestConformance_TaskChunkingJobOutputs' /tmp/conformance.log

  # ── ffmpeg reference presets: execute them ───────────────────────────────────
  # Runs the shipped ffmpeg presets (presets/sqi/ffmpeg-*.yaml) through a real
  # server and worker and probes the video they produce. Schema validation
  # (internal/product) and the cost pin (exprpresetcost) cannot see a command
  # line that parses and transcodes nothing, such as a BOM'd concat list or
  # an embedded join script with no .ps1 filename.
  #
  # These tests skip without ffmpeg and ffprobe on PATH. The `test` job also
  # installs ffmpeg, but its registry (presets/validation-tiers.yaml) names
  # only one tier2 case per preset; the ceiling, zero-padding and
  # cost-ceiling cases are required nowhere else. This job requires each PASS
  # line by name.
  #
  # The bash-joined variant is required here. It has no OS gate (Git Bash
  # puts bash on Windows), so it also runs in preset-harness-windows, but is
  # not required there (see that job's note). The PowerShell-joined variant
  # can run only on Windows and is required in preset-harness-windows.
  ffmpeg-presets:
    name: ffmpeg reference presets (execution)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installed explicitly: an ffmpeg that comes with the runner image can
      # disappear on an image bump, and without it the tests skip.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Execute the ffmpeg presets end to end
        shell: bash
        run: |
          go test -run TestFFmpegPreset -v -timeout 900s ./test/integration/ 2>&1 \
            | tee /tmp/ffmpeg-presets.log

      # Each case is named, so a case that is skipped, renamed or deleted
      # fails here. The PowerShell-joined case is Windows-only and asserted in
      # preset-harness-windows.
      - name: Assert every linux-runnable case actually ran
        run: |
          for name in \
            TestFFmpegPreset_TranscodeProducesPlayableOutput \
            TestFFmpegPreset_PortableSegmentTranscodeJoins \
            TestFFmpegPreset_BashSegmentTranscodeJoins \
            TestFFmpegPreset_SegmentCountUsesCeilingNotTruncation \
            TestFFmpegPreset_SliceNamesAreZeroPadded \
            TestFFmpegPreset_PortableRejectsBeyondItsCostCeiling \
            TestFFmpegPreset_SequenceEncodeNamesOutputAfterPattern \
          ; do
            grep -q -- "--- PASS: ${name} " /tmp/ffmpeg-presets.log \
              || { echo "::error::${name} did not run to a PASS"; exit 1; }
          done

  # ── Preset harness, on Windows ───────────────────────────────────────────────
  # TestPresetTier1Argv, TestPresetTier3 and TestZZPresetTierRegistrySatisfied
  # are untagged, so `make test` runs them, but only on ubuntu-latest. The
  # Tier-1 goldens are POSIX-spelled, and the worker resolves an EXPR
  # preset's paths in the host's flavor, so "/mnt/show/a.mov" becomes a
  # backslash-separated path on a Windows worker. internal/presettest's
  # Render() undoes that so one golden serves every host; if it stops doing
  # so, the argv sqi sends a Windows renderer has changed and no ubuntu job
  # can see it. The registry's tier2 blocks also name windows in
  # `required_on`, so only this job can prove those cases run there.
  #
  # Its own job, not a step of isolation-integration-windows, so a preset
  # failure is reported under its own name. It needs no elevation and no
  # containers.
  #
  # TestZZPresetTierRegistrySatisfied checks what the tier tests recorded in
  # this process (internal/presettest's outcome sink), so every tier runs in
  # one `go test` invocation; splitting them makes the registry check fail
  # with "never reported".
  #
  # Runs on every push, and on pull requests only when the presets filter
  # fires.
  preset-harness-windows:
    name: Preset harness (windows)
    runs-on: windows-latest
    needs: [test, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.presets == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: choco install ffmpeg --yes --no-progress

      # Installed explicitly, like ffmpeg: python-sequence's tier2 case
      # (TestPresetPythonSequence_LauncherContract) is required on windows,
      # and a Python that comes with the image can disappear on an image bump.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # One invocation for every tier; see the job comment.
      - name: Run the whole preset harness
        shell: bash
        run: |
          ffmpeg -version | head -1
          go test -count=1 -run 'TestPreset|TestZZPreset|TestFFmpegPreset|TestScriptPowerShell' -v -timeout 1800s ./test/integration/ 2>&1 |
            tee preset-harness-windows.log

      # A `-run` regex that matched nothing (after a rename, or a registry
      # that failed to load) exits 0 having asserted nothing.
      # TestPresetAfterEffects_WrapperFailsOnLoggedError pins the After
      # Effects Windows wrapper's exit status, which no registry case covers;
      # one leaf subtest is named too, because the parent passes even when
      # every subtest skips. A trailing space anchors each name: `go test -v`
      # emits "--- PASS: <name> (0.01s)", so without it a future
      # TestPresetTier3Xyz would satisfy the check. Only the ffmpeg name,
      # which nothing else extends, goes without one.
      #
      # TestFFmpegPreset_BashSegmentTranscodeJoins runs here but is not
      # listed, and the registry's tier2 required_on omits windows for it: it
      # skips when the worker process cannot find bash.exe on PATH, and no
      # run on this image has shown it passing. Add it here and in the
      # registry once one does.
      - name: Assert every tier actually ran
        shell: bash
        run: |
          missing=0
          for name in "TestPresetTier1Argv " "TestPresetTier3 " "TestZZPresetTierRegistrySatisfied " \
                      "TestFFmpegPreset_PowerShellSegmentTranscodeJoins" \
                      "TestScriptPowerShell_ExitStatus " \
                      "TestPresetAfterEffects_WrapperFailsOnLoggedError " \
                      "TestPresetAfterEffects_WrapperFailsOnLoggedError/logged-error-exit-0/after-effects-render-windows " \
                      "TestPresetPythonSequence_LauncherContract "; do
            if ! grep -q -- "--- PASS: ${name}" preset-harness-windows.log; then
              echo "::error::${name} did not run to a PASS on windows"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Confirmed tiers 1, 2 and 3, the Python launcher, the After Effects wrapper and the registry check ran on windows."

  # Differential-tests internal/openjd/expr against the EXPR reference
  # implementation, the openjd.expr namespace of openjd-model (a re-export
  # layer over a compiled Rust crate). Tagged `oracle`, so the default
  # `make test` does not run it.
  #
  # `make test-expr-oracle` exits 0 and the test skips when no interpreter
  # can import the package, so the assertion step requires the PASS line.
  #
  # One arch: the corpus tests expression semantics. sqi's evaluator is pure
  # Go, and upstream builds the reference's abi3 wheel per arch.
  expr-oracle:
    name: EXPR reference-implementation oracle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the differential test against the OpenJD reference
        shell: bash
        run: make test-expr-oracle 2>&1 | tee /tmp/expr-oracle.log

      - name: Assert the oracle actually ran
        run: |
          grep -q -- '--- PASS: TestExprOracle_MatchesReferenceImplementation' /tmp/expr-oracle.log

  # ── Python client: lint + type-check ─────────────────────────────────────────
  # ruff and mypy follow their configured target versions (mypy checks src at
  # the 3.9 floor and tests at 3.13), not the interpreter they run on, so they
  # run once on one Python.
  python-lint:
    name: Python client lint + type-check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install client with all extras
        run: pip install -e '.[yaml,ws,dev]'

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      # src is type-checked at the 3.9 floor (pyproject python_version); the
      # tests are checked at a newer target where they are allowed to run.
      - name: mypy
        run: mypy src && mypy --python-version=3.13 tests

  # ── Python client: unit tests ────────────────────────────────────────────────
  # Runtime behavior varies by interpreter, so the unit suite and its coverage
  # gate run on every supported version from the 3.9 floor up.
  python-test:
    name: Python client tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install client with all extras
        run: pip install -e '.[yaml,ws,dev]'

      - name: Unit tests with coverage gate
        run: pytest

  # ── Python client: integration tests ─────────────────────────────────────────
  # Runs the @pytest.mark.integration suite against the real binaries from
  # the test job, on one interpreter.
  python-integration:
    name: Python client integration tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download server/worker binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin

      - name: Make binaries executable
        run: chmod +x bin/sqi-server bin/sqi-worker

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install client with all extras
        working-directory: clients/python
        run: pip install -e '.[yaml,ws,dev]'

      # The harness finds the binaries in <repo-root>/bin. --no-cov because
      # the integration subset alone does not meet the unit coverage gate.
      - name: Integration tests
        working-directory: clients/python
        run: pytest -m integration --no-cov

  # ── Python client: package build check ───────────────────────────────────────
  # Builds the sdist and wheel and checks the metadata, so a broken package
  # fails the PR instead of the release.
  python-package:
    name: Python client package check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

  # ── Submitter client: lint + type-check ──────────────────────────────────────
  # Like python-lint, ruff and mypy run once on one Python. The in-repo
  # sqi-sdk is installed first (`pip install -e ../python`) so the
  # submitter's `sqi-sdk>=0.1` dependency resolves to it, not to a PyPI
  # release.
  submitter-lint:
    name: Submitter client lint + type-check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.submitter == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: clients/submitter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/submitter/pyproject.toml

      - name: Install local sqi-sdk + submitter with dev extras
        run: pip install -e ../python -e '.[dev]'

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      # src is type-checked at the 3.9 floor (pyproject python_version); the
      # tests are checked at a newer target where they are allowed to run.
      - name: mypy
        run: mypy src && mypy --python-version=3.13 tests

  # ── Submitter client: unit tests ─────────────────────────────────────────────
  # Runtime behavior varies by interpreter, so the unit suite and its coverage
  # gate run on every supported version from the 3.9 floor up.
  submitter-test:
    name: Submitter client tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.submitter == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: clients/submitter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/submitter/pyproject.toml

      - name: Install local sqi-sdk + submitter with dev extras
        run: pip install -e ../python -e '.[dev]'

      - name: Unit tests with coverage gate
        run: pytest

  # ── Submitter client: Qt widget tests ────────────────────────────────────────
  # The PySide6 widget and dialog modules are left out of the main coverage
  # gate (pyproject.toml tool.coverage.run.omit); their tests run here,
  # headless through Qt's offscreen platform plugin, on one interpreter.
  submitter-qt-test:
    name: Submitter client Qt widget tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.submitter == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: clients/submitter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/submitter/pyproject.toml

      # The offscreen plugin needs libraries ubuntu-latest lacks: libegl1 and
      # libgl1 for Qt's GL loader, libxkbcommon0 for the keyboard layer the
      # plugin still initializes.
      - name: Install PySide6 offscreen platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Install local sqi-sdk + submitter with dev,qt extras
        run: pip install -e ../python -e '.[dev,qt]'

      - name: Qt widget + dialog tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_qt_widgets.py tests/test_qt_dialog.py --no-cov
