name: Release

# Triggered when a version tag is pushed (e.g., v0.1.0, v0.1.0-alpha).
# Runs goreleaser to produce cross-compiled binaries, archives, checksums,
# SBOMs, cosign signatures, a CHANGELOG.md, a GitHub release, and a versioned
# Docker image pushed to GHCR.
on:
  push:
    tags:
      - "v*"

# Cancel any in-flight release run for the same tag (rare but possible on
# force-push or re-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release in flight — goreleaser does not roll back partially
  # published assets if the run is interrupted.
  cancel-in-progress: false

permissions:
  contents: write    # create GitHub release and upload assets
  packages: write    # push image to ghcr.io
  id-token: write    # obtain OIDC token for keyless cosign signing

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required for goreleaser's changelog generation
          # and for git-cliff to produce a complete CHANGELOG.md.
          fetch-depth: 0

      # Fail fast (before goreleaser publishes anything) if the client version
      # was not bumped to match the release tag — keeping sqi_client.__version__
      # aligned with the repo's single version scheme. The comparison is PEP 440
      # aware (via `packaging`) so pre-release tags like v0.1.0-alpha match a
      # normalized __version__ of "0.1.0a0".
      - name: Check sqi-sdk version matches the tag
        if: ${{ !contains(github.ref_name, '-rc') }}
        run: |
          python3 -m pip install --quiet --upgrade packaging
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import pathlib
          import re
          import sys

          from packaging.version import InvalidVersion, Version

          tag = sys.argv[1]
          tag = tag[1:] if tag.startswith("v") else tag
          source = pathlib.Path("clients/python/src/sqi_client/_version.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', source)
          if not match:
              sys.exit("::error::could not find __version__ in clients/python/src/sqi_client/_version.py")
          version = match.group(1)
          try:
              mismatch = Version(version) != Version(tag)
          except InvalidVersion as exc:
              sys.exit(f"::error::invalid version string: {exc}")
          if mismatch:
              sys.exit(
                  f"::error::sqi_client.__version__ ({version}) does not match release "
                  f"tag ({tag}); bump clients/python/src/sqi_client/_version.py"
              )
          print(f"sqi-sdk version {version} matches tag {tag}")
          PY

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Node is required by the goreleaser before hooks that build the web UI
      # bundle (npm ci / npm run build in web/) ahead of the Go builds.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Required to build linux/arm64 images on the amd64 runner. The worker
      # Dockerfile.goreleaser has RUN steps (apk add) that execute under
      # emulation; the distroless server image has none but QEMU is harmless.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # buildx is required by goreleaser's `use: buildx` docker config.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign for keyless artifact and image signing.
      # Keyless mode uses the GitHub Actions OIDC token (id-token: write above).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Install syft for SBOM generation.
      # goreleaser calls syft automatically when it finds it in PATH.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # Install rcodesign (apple-codesign) to sign + notarize macOS binaries
      # from Linux. Pinned to a known-good release.
      - name: Install rcodesign
        run: |
          RC_VER="0.27.0"
          curl -fsSL -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RC_VER}/apple-codesign-${RC_VER}-x86_64-unknown-linux-musl.tar.gz"
          # GNU tar (Linux runners) needs --wildcards to treat */rcodesign as a
          # glob; without it the pattern is matched literally and not found. (BSD
          # tar on macOS globs by default, so this only fails on the CI runner.)
          tar -xzf rcodesign.tar.gz --strip-components=1 -C /usr/local/bin --wildcards "*/rcodesign"
          rcodesign --version

      # Detect whether macOS signing secrets are configured so the signing and
      # notarization steps below cleanly no-op on a tag pushed before the
      # maintainer has added the Apple credentials (see release runbook).
      - name: Check for macOS signing secrets
        id: macsign_check
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets not configured; darwin binaries will be unsigned/un-notarized."
          fi

      # Materialize the signing certificate and notarization API key from
      # secrets into temp files for goreleaser's sign hook and the notarize step.
      - name: Prepare macOS signing material
        if: ${{ steps.macsign_check.outputs.enabled == 'true' }}
        run: |
          umask 077
          echo "${{ secrets.MACOS_CERT_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          printf '%s' "${{ secrets.MACOS_CERT_PASSWORD }}" > "$RUNNER_TEMP/cert.pass"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/api.p8"
          rcodesign encode-app-store-connect-api-key \
            "${{ secrets.APPLE_API_ISSUER_ID }}" \
            "${{ secrets.APPLE_API_KEY_ID }}" \
            "$RUNNER_TEMP/api.p8" > "$RUNNER_TEMP/notary-key.json"

      # Install git-cliff for CHANGELOG.md generation from Conventional Commits.
      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      # Generate CHANGELOG.md covering all tags up to and including this one.
      # The file is written to the working tree so goreleaser can bundle it
      # into release archives (see .goreleaser.yaml archives.files).
      # Fail loudly if git-cliff produces an empty file (e.g., malformed tag).
      - name: Generate CHANGELOG.md
        run: |
          git cliff --output CHANGELOG.md
          [ -s CHANGELOG.md ] || { echo "ERROR: git-cliff produced an empty CHANGELOG.md"; exit 1; }
        env:
          # Allows git-cliff to resolve GitHub commit URLs in the body.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Export the Go toolchain version so goreleaser can embed it via ldflags.
      - name: Export GOVERSION
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERSION: ${{ env.GOVERSION }}
          # Required by cosign keyless signing inside goreleaser's signs block.
          COSIGN_YES: "true"
          MACOS_CERT_P12: ${{ steps.macsign_check.outputs.enabled == 'true' && format('{0}/cert.p12', runner.temp) || '' }}
          MACOS_CERT_PASSWORD_FILE: ${{ steps.macsign_check.outputs.enabled == 'true' && format('{0}/cert.pass', runner.temp) || '' }}

      # Notarize the signed darwin binaries. goreleaser leaves each built binary
      # under dist/<id>_darwin_<arch>*/; submit each so Gatekeeper accepts them.
      - name: Notarize macOS binaries
        if: ${{ steps.macsign_check.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bin in dist/sqi-*_darwin_*/sqi-server dist/sqi-*_darwin_*/sqi-worker; do
            echo "Notarizing $bin"
            rcodesign notary-submit \
              --api-key-file "$RUNNER_TEMP/notary-key.json" \
              --wait \
              "$bin"
          done

      # ── Python client (sqi-sdk) distributions ──────────────────────────────
      # goreleaser does not build Python artifacts, so the sdist + wheel are built
      # and attached to the same GitHub release in a separate step.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sqi-sdk sdist + wheel
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

      # goreleaser already created the GitHub release for this tag above; attach
      # the Python distributions to it alongside the Go binaries.
      - name: Attach sqi-sdk distributions to the release
        run: gh release upload "${GITHUB_REF_NAME}" clients/python/dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish sqi-sdk to PyPI via OIDC trusted publishing (no API token;
      # uses the id-token: write permission granted above). Gated on the
      # PUBLISH_TO_PYPI repository variable so it only runs once the PyPI
      # project + trusted publisher are configured (see release runbook).
      - name: Publish sqi-sdk to PyPI (trusted publishing)
        if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
