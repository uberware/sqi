name: Release

# Triggered when a version tag is pushed (e.g., v0.1.0, v0.1.0-alpha).
# Runs goreleaser to produce cross-compiled binaries, archives, checksums,
# a GitHub release, and a versioned Docker image pushed to GHCR.
on:
  push:
    tags:
      - "v*"

# Cancel any in-flight release run for the same tag (rare but possible on
# force-push or re-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release in flight — goreleaser does not roll back partially
  # published assets if the run is interrupted.
  cancel-in-progress: false

permissions:
  contents: write    # create GitHub release and upload assets
  packages: write    # push image to ghcr.io

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history is required for goreleaser's changelog generation.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # buildx is required by goreleaser's `use: buildx` docker config.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Export the Go toolchain version so goreleaser can embed it via ldflags.
      - name: Export GOVERSION
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERSION: ${{ env.GOVERSION }}
