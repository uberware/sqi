name: Preset library

# Validates the published preset library against the validator on this branch.
#
# A validator change can invalidate content that is already published. A change
# that tightens validation and corrects every preset in this repo still leaves
# the copy at uberware.github.io/sqi-presets stale, because only the release
# workflow regenerates it, so every published preset can fail to load until the
# next release. Nothing else reports that: the list page renders from the
# index, which needs no validation, and only the detail page parses, so the
# first signal would be a user clicking a preset and getting an error.
#
# Not part of ci.yml. It reaches the network, so putting it on every pull
# request would make unrelated work hostage to an outage. Instead it runs:
#
#   - on a schedule, so drift is found within a day rather than by a user;
#   - when the presets or the validator change, which is when
#     already-published content can become invalid;
#   - on demand.
on:
  schedule:
    # 07:00 UTC daily. Drift here is never urgent-to-the-minute; it just must
    # not wait for someone to click a preset.
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths:
      - "presets/**"
      - "internal/openjd/**"
      - "internal/product/**"
      - "internal/presetlib/**"
      - "test/presetlib/**"
      - ".github/workflows/preset-library.yml"
  pull_request:
    paths:
      - "presets/**"
      - "internal/openjd/**"
      - "internal/product/**"
      - "internal/presetlib/**"
      - "test/presetlib/**"
      - ".github/workflows/preset-library.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  published-presets:
    name: Published presets validate against this tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate the published preset library
        shell: bash
        run: make test-preset-library 2>&1 | tee /tmp/preset-library.log

      # The target exits 0 when the library is unreachable, because an offline
      # runner is not evidence that the content is bad. That means a green step
      # alone proves nothing -- assert the test actually ran and passed. A skip
      # fails here: it means this check verified nothing, and the
      # cause (network, or a repointed URL) needs a human.
      - name: Assert the check actually ran
        run: |
          grep -q -- '--- PASS: TestPublishedPresets_ValidateAgainstThisTree' /tmp/preset-library.log
