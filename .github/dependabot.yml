version: 2

updates:
  # ── Go modules ───────────────────────────────────────────────────────────────
  # Opens PRs to bump go.mod / go.sum dependencies.
  # Weekly on Monday keeps the dependency graph current without daily noise.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      # Follows Conventional Commits so the CHANGELOG generator picks them up.
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 5
    # Group all non-major Go bumps into a single PR to reduce noise.
    # Major version bumps open individually so they get deliberate review.
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  # Opens PRs to bump action versions in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  # ── npm (web UI) ──────────────────────────────────────────────────────────────
  # Silently skipped until web/package.json exists; will activate automatically
  # once the TypeScript/React web UI work begins.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # @vitest/eslint-plugin 1.6.21 regressed its `valid-expect` rule to
      # false-positive on the valid `expect.any(String)` asymmetric matcher
      # (web/src/api/client.test.ts), breaking `npm run lint`. Held at 1.6.20
      # (pinned exactly in web/package.json) until a fixed release supersedes
      # it, then remove this ignore and restore the caret range.
      - dependency-name: "@vitest/eslint-plugin"
        versions: ["1.6.21"]

  # ── Python client (clients/python) ────────────────────────────────────────────
  # Version-update PRs are disabled (open-pull-requests-limit: 0). This entry
  # exists to scope Dependabot's *security* updates for the Python client and to
  # ignore `pytest`: pytest's fixed versions (>= 9.0.3) require Python >= 3.10,
  # but this library still supports Python 3.9 (see pyproject `requires-python`
  # and the CI test matrix), so no fixed pytest can be installed on the 3.9 leg.
  # pytest is a dev/test-only tool that never ships to consumers, so the advisory
  # is accepted rather than fixed. Remove this ignore if the floor is raised to 3.10+.
  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "pytest"
