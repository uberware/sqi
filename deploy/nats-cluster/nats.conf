#
# Node config for deploy/docker-compose.nats-cluster.yml: one file shared by
# all three nodes, each of which sets NATS_SERVER_NAME to its service name.
#
# Put this file in the cluster directory beside:
#   sqi-accounts.conf          from `sqi-server nats external init`
#   server.crt, server.key     from `sqi-server tls init --host <name> ...`;
#                              the certificate must name the host clients dial
#
# sqi-accounts.conf defines sqi's accounts and the auth callout. nats-server
# resolves an include against the including file's directory, so the fragment
# must sit beside this file.

server_name: $NATS_SERVER_NAME

# Client port. TLS is required: sqi-server and every worker dial tls://.
listen: 0.0.0.0:4222
tls {
  cert_file: "/etc/nats/server.crt"
  key_file: "/etc/nats/server.key"
}

jetstream {
  store_dir: "/data"
}

# The routes connect the three nodes over the Compose network. no_advertise
# keeps the nodes' container addresses out of what clients are told, since
# clients outside that network could not reach them; give clients every
# node's URL instead (nats.external.urls, and the workers' nats.url).
#
# The routes are plaintext and unauthenticated. That holds only because the
# route port (6222) is not published: nothing outside the Compose network can
# reach it. For nodes on separate hosts, where routes cross a real network,
# give this block its own tls { cert_file, key_file, ca_file, verify: true }
# so the nodes present and check certificates, or an authorization { user,
# password } shared by the nodes, and let only the nodes reach port 6222.
cluster {
  name: sqi
  listen: 0.0.0.0:6222
  no_advertise: true
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}

include "sqi-accounts.conf"
