#
# HAProxy in front of a high-availability group of sqi-servers, for
# deploy/docker-compose.ha.yml. Every server answers GET /leaderz: 200 on the
# leader, 503 on a standby. HAProxy health-checks it and sends every request
# to the one server that answers 200, so clients (the web UI, the REST API,
# sqi-cli, a worker enrolling with a join token) use one address whichever
# server leads.
#
# A request that reaches a standby in the second between a failover and the
# next health check is answered 503 with Retry-After: 2, having processed
# nothing; the client retries it. HAProxy retries only what was never
# delivered: a connection that could not be made, for any request, and a
# connection closed with no response, for GET and HEAD only, since a POST may
# have been processed before the leader died. It never retries a 503, which
# the leader also returns for its own reasons (an EXPR submission past its
# deadline, say), and replaying those would multiply the most expensive
# requests. Workers do not come through here: they connect to the NATS nodes
# directly.

global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # The web UI keeps a WebSocket open for its live updates.
    timeout tunnel  1h

frontend sqi
    bind :8080
    default_backend sqi-leader

backend sqi-leader
    option httpchk GET /leaderz
    http-check expect status 200
    # Checked every second; a failed check takes a server out at once and one
    # passing check puts it back, so a new leader receives traffic within
    # about a second of opening its API.
    default-server inter 1s fall 1 rise 1
    retries 3
    retry-on conn-failure empty-response
    # Never replay a request that may have changed something.
    http-request disable-l7-retry if !METH_GET
    option redispatch 1
    server sqi-server-1 sqi-server-1:8080 check
    server sqi-server-2 sqi-server-2:8080 check
