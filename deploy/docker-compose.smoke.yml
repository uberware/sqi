#
# Smoke-test compose stack: one sqi-server and one sqi-worker.
#
# Used by CI (see .github/workflows/ci.yml smoke-test job) to verify that the
# worker connects to the server and appears online in GET /api/v1/workers after
# Docker images are built.
#
# Usage (local):
#   docker compose -f deploy/docker-compose.smoke.yml up
#   curl http://localhost:8080/api/v1/workers   # should list one online worker
#   docker compose -f deploy/docker-compose.smoke.yml down -v
#
# Note: sqi-server uses a distroless runtime image (no shell/wget) so the
# service does not declare a healthcheck here.  CI polls /readyz directly over
# the mapped port instead.

services:
  sqi-server:
    image: ghcr.io/uberware/sqi/sqi-server:latest
    ports:
      - "8080:8080"
      - "4222:4222"
    restart: unless-stopped
    environment:
      # Bind NATS to all interfaces so worker containers on the bridge network
      # can connect. This matches the default (0.0.0.0:4222) and is pinned here
      # explicitly so the smoke topology is self-documenting.
      SQI_NATS_ADDR: "0.0.0.0:4222"
      # mDNS multicast is unreliable inside Docker networks; the worker uses
      # SQI_WORKER_NATS_URL explicitly, so discovery is not needed.
      SQI_DISCOVERY_ENABLED: "false"

  sqi-worker:
    image: ghcr.io/uberware/sqi/sqi-worker:latest
    depends_on:
      - sqi-server
    restart: unless-stopped
    environment:
      SQI_WORKER_NATS_URL: "nats://sqi-server:4222"
      SQI_WORKER_DISCOVERY_ENABLE_MDNS: "false"
      SQI_WORKER_DATA_DIR: "/var/lib/sqi-worker"
      SQI_WORKER_LOG_FORMAT: "text"
      SQI_WORKER_LOG_LEVEL: "info"
      SQI_WORKER_HEARTBEAT_INTERVAL: "5s"
      SQI_WORKER_SHUTDOWN_GRACE_PERIOD: "10s"
    volumes:
      - worker-data:/var/lib/sqi-worker

volumes:
  worker-data:
