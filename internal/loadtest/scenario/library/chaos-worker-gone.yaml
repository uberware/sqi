name: chaos-worker-gone
description: chaos W2 - kill one of 2 real workers at 30s while it runs 30s tasks and never bring it back; its work is reclaimed and it is shown offline, 3 min
# The real workers serve their own queue, so every hold task runs on a real
# worker; 60 simulated workers carry the background load on render. The
# server marks the dead worker offline, and reclaims its attempts, only once
# its startup liveness grace (about 3m10s) has passed; the drain covers it.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}, {name: render-real, max_concurrent_tasks: 8}]

workers:
  - name: sim
    count: 60
    ramp: 50/s
    cpu: 8
    os: linux
    queues: [render]
  - name: render
    real: 2
    queues: [render-real]

jobs:
  - name: frames
    rate: 0.15/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120
  - name: hold
    rate: 6/m
    queue: render-real
    steps: 1
    tasks_per_step: 1
    cores: 1
    real_task: {duration: 30s, log_every: 1s}

faults:
  - at: 30s
    kill: {group: render, real: 1}

# The dead worker's tasks are reclaimed and re-run; none of them completes on
# it, so no work is redone (0 seen on Linux). At 6 hold tasks a minute of 30s
# over 2 workers it holds about 2 when it dies; the bound allows twice that,
# for a task process that outlives the kill and completes.
expect:
  max_rework_attempts: 4
