name: chaos-db-stall-5s
description: chaos - stall the server's database for 5s at 1m under steady load (100 workers, about 2.5 tasks/s); no completed work may be redone and nothing reclaimed, 3 min
# The store stalls but the server stays up: on SQLite an outside process holds
# the write lock, on PostgreSQL the server's connections stop forwarding. Five
# seconds is the short case: on SQLite it straddles the server's 5 s
# busy_timeout, so a write that began just before the stall may time out and
# one that began after it may not. The workers stay connected throughout.
#
# The stall comes at 1m, inside the server's startup liveness grace (about
# 3m10s), so no liveness sweep runs and nothing can be marked offline however
# the stall lands; what it tests is that a write failed by the stall is
# retried, not lost or applied twice.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 1m
    database: {mode: stall}
    duration: 5s

# Nothing in the run is lost to the stall, so no completed work is redone and
# the server takes nothing back from a worker.
expect:
  max_rework_attempts: 0
  max_reclaims: 0
