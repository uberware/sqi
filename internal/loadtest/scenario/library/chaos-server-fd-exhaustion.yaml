name: chaos-server-fd-exhaustion
description: chaos - lower the server's file descriptor limit to 10 free descriptors for 40s while a rack of 30 of 120 workers redials after a 20s cut; the broker restarts once the limit lifts and the farm converges, 5 min
# Linux only (RLIMIT_NOFILE, set on the server with prlimit); it needs no
# privilege and no container.
#
# The limit is applied to the running server while a partitioned rack
# redials, not at startup: the simulated fleet fails the whole run when a
# worker cannot connect at start. The redial exercises EMFILE in the HTTP and
# broker accept loops and in every file the server opens meanwhile (SQLite,
# JetStream blocks, logs), and the farm recovers once descriptors are free
# again.
#
# A cut worker redials on the real worker's backoff: nats.go waits before each
# attempt, 4s, 8s, 16s, 32s, 64s, each +-20%, so the attempts come about 4s,
# 12s, 28s and 60s after the cut (the third between 22.4s and 33.6s, the fourth
# between 48s and 72s). The timeline puts the third attempt, the first after
# the heal, inside the limit, and the next one after it:
#   3m15s  rack-b is cut from the broker for 20s (its 12s attempt, at most
#          14.4s, still fails on the cut)
#   3m20s  the limit drops to leave the server 10 free descriptors
#   3m35s  rack-b heals; its 30 workers redial 22.4s to 33.6s after the cut,
#          into 10 free descriptors
#   4m00s  the limit lifts, 40s after it dropped and 45s after the cut, before
#          any refused worker's next attempt (48s at the earliest, plus its
#          connect timeout), so every refused worker is back by 74s after the
#          cut, well inside the 55s workers-converge allows after the last heal.
# The server log shows the fault as the broker's "Temporary Client Accept
# Error(... too many open files), sleeping <n>ms": once for each back-off step
# up to 1000ms, then once a minute with a suppressed count while the limit
# holds.
#
# The redialing workers take the free descriptors, and a stream can stop
# storing: a work-queue stream opens a new block file whenever an ack empties
# its last one, and with no descriptor free that open fails and nats-server
# keeps the stream's write error ("Filestore [SQI_TASK] Critical write error:
# lmb missing"). Which stream breaks depends on whose block create falls in
# the window: the task status stream, the heartbeat stream, both, or neither.
# sqi-server reports the broken stream (/readyz degraded, one ERROR) and
# restarts its broker in place once the limit has lifted and descriptors are
# free again (it waits for max(64, 5% of the limit) to spare), which reopens
# every stream with what it had stored. While a stream is broken its ingest
# markers stop arriving, so the heartbeat sweep and the stale-assigned reap
# hold rather than act on reports the stream could not store.
duration: 5m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: rack-a
    count: 90
    ramp: 50/s
    cpu: 8
    os: linux
  - name: rack-b
    count: 30
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 3m15s
    partition: {groups: [rack-b]}
    duration: 20s
  - at: 3m20s
    fd_limit: {headroom: 10}
    duration: 40s

# As in chaos-net-rack-partition: rack-b's work in flight when it is cut can be
# reclaimed and re-run while the cut workers finish it (a refused worker is out
# for about a minute, past heartbeat_timeout), about 12 tasks on rack-b's
# quarter of the fleet and up to about 25 with the backlog; the bound of 30
# covers that.
expect:
  max_rework_attempts: 30
