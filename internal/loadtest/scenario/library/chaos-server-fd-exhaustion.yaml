name: chaos-server-fd-exhaustion
description: chaos - lower the server's file descriptor limit to 10 above its open files for 40s while a rack of 30 of 120 workers redials after a 20s cut; the server recovers when the limit lifts, 5 min
# Linux only (RLIMIT_NOFILE, set on the server with prlimit); it needs no
# privilege and no container.
#
# The design asks for a server started with a low limit and more workers than
# it can hold. The simulated fleet fails the whole run when a worker cannot
# connect at start, so that shape cannot run. Instead the limit is applied to
# the running server while a partitioned rack redials, which exercises the
# same paths: EMFILE in the HTTP and broker accept loops, and every file the
# server opens meanwhile (SQLite, JetStream blocks, logs). "Recovers when
# workers leave" becomes "recovers when descriptors are free again".
#
# A cut worker redials on the real worker's backoff: nats.go waits before each
# attempt, 4s, 8s, 16s, 32s, 64s, each +-20%, so the attempts come about 4s,
# 12s, 28s and 60s after the cut (the third between 22.4s and 33.6s, the fourth
# between 48s and 72s). The timeline puts the third attempt, the first after
# the heal, inside the limit, and the next one after it:
#   3m15s  rack-b is cut from the broker for 20s (its 12s attempt, at most
#          14.4s, still fails on the cut)
#   3m20s  the limit drops to the server's open files plus 10
#   3m35s  rack-b heals; its 30 workers redial 22.4s to 33.6s after the cut,
#          into 10 free descriptors
#   4m00s  the limit lifts, 40s after it dropped and 45s after the cut, before
#          any refused worker's next attempt (48s at the earliest, plus its
#          connect timeout), so every refused worker is back by 74s after the
#          cut, well inside the 55s workers-converge allows after the last heal.
# The broker's own accept errors never reach the server log: sqi-server drops
# nats-server's error output (H13f10), so the fault shows as the server's open
# files held at the limit while rack-b workers are still out, not as a log line.
#
# The server does not recover (H13f9). The redialing workers take the free
# descriptors, and a work-queue stream that needs a new block file while none
# is free fails that write and every later one, also after the limit lifts;
# the broker creates such files many times a minute. Which stream breaks
# depends on whose block create falls in the window. In seven runs the task
# status stream broke alone in five, the heartbeat stream alone in one and
# both in one; the log stream never did.
#   - Status stream: no task reaches running or a terminal status. The
#     stale-assigned reap takes each task back 30-45s after its lease and
#     leases it again, so every open task re-runs about every 30s until the
#     run ends, about 370s after the break, and its work never counts.
#   - Heartbeat stream: the sweep marks every worker offline for good and
#     reclaims the attempts they are still running.
duration: 5m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: rack-a
    count: 90
    ramp: 50/s
    cpu: 8
    os: linux
  - name: rack-b
    count: 30
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 3m15s
    partition: {groups: [rack-b]}
    duration: 20s
  - at: 3m20s
    fd_limit: {headroom: 10}
    duration: 40s

# As in chaos-net-rack-partition: rack-b's work in flight when it is cut can be
# reclaimed and re-run while the cut workers finish it (a refused worker is out
# for about a minute, past heartbeat_timeout), about 12 tasks on rack-b's
# quarter of the fleet and up to about 25 with the backlog; the bound of 30
# covers that.
#
# The H13f9 status-stream loop's rework is open tasks times re-runs, about
# 12 re-runs a task in the 370s left after the break (no task showed more than
# 12 attempts), on every task open when the stream breaks or submitted after
# it. Six such runs counted 1,050 to 1,572, the most in the run whose
# heartbeats broke too, where the sweep's reclaims re-lease tasks sooner than
# the reap; the heartbeat-only run counted 75. The ceiling of 2,500 leaves 60%
# over the most counted; a count over it is still a failure.
expect:
  max_rework_attempts: 30
  known_violations:
    - check: terminal
      kind: may
      reason: a block file the broker cannot create while the descriptor limit holds leaves the task status stream failing every write until the server restarts, so no task status is stored after it and no job finishes; the status stream broke in six runs of seven
      tracker: H13f9
    - check: outcomes
      kind: may
      reason: when the status stream breaks no task status is stored after it, so the open tasks stay assigned and never reach the status the simulator decided; six runs of seven
      tracker: H13f9
    - check: rework
      kind: must
      max_attempts: 2500
      reason: whichever stream breaks, finished work is rejected - with the status stream broken the stale-assigned reap takes every leased task back and leases it again about every 30s, and with the heartbeat stream broken the sweep reclaims the attempts of workers still running them
      tracker: H13f9
    - check: single-attempt
      kind: may
      reason: when the heartbeat stream breaks, the sweep reclaims the attempts of workers still running them and leases the tasks again; it broke in two runs of seven
      tracker: H13f9
    - check: workers-converge
      kind: may
      reason: when the heartbeat stream breaks no heartbeat is stored, the sweep marks every worker offline and none comes back; two runs of seven
      tracker: H13f9
    - check: executions-recorded
      kind: may
      reason: when the heartbeat stream breaks, the attempts the swept workers were running can stay open in the stopped server's store; one run of the two where it broke
      tracker: H13f9
