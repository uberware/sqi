name: chaos-server-stall-short
description: chaos - SIGSTOP the server (and its embedded broker) for 15s, under heartbeat_timeout, then SIGCONT, under steady load (100 workers); records reclaims, 3.75 min
# The stall starts at 3m15s, after the server's startup liveness grace: the
# server runs no liveness sweep for about 3m10s after it starts, so a stall
# inside that window cannot show whether a sweep runs before the heartbeat
# backlog is consumed.
# POSIX only (SIGSTOP); the chaos test skips it on Windows.
duration: 3m45s
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 3m15s
    stall: {server: true}
    duration: 15s

# A stall shorter than heartbeat_timeout leaves every worker online, so
# nothing is reclaimed and no completed work is redone. Not always: a
# worker's last recorded heartbeat can be one heartbeat interval (15s) old when
# the stall starts, so at SIGCONT it is 30s old, heartbeat_timeout, and the
# resume sweep runs before the stall's queued heartbeats are consumed. A worker
# whose heartbeat fell due within milliseconds of the stall's start is marked
# offline and stays offline. That happens in some runs only, so the entry is
# "may".
expect:
  max_rework_attempts: 0
  max_reclaims: 0
  known_violations:
    - check: workers-converge
      kind: may
      reason: the resume sweep runs before the stall's queued heartbeats are consumed, so a worker whose heartbeat fell due just inside the 15s stall is 30s stale at SIGCONT and is marked offline, and a live worker marked offline stays offline while its connection stays up
      tracker: H13f3
