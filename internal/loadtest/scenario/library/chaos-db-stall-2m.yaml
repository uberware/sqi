name: chaos-db-stall-2m
description: chaos - stall the server's database for 2m at 3m15s under steady load (100 workers, about 2.5 tasks/s), four heartbeat_timeouts; no completed work may be redone and nothing reclaimed, 5.5 min
# The stall comes at 3m15s, after the server's startup liveness grace (about
# 3m10s), and lasts 2m, four times heartbeat_timeout. The heartbeats the
# workers publish meanwhile wait in the stream, and the heartbeat sweep judges
# by how far the worker consumer has applied it, not by the clock, so no live
# worker is taken offline. The store is back at 5m15s.
#
# Two minutes is also scheduler.reconcile_grace, so an attempt that ended
# during the stall, whose worker's heartbeats no longer list it while its
# terminal report still waits behind the stall, has been open for longer than
# the grace when the store answers again. The attempt reconciler and the
# heartbeat sweep wait for the queued reports and heartbeats to be applied, so
# neither takes back work from a live worker.
duration: 5m30s
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 3m15s
    database: {mode: stall}
    duration: 2m

# The workers never lose the broker, only the store stalls, so no worker should
# go offline and the server should reclaim nothing.
expect:
  max_rework_attempts: 0
  max_reclaims: 0
