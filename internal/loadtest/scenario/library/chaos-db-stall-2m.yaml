name: chaos-db-stall-2m
description: chaos - stall the server's database for 2m at 3m15s under steady load (100 workers, about 2.5 tasks/s), four heartbeat_timeouts; the run finishes with its store intact, 5.5 min
# The stall comes at 3m15s, after the server's startup liveness grace (about
# 3m10s), and lasts 2m, four times heartbeat_timeout: a long outage the server
# may handle by reclaiming work from workers it can no longer hear from, so
# this scenario sets no rework or reclaim bound. Both are reported; what it
# holds the server to is the base invariants and store-integrity (no lost
# update, no double write) once the store is back at 5m15s.
#
# Two minutes is also scheduler.reconcile_grace, so an attempt that ended
# during the stall, whose worker's heartbeats no longer list it while its
# terminal report still waits behind the stall, has been open for longer than
# the grace when the store answers again: the attempt reconciler can reclaim
# it as well as the heartbeat sweep. The sweep marks live workers offline at
# the heal, and they stay offline, so workers-converge fails on both backends.
# Tasks running twice at once follow on SQLite, not on PostgreSQL.
duration: 5m30s
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 3m15s
    database: {mode: stall}
    duration: 2m

expect:
  known_violations:
    - check: workers-converge
      kind: must
      reason: when the store answers again the heartbeat sweep marks live workers offline on the heartbeat the stall kept it from writing, and a live worker marked offline stays offline while its connection stays up, since heartbeats never bring a worker back online
      tracker: H13f3
    - check: single-attempt
      kind: may
      reason: a task the heal sweep or the attempt reconciler took back is leased again while its first attempt still runs, until the stale-running cancel stops the first; seen on SQLite, not on PostgreSQL
      tracker: H13f7
