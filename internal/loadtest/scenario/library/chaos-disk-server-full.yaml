name: chaos-disk-server-full
description: chaos - fill the server's data volume at 1m for 60s under a verbose renderer (5,000 lines x 200 bytes per 20-40s task) on 40 workers; records whether the farm converges once space returns, 3 min
# The data volume is size-limited (make chaos-container) and the fault leaves it
# no free space at all for 60s, so every write the server makes to its
# database or its broker's data fails with ENOSPC; the verbose renderer keeps
# the log and status streams writing throughout. About 18 tasks are in flight
# at a time, each streaming about 33 KB/s. The space returns at 2m.
#
# The fault comes at 1m, inside the server's startup liveness grace (about
# 3m10s), so no liveness sweep runs while the volume is full. No rework or
# reclaim bound is set yet: what the run measures first is whether the server
# survives the full volume and finishes every task once the space returns.
#
# It does not (H13f9). The embedded broker's first stream write that hits
# ENOSPC leaves that stream with a write error that outlasts the full volume,
# so from the fill on no task status, heartbeat or log chunk is stored for the
# rest of the run (a restart was not tried). The server stays up, answers REST and stays ready, and
# logs nothing (it drops the broker's error output, H13f10). When the startup
# grace ends, about 73s after the space returns, the sweep marks every worker
# offline and reclaims its attempts; none comes back. Every check that needs
# a status or a heartbeat fails, every run.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 40
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: verbose
    rate: 0.1/s
    queue: render
    steps: 1
    tasks_per_step: 6
    cores: 1
    task:
      duration: {dist: uniform, min: 20s, max: 40s}
      log_lines: 5000
      log_line_bytes: 200

faults:
  - at: 1m
    disk_full: {volume: server, headroom_bytes: 0}
    duration: 60s

expect:
  known_violations:
    - check: terminal
      kind: must
      reason: a stream write that hits ENOSPC leaves the broker's streams failing every write for the rest of the run, so no task status is stored after the fill and no job finishes
      tracker: H13f9
    - check: outcomes
      kind: must
      reason: no task status is stored after the fill, so the tasks in flight keep the status they had and never reach the one the simulator decided
      tracker: H13f9
    - check: single-attempt
      kind: must
      reason: the sweep that runs when the startup grace ends reclaims every worker's attempts on heartbeats the broken stream never stored, and leases them again while the originals still run
      tracker: H13f9
    - check: workers-converge
      kind: must
      reason: no heartbeat is stored after the fill, so the sweep marks every worker offline when the startup grace ends and none comes back
      tracker: H13f9
    - check: executions-recorded
      kind: must
      reason: attempts the workers ran after the fill never had their terminal status stored, so they are still running in the stopped server's store
      tracker: H13f9
