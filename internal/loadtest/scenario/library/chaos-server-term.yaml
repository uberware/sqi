name: chaos-server-term
description: chaos - stop the server gracefully at 1m and start it 10s later, the upgrade path, under steady load (100 workers, about 2.5 tasks/s); no completed work may be redone, 3 min
# A worker publishes a terminal status, and each attempt's first running status,
# as a JetStream publish that waits for the stream's acknowledgment and retries
# until it gets one, so a status in flight when the embedded broker stops is
# stored after the restart. A graceful restart must therefore redo no completed
# work: max_rework_attempts is 0 and no known violation excuses it.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 1m
    term: {server: true}
    restart_after: 10s

expect:
  max_rework_attempts: 0
