name: chaos-server-kill-5s
description: chaos - SIGKILL the server at 1m and restart it 5s later under steady load (100 workers, about 2.5 tasks/s); no completed work may be redone, 3 min
# The workers stay up through the outage. The server stands its liveness
# sweeps down for about 3m10s after the restart (heartbeat_timeout 30s plus a
# worker's longest redial and one heartbeat), so anything the restart strands
# is reclaimed only around 4m15s; the drain covers that and a re-run.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 100
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: frames
    rate: 0.25/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120

faults:
  - at: 1m
    kill: {server: true}
    restart_after: 5s

expect:
  max_rework_attempts: 0
