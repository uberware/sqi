name: ci-medium
description: "mixed - 300 workers, shot-render 0.12/s and comp 0.07/s (about 5.5 tasks/s offered, about 3.8 steady) with churn, cancels and retries, 15 min; sized for a 4-vCPU CI runner: on WSL pinned to 4 CPUs (Intel i7-10750H) a 5 min run measured generator 0.27 cores peak (0.14 mean) of 4, server 2.3 cores peak (1.1 mean), VALID"
# Sizing: the original 1/s + 0.5/s (about 45 tasks/s) saturated the
# server on 4 CPUs (3.4 cores, a 4,584-task backlog, 228 of 452 jobs unfinished
# after the drain). Rates were then tried at 0.08/0.05 (2.0 cores peak),
# 0.16/0.10 (3.3 cores peak, first-lease p95 4.3s, near the knee) and settled at
# 0.12/0.07: generator peak 0.27 / mean 0.14 cores, server peak 2.27 / mean 1.15
# cores, first-lease p95 0.78s, all six invariants held. Measured as 5 min runs
# pinned with taskset to 4 CPUs of an Intel i7-10750H (WSL2); the 15 min
# validation is a separate run.
duration: 15m
warmup: 1m

farm:
  queues: [{name: render}, {name: comp}]
  usage_pools: [{name: arnold, limit: 100}]

workers:
  - name: linux-render
    count: 300
    ramp: 100/s
    cpu: 8
    os: linux
    tags: {arnold: "true"}
    churn: {crash_per_hour: 0.2, disconnect_per_hour: 0.4, restart_after: 30s}

jobs:
  - name: shot-render
    weight: 4
    rate: 0.12/s
    queue: render
    steps: 2
    tasks_per_step: 20
    cores: 2
    usage_pool: arnold
    task:
      duration: {dist: lognormal, median: 10s, p95: 40s}
      fail_rate: 0.01
      log_lines: {median: 100, p95: 500}
  - name: comp
    weight: 1
    rate: 0.07/s
    queue: comp
    steps: 1
    tasks_per_step: 10
    cores: 1
    task:
      duration: {dist: uniform, min: 2s, max: 10s}
      log_lines: 30

clients:
  websocket: {count: 20, subscribe: [jobs, workers, own-job-tasks, own-task-logs]}
  rest_pollers: {count: 5, interval: 5s, endpoints: [jobs-list, job-detail, task-list, workers-list]}

actions:
  - at: 5m
    cancel_jobs: {fraction: 0.1}
  - at: 10m
    retry_failed: true
