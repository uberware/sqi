# SPDX-License-Identifier: AGPL-3.0-or-later
name: soak-steady
description: time - 500 workers under moderate steady mixed load for 8 h; growth detection
duration: 8h
warmup: 10m

farm:
  queues: [{name: render}, {name: comp}]

workers:
  - name: linux-render
    count: 500
    ramp: 100/s
    cpu: 8
    os: linux
    churn: {crash_per_hour: 0.1, disconnect_per_hour: 0.2, restart_after: 30s}

jobs:
  - name: shot-render
    weight: 4
    rate: 1/s
    queue: render
    steps: 2
    tasks_per_step: 20
    cores: 2
    task:
      duration: {dist: lognormal, median: 15s, p95: 60s}
      fail_rate: 0.005
      log_lines: {median: 100, p95: 500}
  - name: comp
    weight: 1
    rate: 0.3/s
    queue: comp
    steps: 1
    tasks_per_step: 10
    cores: 1
    task:
      duration: {dist: uniform, min: 2s, max: 10s}
      log_lines: 30

clients:
  websocket: {count: 20, subscribe: [jobs, workers, own-job-tasks, own-task-logs]}
  rest_pollers: {count: 5, interval: 5s, endpoints: [jobs-list, job-detail, task-list, workers-list]}
