name: chaos-worker-revoke
description: chaos - revoke one of 2 real workers' credentials at 3m15s for 60s under broker auth; it must not heartbeat or take work after the revoke, and its work is reclaimed, 4.75 min
# Broker auth is on, so each real worker holds a credential the server can
# revoke. The real workers serve their own queue, so every hold task runs on a
# real worker; 60 simulated workers carry the background load on render.
#
# The revoke comes at 3m15s: a revoked worker's row stays online until the
# server's startup liveness grace (about 3m10s) has passed and the heartbeat
# sweep runs, so a revoke earlier than that would show nothing. The credential
# is restored at 4m15s. The revoked check holds the worker to at most 5s of
# heartbeats or new attempts after the revoke.
duration: 4m45s
warmup: 10s
drain_timeout: 5m

server:
  broker_auth: true

farm:
  queues: [{name: render}, {name: render-real, max_concurrent_tasks: 8}]

workers:
  - name: sim
    count: 60
    ramp: 50/s
    cpu: 8
    os: linux
    queues: [render]
  - name: real
    real: 2
    queues: [render-real]

jobs:
  - name: frames
    rate: 0.15/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120
  - name: hold
    rate: 6/m
    queue: render-real
    steps: 1
    tasks_per_step: 1
    cores: 1
    real_task: {duration: 30s, log_every: 1s}

faults:
  - at: 3m15s
    revoke: {group: real, real: 1}
    duration: 60s

# The revoked worker's tasks are reclaimed and re-run; none of them completes
# on it, so no work is redone. At 6 hold tasks a minute of 30s over 2 workers it
# holds about 2 when it is revoked; the bound allows twice that, for a task
# process that outlives the revoke and completes.
expect:
  max_rework_attempts: 4
