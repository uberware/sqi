name: chaos-worker-kill-mid-task
description: chaos - kill one of 2 real workers at 1m while it runs 60s process trees (a chatty and a silent child) and restart it 10s later; no orphans, no second writer, 3 min
# The real workers serve their own queue, so every tree task runs on a real
# worker; 60 simulated workers carry the background load on render. Tree
# tasks arrive one every 10 s, so both real workers hold some when the kill
# lands. The killed worker's attempts are reclaimed when it re-registers from
# its new process, about 10 s after the kill (registration reclaims a
# restarted worker's tasks at once; the startup liveness grace gates only the
# heartbeat sweep), so its tree tasks re-run while the orphaned children of
# the first run may still be alive.
duration: 3m
warmup: 10s
drain_timeout: 5m

farm:
  queues: [{name: render}, {name: render-real, max_concurrent_tasks: 8}]

workers:
  - name: sim
    count: 60
    ramp: 50/s
    cpu: 8
    os: linux
    queues: [render]
  - name: render
    real: 2
    queues: [render-real]

jobs:
  - name: frames
    rate: 0.15/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120
  - name: tree
    rate: 6/m
    queue: render-real
    steps: 1
    tasks_per_step: 1
    cores: 1
    real_task: {duration: 60s, log_every: 1s, chatty_child: true, silent_child: true}

faults:
  - at: 1m
    kill: {group: render, real: 1}
    restart_after: 10s

# Rework is the killed worker's tree tasks, which run to completion as
# orphans while they are re-run: at 6 tree tasks a minute of 60s, about 6 are
# in flight across the 2 real workers, so the killed one cannot hold more.
# The bound allows 8, so it fails only on
# rework the kill cannot explain.
expect:
  max_rework_attempts: 8
  # The orphaned silent child lives only for what remains of its 60 s real
  # task when the worker is killed, so it outlives the 10 s orphan grace in
  # most runs but not all. A double write needs the re-run, about 10 s after
  # the kill, to write while the orphan still is, so both entries are `may`.
  # no-orphans would fire every run (`must`) only with a longer real task.
  known_violations:
    - check: no-orphans
      kind: may
      os: [linux]
      reason: killing sqi-worker leaves its task's process tree running on bare-process Linux; the silent child, which writes no stdout, never gets SIGPIPE and outlives the worker's restart
      tracker: H13f4
    - check: single-writer
      kind: may
      os: [linux]
      reason: the orphaned silent child keeps writing the task's output while the reclaimed task re-runs on a live worker
      tracker: H13f4
