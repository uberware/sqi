name: chaos-worker-kill-mid-task
description: chaos - kill one of 2 real workers at 1m30s while it runs 180s process trees (a chatty and a silent child) and restart it 3s later; its restart kills the orphaned trees, so no orphans and no second writer, 4 min
# The real workers serve their own queue, so every tree task runs on a real
# worker; 60 simulated workers carry the background load on render. Tree
# tasks arrive four a minute and run 180 s, so by the kill about six have
# started, three on each real worker, all still running.
#
# The kill orphans the killed worker's trees: the silent child writes no
# stdout, so the closed pipe never kills it. The worker restarts 3 s later on
# the same data directory and, before it registers, kills every process its
# predecessor recorded (the startup sweep), so the orphans are gone about 3 s
# after the kill, inside the 10 s orphan grace. Its registration then reclaims
# their tasks and they re-run with no old writer beside them.
#
# Without the sweep the silent child outlives the grace in every run: it lives
# for what is left of its 180 s task, at least 90 s after the kill. So a
# worker that does not sweep fails no-orphans every run, and single-writer
# whenever a re-run writes while the orphan still does.
duration: 4m
warmup: 10s
drain_timeout: 6m

farm:
  queues: [{name: render}, {name: render-real, max_concurrent_tasks: 8}]

workers:
  - name: sim
    count: 60
    ramp: 50/s
    cpu: 8
    os: linux
    queues: [render]
  - name: render
    real: 2
    queues: [render-real]

jobs:
  - name: frames
    rate: 0.15/s
    queue: render
    steps: 2
    tasks_per_step: 5
    cores: 1
    task:
      duration: {dist: uniform, min: 10s, max: 30s}
      log_lines: 20
      log_line_bytes: 120
  - name: tree
    rate: 4/m
    queue: render-real
    steps: 1
    tasks_per_step: 1
    cores: 1
    real_task: {duration: 180s, log_every: 1s, chatty_child: true, silent_child: true}

faults:
  - at: 1m30s
    kill: {group: render, real: 1}
    restart_after: 3s

# Rework is the killed worker's tree tasks re-run after its restart: it holds
# about three at the kill. The bound allows 6, so it fails only on rework the
# kill cannot explain.
expect:
  max_rework_attempts: 6
