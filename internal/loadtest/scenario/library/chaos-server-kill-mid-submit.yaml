name: chaos-server-kill-mid-submit
description: chaos S4 - submit one job of 100,000 tasks and SIGKILL the server 2s in, during the write, restarting it 10s later; every job listed must hold all its tasks, 3 min
# Writing 100,000 tasks takes several seconds, so the kill lands inside the
# submission's transaction. If the server created the job without answering,
# the job must still run to the end: 200 workers x 8 cores run its 1 s tasks,
# and the long drain is for that case (it ends as soon as the work is done).
duration: 3m
warmup: 10s
drain_timeout: 20m

farm:
  queues: [{name: render}]

workers:
  - name: render
    count: 200
    ramp: 50/s
    cpu: 8
    os: linux

jobs:
  - name: wide
    total: 1
    queue: render
    steps: 1
    tasks_per_step: 100000
    cores: 1
    task:
      duration: 1s
      log_lines: 1

faults:
  - at: 2s
    kill: {server: true}
    restart_after: 10s
