openapi: "3.1.0"

info:
  title: sqi-server API
  description: |
    REST API for the sqi distributed task management server.

    All error responses use the RFC 7807 problem-details format
    (`application/problem+json`).  Clients should branch on `Content-Type`
    rather than status code alone to detect error bodies.

    ## Versioning

    The URL prefix is the API contract version; every response under
    `/api/v1` carries a matching `X-API-Version: 1` header (see
    `components.headers.XAPIVersion`). The contract major is decoupled from
    the product release version below: additive changes (new endpoints,
    optional fields, enum values) do not move it, and clients must tolerate
    unknown fields and values. A breaking change ships as a new URL prefix
    (`/api/v2`) with `X-API-Version: 2`; during the migration window the old
    prefix keeps serving and marks retiring endpoints with the RFC 8594
    deprecation headers (`Deprecation`, `Sunset`, and a
    `Link rel="deprecation"` — see `components.headers`).

    ## Authorization

    Every route under `/api/v1` except `POST /auth/login`, `POST
    /auth/logout`, `GET /auth/me`, and `GET /version` is gated on the
    caller's role holding a specific permission (`jobs.read`, `jobs.write`,
    `workers.read`, `workers.manage`, `infra.read`, `infra.manage`,
    `products.read`, `products.manage`, `diagnostics.read`, `users.read`,
    `users.manage`, `apikeys.self`, `apikeys.admin`) — see the
    `read-only`/`user`/`operator`/`admin` role matrix. A request from an
    authenticated principal lacking the required permission receives
    `403 Forbidden` (`#/components/responses/Forbidden`); this is distinct
    from `401 Unauthorized`, which means no valid principal was established
    at all. When auth is disabled server-side, every request is treated as
    an anonymous superuser and no route returns 403.
  version: "0.2.0"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1
    description: Current server

tags:
  - name: jobs
    description: OpenJD job submission and management
  - name: tasks
    description: Task-level introspection, logs, and retries
  - name: workers
    description: Worker registry and administrative controls
  - name: farms
    description: Farm configuration (CRUD)
  - name: queues
    description: Queue configuration (CRUD)
  - name: storage-locations
    description: Named storage-location configuration (CRUD)
  - name: compute-locations
    description: Compute-location configuration (CRUD)
  - name: products
    description: Product catalog (built-ins + custom, CRUD)
  - name: usage-pools
    description: Usage-pool configuration (CRUD)
  - name: auth
    description: Local account login, logout, and current-principal lookup
  - name: users
    description: |
      Local account admin CRUD (create, list, get, update, set password,
      delete). Restricted to the `admin` role (`users.read` /
      `users.manage`) — see the role-permission matrix note below.
  - name: api-keys
    description: |
      Long-lived machine credentials (Bearer tokens), self-scoped to the
      authenticated caller. The raw secret is returned exactly once, at
      creation.
  - name: meta
    description: Server metadata (version/build info)

# ── Reusable components ───────────────────────────────────────────────────────

components:
  headers:
    XAPIVersion:
      description: |
        API contract major version — the "1" in `/api/v1`. Sent on every
        response under the API prefix. Decoupled from the product release
        version; only breaking changes increment it (alongside a new URL
        prefix). Clients should warn when the major is newer than the one
        they were written against.
      schema:
        type: string
        example: "1"

    Deprecation:
      description: |
        RFC 8594 deprecation marker, present only on responses from
        deprecated endpoints. The value is either the HTTP-date the
        deprecation was declared or the literal `true`. Clients should treat
        the header's presence — regardless of value — as the signal.
      schema:
        type: string
        example: "Mon, 01 Jun 2026 00:00:00 GMT"

    Sunset:
      description: |
        RFC 8594 companion to `Deprecation`: the HTTP-date when the
        deprecated endpoint will be removed. Optional.
      schema:
        type: string
        example: "Fri, 01 Jan 2027 00:00:00 GMT"

    DeprecationLink:
      description: |
        `Link` header entry with `rel="deprecation"` pointing at
        documentation describing the deprecation and migration path.
        Optional companion to `Deprecation`.
      schema:
        type: string
        example: '<https://docs.sqi.dev/api/deprecations#old-endpoint>; rel="deprecation"'

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource UUID

    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Maximum number of items to return (1–1000).

    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based item offset for pagination.

    sortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort direction.

  schemas:
    # ── RFC 7807 problem details ──────────────────────────────────────────────
    ProblemDetail:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: job not found
        instance:
          type: string
          description: Request-ID that identifies this specific occurrence.
          example: a1b2c3d4e5f60708

    # ── Jobs ─────────────────────────────────────────────────────────────────
    Job:
      type: object
      required:
        - id
        - farm_id
        - queue_id
        - name
        - owner
        - submitter
        - priority
        - status
        - template_format
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: 018f1a2b-3c4d-7e5f-a6b7-c8d9e0f12345
        farm_id:
          type: string
        queue_id:
          type: string
        name:
          type: string
          example: Arnold Render — shot_0010
        owner:
          type: string
          example: alice
        submitter:
          type: string
          example: deadline-bridge
        priority:
          type: integer
          minimum: 1
          example: 50
        status:
          type: string
          enum: [pending, blocked, paused, running, completed, failed, canceled]
        depends_on:
          type: array
          items:
            type: string
          description: >-
            IDs of upstream jobs (same farm) this job waits on before its
            tasks become ready. Present on the create response and job
            detail; omitted from list items.
        project:
          type: string
          example: my-film
        template_format:
          type: string
          enum: [yaml, json]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        task_counts:
          $ref: "#/components/schemas/TaskCounts"
          description: >-
            Aggregate task counts by status. Present on job list items and job
            detail; omitted from the create-job response.
        failed_attempts:
          type: integer
          description: Cumulative count of genuine task failures for this job.
        park_reason:
          type: string
          description: >-
            Set when the failure-limit sweep auto-parked the job (e.g. "failure
            limit reached (25)"). Empty for a manual pause.
        max_attempts:
          type: integer
          nullable: true
          description: >-
            Per-job override for the maximum attempts per task. Null means
            inherit (queue -> farm -> server default).
        retry_delay_seconds:
          type: integer
          nullable: true
          description: >-
            Per-job override for the delay before retrying a failed task. Null
            means inherit (queue -> farm -> server default).
        failure_limit:
          type: integer
          nullable: true
          description: >-
            Per-job override for the number of task failures that auto-parks
            the job. Null means inherit (queue -> farm -> server default).

    Step:
      type: object
      required: [id, name, step_order, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        step_order:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed, canceled]
        depends_on:
          type: array
          items:
            type: string
          description: IDs of steps that must complete before this one becomes ready.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCounts:
      type: object
      required:
        - total
        - pending
        - ready
        - assigned
        - running
        - succeeded
        - failed
        - canceled
        - unschedulable
      properties:
        total:
          type: integer
        pending:
          type: integer
        ready:
          type: integer
        assigned:
          type: integer
        running:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        canceled:
          type: integer
        unschedulable:
          type: integer
          description: >-
            Number of Ready tasks that currently carry a non-empty
            unschedulable reason. A subset of ready, not an additional status.

    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [steps, task_counts]
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/Step"
            task_counts:
              $ref: "#/components/schemas/TaskCounts"
            failure_summary:
              $ref: "#/components/schemas/FailureSummary"
              description: >-
                Aggregate of the job's failed tasks by failure reason. Omitted
                when the job has no failed tasks with a recorded reason.
            effective_retry:
              $ref: "#/components/schemas/EffectiveRetryPolicy"
              description: >-
                The RESOLVED retry policy this job runs under, after
                job -> queue -> farm -> server-default inheritance. Omitted
                only when the queue or farm lookup fails.

    EffectiveRetryPolicy:
      type: object
      required: [max_attempts, retry_delay_seconds, failure_limit]
      properties:
        max_attempts:
          type: integer
          minimum: 1
          description: Resolved maximum genuine attempts per task.
        retry_delay_seconds:
          type: integer
          minimum: 0
          description: Resolved delay before a failed task is retried.
        failure_limit:
          type: integer
          minimum: 0
          description: >-
            Resolved job-level failure ceiling before auto-park; 0 means the
            limit is off.

    FailureSummary:
      type: object
      required: [failed_count, distinct_reasons]
      properties:
        failed_count:
          type: integer
          description: >-
            Total number of failed tasks with a non-empty failure_reason.
        dominant_reason:
          type: string
          description: >-
            The most frequent failure_reason among the job's failed tasks;
            ties are broken by reason string ascending.
        distinct_reasons:
          type: integer
          description: Number of distinct failure_reason values.

    JobList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PatchJobRequest:
      type: object
      properties:
        priority:
          type: integer
          minimum: 1
          description: New job priority. Values ≤ 0 are ignored.
        queue_id:
          type: string
          description: Move the job to this queue.
        action:
          type: string
          enum: [pause, resume]
          description: >
            pause or resume the job. Resuming an auto-parked job (non-empty
            `park_reason`) also clears `park_reason` and resets the job's
            `failed_attempts` to zero, re-arming its failure limit.
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Update the per-job max-attempts retry-policy override. Omitted or
            null leaves the current value unchanged — a job-level override
            cannot be cleared back to "inherit" via this endpoint.
        retry_delay_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Update the per-job retry-delay retry-policy override. Omitted or
            null leaves the current value unchanged — a job-level override
            cannot be cleared back to "inherit" via this endpoint.
        failure_limit:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Update the per-job failure-limit retry-policy override. Omitted or
            null leaves the current value unchanged — a job-level override
            cannot be cleared back to "inherit" via this endpoint.

    # ── Tasks ─────────────────────────────────────────────────────────────────
    Task:
      type: object
      required:
        - id
        - job_id
        - step_id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        job_id:
          type: string
        step_id:
          type: string
        name:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Resolved OpenJD parameter values for this task.
        status:
          type: string
          enum: [pending, ready, assigned, running, succeeded, failed, canceled]
        assigned_worker_id:
          type: string
        assigned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        unschedulable_reason:
          type: string
          description: >-
            Set when a ready task cannot currently be satisfied by any online
            worker (e.g. no worker matches its required capabilities or core
            reservation). Empty/absent means schedulable. An annotation on the
            task, not a status.
        failure_reason:
          type: string
          description: >-
            Human-readable reason the task reached a terminal non-success
            (failed or canceled). Empty/absent for non-terminal tasks; cleared
            on retry.
        failed_attempts:
          type: integer
          description: >-
            Count of attempts that genuinely ran and failed for this task
            (does not count worker crashes/unassignments that trigger a retry
            without a genuine failure).
        retry_after:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set and in the future while a ready task is backing off after a
            failed attempt; the task will not be assigned to a worker until
            this time passes.

    TaskList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    TaskLog:
      type: object
      required: [id, task_id, attempt_id, seq_num, nats_seq, stream, data, at, received_at]
      properties:
        id:
          type: string
        task_id:
          type: string
        attempt_id:
          type: string
        seq_num:
          type: integer
          format: int64
          description: Monotonic sequence number within the attempt.
        nats_seq:
          type: integer
          format: int64
          description: NATS JetStream sequence; use as `after_nats_seq` cursor.
        stream:
          type: string
          enum: [stdout, stderr]
        data:
          type: string
          description: Raw log text for this chunk.
        at:
          type: string
          format: date-time
          description: Timestamp assigned by the worker.
        received_at:
          type: string
          format: date-time
          description: Timestamp when the server persisted this chunk.

    TaskLogsResponse:
      type: object
      required: [items, after_nats_seq, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskLog"
        after_nats_seq:
          type: integer
          format: int64
          description: |
            Cursor to advance to: the highest `nats_seq` returned on this page.
            Pass it as `after_nats_seq` on the next call to fetch only newer
            chunks. When the page is empty it equals the requested
            `after_nats_seq`, so a poller holds its position.
        limit:
          type: integer

    TaskAttempt:
      type: object
      required: [attempt_number, status, started_at]
      properties:
        attempt_number:
          type: integer
          description: 1-based; incremented on each retry.
        status:
          type: string
          enum: [running, succeeded, failed, canceled]
        worker_id:
          type: string
          description: ID of the worker that ran this attempt.
        exit_code:
          type: integer
          nullable: true
          description: Process exit code; null while running or if signaled.
        message:
          type: string
          nullable: true
          description: Human-readable reason for a terminal attempt.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the attempt is running.

    TaskAttemptsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskAttempt"

    RetryResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
          example: ready

    RetryJobResponse:
      type: object
      required: [job_id, retried]
      properties:
        job_id:
          type: string
        retried:
          type: integer
          description: Number of tasks revived.
          example: 3

    CancelResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
          example: canceled

    # ── Workers ───────────────────────────────────────────────────────────────
    GPUInfo:
      type: object
      properties:
        vendor:
          type: string
        model:
          type: string
        vram_mb:
          type: integer
        count:
          type: integer

    Worker:
      type: object
      required: [id, farm_id, hostname, gpu, status, removable, registered_at, updated_at]
      properties:
        id:
          type: string
        farm_id:
          type: string
        queue_id:
          type: string
        name:
          type: string
          description: >-
            Human-readable display label (the worker's worker.name config,
            default the hostname). Distinguishes multiple workers on one host.
            May be empty for workers registered before this field existed; clients
            fall back to hostname.
        hostname:
          type: string
        ip_address:
          type: string
        compute_location:
          type: string
          description: Named compute location (e.g. "on-prem", "aws-us-east-1").
        os:
          type: string
        os_version:
          type: string
        version:
          type: string
          description: sqi-worker build version the worker self-reports; empty if unknown.
        cpu_count:
          type: integer
        ram_mb:
          type: integer
        gpu:
          $ref: "#/components/schemas/GPUInfo"
        tags:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary capability tags used for task matching.
        status:
          type: string
          enum: [online, offline, disabled]
        removable:
          type: boolean
          description: >-
            Server-authoritative flag indicating the worker may be hard-deleted
            via DELETE /workers/{id}: true for offline workers and for disabled
            workers whose last heartbeat is older than the heartbeat-timeout
            window (the machine is gone). Online and live-disabled workers are
            never removable.
        last_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CurrentTask:
      type: object
      required: [id, job_id, name, status]
      properties:
        id:
          type: string
        job_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [assigned, running]
        assigned_at:
          type: string
          format: date-time
          nullable: true

    WorkerDetail:
      allOf:
        - $ref: "#/components/schemas/Worker"
        - type: object
          required: [current_tasks]
          properties:
            current_tasks:
              type: array
              description: >-
                Every task the worker is currently executing (assigned or
                running). Empty when the worker is idle.
              items:
                $ref: "#/components/schemas/CurrentTask"

    WorkerList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    WorkerActionResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [online, offline, disabled]

    # ── Diagnostics ───────────────────────────────────────────────────────────
    DiagnosticRecord:
      type: object
      required: [ts, component, level, msg]
      properties:
        ts:
          type: string
          format: date-time
          description: Timestamp the record was emitted (RFC3339Nano).
        component:
          type: string
          description: Source component, e.g. "server" or "worker:<id>".
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        msg:
          type: string
        attrs:
          type: object
          additionalProperties:
            type: string
          description: Structured key/value attributes (e.g. task_id, job_id).

    DiagnosticLogsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRecord"

    # ── Version ───────────────────────────────────────────────────────────────
    VersionResponse:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version:
          type: string
          description: Semantic version tag, e.g. "v0.1.0" or "dev".
        commit:
          type: string
          description: Short git commit hash, or "unknown".
        build_date:
          type: string
          description: UTC build timestamp (RFC 3339), or "unknown".
        go_version:
          type: string
          description: Go toolchain version, or "unknown".

    # ── Farms ─────────────────────────────────────────────────────────────────
    Farm:
      type: object
      required: [id, name, max_concurrent_tasks, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        max_concurrent_tasks:
          type: integer
          minimum: 0
          description: 0 means unlimited.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        max_attempts:
          type: integer
          nullable: true
          description: >-
            Farm-level override for the maximum attempts per task. Null means
            inherit (server default).
        retry_delay_seconds:
          type: integer
          nullable: true
          description: >-
            Farm-level override for the delay before retrying a failed task.
            Null means inherit (server default).
        failure_limit:
          type: integer
          nullable: true
          description: >-
            Farm-level override for the number of task failures that
            auto-parks a job. Null means inherit (server default).

    CreateFarmRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        max_concurrent_tasks:
          type: integer
          minimum: 0
          default: 0
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
          description: Farm-level max-attempts retry-policy override. Null means inherit.
        retry_delay_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Farm-level retry-delay retry-policy override. Null means inherit.
        failure_limit:
          type: integer
          minimum: 0
          nullable: true
          description: Farm-level failure-limit retry-policy override. Null means inherit.

    UpdateFarmRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        max_concurrent_tasks:
          type: integer
          minimum: 0
          default: 0
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
          description: Farm-level max-attempts retry-policy override. Null means inherit.
        retry_delay_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Farm-level retry-delay retry-policy override. Null means inherit.
        failure_limit:
          type: integer
          minimum: 0
          nullable: true
          description: Farm-level failure-limit retry-policy override. Null means inherit.

    # ── Queues ────────────────────────────────────────────────────────────────
    Queue:
      type: object
      required:
        - id
        - farm_id
        - name
        - priority
        - max_concurrent_tasks
        - paused
        - created_at
        - updated_at
      properties:
        id:
          type: string
        farm_id:
          type: string
        name:
          type: string
        description:
          type: string
        priority:
          type: integer
          description: Higher value = higher scheduling priority within the farm.
        max_concurrent_tasks:
          type: integer
          minimum: 0
          description: 0 means unlimited.
        paused:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        max_attempts:
          type: integer
          nullable: true
          description: >-
            Queue-level override for the maximum attempts per task. Null
            means inherit (farm -> server default).
        retry_delay_seconds:
          type: integer
          nullable: true
          description: >-
            Queue-level override for the delay before retrying a failed
            task. Null means inherit (farm -> server default).
        failure_limit:
          type: integer
          nullable: true
          description: >-
            Queue-level override for the number of task failures that
            auto-parks a job. Null means inherit (farm -> server default).

    CreateQueueRequest:
      type: object
      required: [farm_id, name]
      properties:
        farm_id:
          type: string
        name:
          type: string
        description:
          type: string
        priority:
          type: integer
          default: 0
        max_concurrent_tasks:
          type: integer
          minimum: 0
          default: 0
        paused:
          type: boolean
          default: false
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Queue-level max-attempts retry-policy override. Null means
            inherit.
        retry_delay_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Queue-level retry-delay retry-policy override. Null means inherit.
        failure_limit:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Queue-level failure-limit retry-policy override. Null means
            inherit.

    UpdateQueueRequest:
      type: object
      required: [farm_id, name]
      properties:
        farm_id:
          type: string
        name:
          type: string
        description:
          type: string
        priority:
          type: integer
          default: 0
        max_concurrent_tasks:
          type: integer
          minimum: 0
          default: 0
        paused:
          type: boolean
          default: false
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Queue-level max-attempts retry-policy override. Null means
            inherit.
        retry_delay_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Queue-level retry-delay retry-policy override. Null means inherit.
        failure_limit:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Queue-level failure-limit retry-policy override. Null means
            inherit.

    QueueList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Storage locations ─────────────────────────────────────────────────────
    StorageLocation:
      type: object
      required: [id, name, type, roots, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [filesystem, s3, mixed]
          description: >-
            Derived from the roots (read-only): all s3:// → s3, none → filesystem, a mix → mixed.
        description:
          type: string
        roots:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of compute-location name → absolute root path for that location.
            Example: `{"on-prem": "/mnt/farm", "aws-us-east-1": "s3://bucket/root"}`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStorageLocationRequest:
      type: object
      required: [name]
      description: >-
        Supplying a `type` field returns 400; the type is derived from the roots.
      properties:
        name:
          type: string
          pattern: '^[^/\s"'']+$'
          description: >-
            Must be referenceable via a loc:// URI: no whitespace, "/", or
            quote characters.
        description:
          type: string
        roots:
          type: object
          additionalProperties:
            type: string

    UpdateStorageLocationRequest:
      type: object
      required: [name]
      description: >-
        Supplying a `type` field returns 400; the type is derived from the roots.
      properties:
        name:
          type: string
          pattern: '^[^/\s"'']+$'
          description: >-
            Must be referenceable via a loc:// URI: no whitespace, "/", or
            quote characters.
        description:
          type: string
        roots:
          type: object
          additionalProperties:
            type: string

    # ── Compute locations ─────────────────────────────────────────────────────
    ComputeLocation:
      type: object
      required: [id, name, worker_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        worker_count:
          type: integer
          minimum: 0
          description: Number of online workers currently reporting this location.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ComputeLocationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[^/\s"'']+$'
          description: >-
            Must be referenceable: no whitespace, "/", or quote characters.
        description:
          type: string

    # ── Presets ───────────────────────────────────────────────────────────────
    Preset:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [not_installed, installed, update_available]

    PresetDetail:
      allOf:
        - $ref: "#/components/schemas/Preset"
        - type: object
          properties:
            template:
              type: string
            format:
              type: string

    # ── Products ──────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [name, title, source, template, format]
      properties:
        name:
          type: string
          description: Stable slug identity, e.g. "script" or "studio/maya-render".
        title:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        source:
          type: string
          enum: [builtin, custom, installed]
        template:
          type: string
          description: Verbatim OpenJD template (YAML or JSON).
        format:
          type: string
          enum: [yaml, json]

    CreateProductRequest:
      type: object
      required: [name, title, template, format]
      properties:
        name:
          type: string
          description: >-
            Lowercase slug: letters, digits, '-', '_', with at most one '/'
            namespace separator (e.g. "studio/maya-render").
        title:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        template:
          type: string
          description: Verbatim OpenJD template (YAML or JSON).
        format:
          type: string
          enum: [yaml, json]
          default: yaml

    UpdateProductRequest:
      type: object
      required: [title, template, format]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        template:
          type: string
          description: Verbatim OpenJD template (YAML or JSON).
        format:
          type: string
          enum: [yaml, json]
          default: yaml

    SubmitProductJobRequest:
      type: object
      required: [farm_id, queue_id]
      properties:
        farm_id:
          type: string
          description: Farm to submit the job into.
        queue_id:
          type: string
          description: Queue to submit the job into.
        owner:
          type: string
          description: Human-readable owner label.
        submitter:
          type: string
          description: System or tool that submitted the job.
        priority:
          type: integer
          minimum: 1
          default: 50
          description: Job scheduling priority (higher = sooner).
        project:
          type: string
          description: Arbitrary project label for filtering.
        name:
          type: string
          description: Optional job name; overrides the template's name when set.
        max_attempts:
          type: integer
          minimum: 1
          description: >-
            Per-job override for the maximum attempts per task. Omitted means
            inherit (queue -> farm -> server default).
        retry_delay_seconds:
          type: integer
          minimum: 0
          description: >-
            Per-job override for the delay before retrying a failed task.
            Omitted means inherit (queue -> farm -> server default).
        failure_limit:
          type: integer
          minimum: 0
          description: >-
            Per-job override for the task-failure count that auto-parks the job.
            Omitted means inherit (queue -> farm -> server default).
        depends_on:
          type: array
          items:
            type: string
          description: >-
            IDs of upstream jobs this job waits for; same farm; job starts
            blocked until all complete.
        parameters:
          type: object
          additionalProperties:
            type: string
          description: >-
            Key/value pairs matching the product template's parameterDefinitions.
            Missing keys with defaults are filled automatically; missing required
            keys return 422.

    ProductParameter:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [INT, FLOAT, STRING, PATH] }
        description: { type: string }
        default: { type: string, nullable: true }
        allowed_values: { type: array, items: { type: string }, nullable: true }
        min_value: { type: string, nullable: true }
        max_value: { type: string, nullable: true }
        min_length: { type: integer, nullable: true }
        max_length: { type: integer, nullable: true }
        object_type: { type: string }
        data_flow: { type: string }
        user_interface:
          nullable: true
          type: object
          properties:
            control: { type: string, enum: [LINE_EDIT, MULTILINE_EDIT, DROPDOWN_LIST, CHECK_BOX, CHIP_INPUT, HIDDEN, SPIN_BOX] }
            label: { type: string }
            group_label: { type: string }
            decimals: { type: integer, nullable: true }
            single_step_removal: { type: boolean, nullable: true }

    # ── Usage pools ───────────────────────────────────────────────────────────
    UsagePool:
      type: object
      required: [id, name, max_concurrent, in_use, available, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        server_hint:
          type: string
          description: Optional vendor server address hint (informational only).
        max_concurrent:
          type: integer
          minimum: 1
          description: Maximum tasks that may hold a claim from this pool simultaneously.
        in_use:
          type: integer
          minimum: 0
          description: Number of slots currently claimed (active, unreleased).
        available:
          type: integer
          minimum: 0
          description: Free slots, computed as max(max_concurrent - in_use, 0).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUsagePoolRequest:
      type: object
      required: [name, max_concurrent]
      properties:
        name:
          type: string
        server_hint:
          type: string
        max_concurrent:
          type: integer
          minimum: 1

    UpdateUsagePoolRequest:
      type: object
      required: [name, max_concurrent]
      properties:
        name:
          type: string
        server_hint:
          type: string
        max_concurrent:
          type: integer
          minimum: 1

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, role, disabled, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, operator, user, read-only]
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, operator, user, read-only]
          description: Defaults to `user` when omitted.

    UserUpdate:
      type: object
      description: |
        All fields are optional; only the fields present in the request body
        are changed. Password is not updatable here — see
        `PUT /users/{id}/password`.
      properties:
        display_name:
          type: string
        role:
          type: string
          enum: [admin, operator, user, read-only]
        disabled:
          type: boolean

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # ── API keys ──────────────────────────────────────────────────────────────
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Optional expiry. Must be in the future. Omit for a key that never expires.

    ApiKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Leading characters of the raw key, for identification in a list. Never enough to reconstruct the key.
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ApiKeyCreated:
      description: The API key as returned only from the create call — includes the raw secret.
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The raw API key. Shown once, at creation, and never returned again — store it now.

    Principal:
      type: object
      required: [subject, display_name, roles, kind]
      properties:
        subject:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        kind:
          type: string

  responses:
    BadRequest:
      description: Bad request — missing or invalid parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Unauthorized:
      description: Unauthorized — missing, invalid, or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Forbidden:
      description: Forbidden — the operation is not permitted on this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Conflict:
      description: Conflict — unique constraint violated or invalid state transition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    UnprocessableEntity:
      description: Unprocessable entity — OpenJD template parse or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    TooManyRequests:
      description: |
        Rate limit exceeded. Every `/api/v1` endpoint is rate-limited per
        client IP (default token bucket: 20 req/s sustained, burst 40), so
        this response can occur on any operation — it is referenced from the
        representative `/jobs` operations rather than repeated on every
        path. Back off for at least the `Retry-After` duration before
        retrying.
      headers:
        Retry-After:
          description: Delta-seconds until the next request will be accepted.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    ServiceUnavailable:
      description: Service unavailable — the requested capability is disabled.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

# ── Paths ─────────────────────────────────────────────────────────────────────

paths:

  # ── Jobs ───────────────────────────────────────────────────────────────────

  /jobs:
    post:
      operationId: submitJob
      summary: Submit an OpenJD job
      tags: [jobs]
      description: |
        Accepts a raw OpenJD jobtemplate-2023-09 template in YAML or JSON, validates it,
        expands the parameter space into concrete tasks, and persists the job.

        The `Content-Type` header selects the template format:
        - `application/yaml`, `application/x-yaml`, `text/yaml` → YAML
        - anything else (or absent) → JSON

        `farm_id` and `queue_id` are required query parameters.

        ## Job parameters

        Job-level parameter values (matching the template's
        `parameterDefinitions`) are supplied as `param.<Name>=<value>` query
        parameters — for example:

        ```
        POST /api/v1/jobs?farm_id=f1&queue_id=q1&param.FrameStart=1&param.FrameEnd=100
        ```

        OpenAPI cannot fully model arbitrary-suffix query parameters, so they
        are documented here rather than as individual parameter entries.
        Rules:
        - Each `param.<Name>` key must match a declared `parameterDefinitions`
          entry in the template; unknown keys are rejected with **422**.
        - Parameters omitted from the request use their `default` if the
          template declares one; otherwise a **422** is returned (required
          parameter missing).
        - Values are validated against the parameter type (`INT`, `FLOAT`,
          `STRING`, `PATH`) and any `minValue`, `maxValue`, `minLength`,
          `maxLength`, or `allowedValues` constraints declared in the template.
      parameters:
        - name: farm_id
          in: query
          required: true
          schema:
            type: string
          description: Farm to submit the job into.
        - name: queue_id
          in: query
          required: true
          schema:
            type: string
          description: Queue to submit the job into.
        - name: owner
          in: query
          schema:
            type: string
          description: Human-readable owner label.
        - name: submitter
          in: query
          schema:
            type: string
          description: System or tool that submitted the job.
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
          description: Job scheduling priority (higher = sooner).
        - name: project
          in: query
          schema:
            type: string
          description: Arbitrary project label for filtering.
        - name: max_attempts
          in: query
          schema:
            type: integer
            minimum: 1
          description: >-
            Per-job override for the maximum attempts per task. Omitted means
            inherit (queue -> farm -> server default); a non-integer or
            out-of-range value is rejected with 400.
        - name: retry_delay_seconds
          in: query
          schema:
            type: integer
            minimum: 0
          description: >-
            Per-job override for the delay before retrying a failed task.
            Omitted means inherit (queue -> farm -> server default); a
            non-integer or out-of-range value is rejected with 400.
        - name: failure_limit
          in: query
          schema:
            type: integer
            minimum: 0
          description: >-
            Per-job override for the number of task failures that auto-parks
            the job (0 disables an inherited limit). Omitted means inherit
            (queue -> farm -> server default); a non-integer or out-of-range
            value is rejected with 400.
        - name: depends_on
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            IDs of upstream jobs this job waits for (same farm); repeat for
            multiple. If any listed job is not yet in a terminal-successful
            state, the new job is created with status `blocked` instead of
            `pending` and its tasks are held until every dependency
            completes. A dependency ID that does not resolve to a job in the
            same farm, or that already failed/was canceled, is rejected with
            422.
      # Note: param.<Name>=<value> query parameters are intentionally omitted
      # from this parameters list because OpenAPI 3.x does not support
      # arbitrary-suffix parameters.  Full semantics are documented in the
      # operation description above.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              description: OpenJD jobtemplate-2023-09 job template in YAML.
          application/json:
            schema:
              type: object
              description: OpenJD jobtemplate-2023-09 job template in JSON.
      responses:
        "201":
          description: Job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      operationId: listJobs
      summary: List jobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, blocked, paused, running, completed, failed, canceled]
          description: Filter by job status.
        - name: owner
          in: query
          schema:
            type: string
          description: Filter by owner.
        - name: farm_id
          in: query
          schema:
            type: string
          description: Filter by farm.
        - name: queue_id
          in: query
          schema:
            type: string
          description: Filter by queue.
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project label.
        - name: search
          in: query
          schema:
            type: string
          description: >-
            Case-insensitive substring over name, id, owner, project.
            Whitespace-separated words are matched as independent terms, ANDed
            and order-independent (e.g. "night alice" matches a job named
            "Nightly" owned by "alice").
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, priority, status, updated_at, name]
            default: created_at
          description: Field to sort results by.
        - $ref: "#/components/parameters/sortDir"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: getJob
      summary: Get a job
      tags: [jobs]
      description: Returns the job with its steps and aggregate task-status counts.
      responses:
        "200":
          description: Job detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      operationId: patchJob
      summary: Patch a job
      tags: [jobs]
      description: |
        Partial update.  Supported mutations:
        - Change `priority` (must be ≥ 1).
        - Move to a different `queue_id`.
        - `action`: `"pause"` or `"resume"` (resuming an auto-parked job
          clears `park_reason` and resets `failed_attempts`).
        - Set the per-job retry-policy overrides (`max_attempts`,
          `retry_delay_seconds`, `failure_limit`).

        Only non-null fields in the request body are applied — an explicit
        null is treated as absent, so a retry override cannot be cleared back
        to "inherit" here. Terminal jobs (completed, failed, canceled) cannot
        be modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchJobRequest"
      responses:
        "200":
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteJob
      summary: Delete a job
      tags: [jobs]
      description: |
        Delete a job and all associated data (cancels tasks if the job is still active).
      responses:
        "204":
          description: Job deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: cancelJob
      summary: Cancel a job
      tags: [jobs]
      description: |
        Cancels the job and propagates the cancellation signal to any workers
        currently executing tasks that belong to it.
      responses:
        "204":
          description: Job canceled (or already canceled — cancellation is idempotent).
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /jobs/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: retryJob
      summary: Retry a job's failed and canceled tasks
      tags: [jobs]
      description: |
        Revives every `failed` or `canceled` task in the job, resetting their
        steps and the job back to `pending` so the scheduler re-runs them in
        dependency order. Idempotent: a job with no eligible tasks returns 200
        with `retried: 0`.
      responses:
        "200":
          description: Tasks queued for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryJobResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /jobs/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: listJobTasks
      summary: List tasks for a job
      tags: [tasks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, ready, assigned, running, succeeded, failed, canceled]
          description: Filter by task status.
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, status, updated_at, name]
            default: created_at
        - $ref: "#/components/parameters/sortDir"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Tasks ──────────────────────────────────────────────────────────────────

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: getTask
      summary: Get a task
      tags: [tasks]
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: getTaskLogs
      summary: Get task logs
      tags: [tasks]
      description: |
        Returns log chunks for the latest attempt of the given task.

        **Offset-based pagination**: pass the `nats_seq` of the last received
        item as `after_nats_seq` on successive calls to walk forward without
        repeating chunks.

        **Tail streaming**: when `tail=true` the response uses chunked transfer
        encoding (`Content-Type: application/x-ndjson`).  Each flushed line is a
        newline-delimited JSON `TaskLog` object.  Streaming stops when the task
        reaches a terminal state and all buffered chunks have been delivered, or
        when the client disconnects.

        When no attempt exists yet an empty result is returned (rather than 404)
        so pollers do not need to handle that case specially.
      parameters:
        - name: after_nats_seq
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Return chunks with `nats_seq` greater than this value.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum chunks per page (1–1000).
        - name: tail
          in: query
          schema:
            type: boolean
            default: false
          description: When true, stream chunks using newline-delimited JSON.
      responses:
        "200":
          description: |
            Log chunks.  When `tail=false` the body is a `TaskLogsResponse`
            JSON object.  When `tail=true` the body is a stream of
            newline-delimited `TaskLog` JSON objects
            (`Content-Type: application/x-ndjson`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLogsResponse"
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/TaskLog"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks/{id}/attempts:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: getTaskAttempts
      summary: Get task attempt history
      tags: [tasks]
      description: |
        Returns the attempt history for a task, ordered by `attempt_number`
        ascending. When the task has no attempts yet, `items` is an empty
        array (rather than 404) so pollers do not need to handle that case
        specially.
      responses:
        "200":
          description: Attempt history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttemptsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: retryTask
      summary: Retry a task
      tags: [tasks]
      description: |
        Revives a failed or canceled task, resetting it (and its step and the
        job, when terminal) so the scheduler re-runs it in dependency order. The
        response `status` is the task's resulting state (`ready` when its step's
        dependencies are satisfied, otherwise `pending`).

        Only tasks in `failed` or `canceled` state may be retried; all other
        states are rejected with 409 Conflict.
      responses:
        "202":
          description: Task queued for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: cancelTask
      summary: Cancel a task
      tags: [tasks]
      description: |
        Cancels a single non-terminal task: closes its running attempt, signals
        the assigned worker, and releases any held usage-pool slots.

        Only non-terminal tasks (pending, ready, assigned, running) may be
        canceled; terminal tasks are rejected with 409 Conflict.
      responses:
        "202":
          description: Task canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Workers ────────────────────────────────────────────────────────────────

  /workers:
    get:
      operationId: listWorkers
      summary: List workers
      tags: [workers]
      parameters:
        - name: farm_id
          in: query
          schema:
            type: string
        - name: queue_id
          in: query
          schema:
            type: string
        - name: compute_location
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, disabled]
        - name: search
          in: query
          schema:
            type: string
          description: >-
            Case-insensitive substring over name, hostname, id,
            compute_location. Whitespace-separated words are matched as
            independent terms, ANDed and order-independent.
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [hostname, status, registered_at, last_heartbeat_at]
            default: hostname
        - $ref: "#/components/parameters/sortDir"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list of workers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workers/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      operationId: getWorker
      summary: Get a worker
      tags: [workers]
      description: Returns worker detail including capabilities and the task currently being executed, if any.
      responses:
        "200":
          description: Worker detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: removeWorker
      summary: Remove a worker
      tags: [workers]
      description: |
        Hard-deletes a worker record. Only removable workers are accepted:
        offline workers, or disabled workers whose last heartbeat is older than
        the heartbeat-timeout window (the machine is gone). Online and
        live-disabled workers are rejected with `409`. Task and attempt history
        referencing the worker is preserved by ID. A removed worker that
        reconnects simply re-registers.
      responses:
        "204":
          description: Worker removed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workers/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: disableWorker
      summary: Disable a worker
      tags: [workers]
      description: |
        Administratively pauses the worker so it receives no new task
        assignments.  Workers already in `disabled` state are accepted
        idempotently.
      responses:
        "200":
          description: Worker status after the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerActionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workers/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      operationId: enableWorker
      summary: Enable a worker
      tags: [workers]
      description: |
        Re-enables a disabled worker.  Online or offline workers are accepted
        idempotently; their status is returned unchanged.
      responses:
        "200":
          description: Worker status after the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerActionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ── Diagnostics ────────────────────────────────────────────────────────────

  /diagnostics/logs:
    get:
      operationId: getDiagnosticsLogs
      summary: Query diagnostic logs
      tags: [diagnostics]
      description: |
        Returns recent diagnostic (operational) log records from the
        server-side in-memory buffer, gathered from sqi-server and connected
        workers. The buffer is bounded and ephemeral; it is lost on restart.
        Returns 503 when diagnostics are disabled.
      parameters:
        - name: component
          in: query
          description: Exact component match, e.g. "server" or "worker:<id>".
          schema:
            type: string
        - name: level
          in: query
          description: Minimum log level to include.
          schema:
            type: string
            enum: [DEBUG, INFO, WARN, ERROR]
        - name: task_id
          in: query
          description: Match records whose attrs.task_id equals this value.
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339Nano lower bound (exclusive); ignored if unparseable.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum records to return (newest kept), clamped to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: Matching diagnostic log records (newest last).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLogsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

