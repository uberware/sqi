name: script
title: Run a Shell Command
description: Run an arbitrary shell command on a worker.
readme: |
  # Run a Shell Command

  Runs one shell command on a worker, as a single task. The smallest useful
  product in sqi, and the quickest way to check that a queue and its workers are
  actually working.

  ## Parameters

  - **Command** — the shell text to run. It is passed to `/bin/sh -c`, so pipes,
    redirection and `&&` all work.

  ## Example

  ```sh
  ffmpeg -i input.mov -c:v libx264 output.mp4
  ```

  ## Requirements

  The command runs on whichever worker picks up the task, as the account that
  worker runs under, in a session directory the worker creates. Nothing is
  staged for you: any path in the command must already be reachable from the
  worker.

  There are no host requirements, so this product will run *anywhere*. Add a
  `hostRequirements` block to the template if the command needs a particular
  platform or tool — see the [OpenJD specification](https://github.com/OpenJobDescription/openjd-specifications).
category: General
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Script
  parameterDefinitions:
    - name: Command
      type: STRING
      userInterface:
        control: MULTILINE_EDIT
        label: Command
  steps:
    - name: Run
      script:
        actions:
          onRun:
            command: /bin/sh
            args: ["-c", "{{Param.Command}}"]
