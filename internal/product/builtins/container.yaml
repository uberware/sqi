name: container
title: Run a Docker Image
description: Run a command inside a Docker image.
category: General
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Container
  parameterDefinitions:
    - name: Image
      type: STRING
      userInterface:
        control: LINE_EDIT
        label: Image
  steps:
    - name: Run
      hostRequirements:
        attributes:
          - name: attr.worker.tag.docker
            anyOf: ["true"]
      script:
        actions:
          onRun:
            command: docker
            args: ["run", "--rm", "{{Param.Image}}"]
