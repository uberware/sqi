name: command-sequence-powershell
title: Run a PowerShell Command per Frame
description: Run a PowerShell command once per frame, or once per chunk of frames, on Windows workers.
readme: |
  # Run a PowerShell Command per Frame

  Runs a PowerShell command once for every frame in a range, or once for every
  chunk of frames, on Windows workers, and tells each task which frames are
  its own. The Windows counterpart of **Run a Shell Command per Frame**, and
  the per-frame version of **Run a PowerShell Command**.

  ## Parameters

  - **Command** - the PowerShell text each task runs. It is written to a UTF-8
    `command.ps1` and run with
    `powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File`, so
    pipelines, redirection, several lines and comments all work. The frame
    variables are set by lines written ahead of it, so the command cannot
    open with a `param()` block or a `using` statement, which PowerShell
    accepts only at the very start of a script.
  - **Frame Range** - the frames to cover, in OpenJD range syntax: `1-100`,
    `1-100:2` for every second frame, or a list such as `1,5,10-20`.
  - **Frames per Task** - how many consecutive frames each task covers. One by
    default.

  ## Frame variables

  Each task's command sees four environment variables:

  - `$env:SQI_FRAME_START` - the task's first frame.
  - `$env:SQI_FRAME_END` - the task's last frame.
  - `$env:SQI_FRAMES` - the task's frames as OpenJD writes them, always
    `START-END`.
  - `$env:SQI_FRAME` - the same as `$env:SQI_FRAME_START`, the natural name at
    one frame per task.

  A task never covers a gap in the range. Frames are grouped only while they
  are consecutive, so `1-100:2` runs one frame per task whatever **Frames per
  Task** says. A frame can be any integer index: a dataset shard, a seed, a
  batch number.

  ## Example

  ```powershell
  render.exe -s $env:SQI_FRAME_START -e $env:SQI_FRAME_END D:\show\scene.file
  ```

  ## Exit status

  The same as **Run a PowerShell Command**: an explicit `exit N` exits `N`, a
  native executable's non-zero exit code is forwarded, a thrown exception or a
  cmdlet error in the last statement exits 1, and a native command writing to
  stderr is not a failure.

  ## Requirements

  Windows workers only. It uses `powershell` - Windows PowerShell 5.1, which
  ships with Windows - not `pwsh`.

  Each task runs on whichever worker picks it up, as the account that worker
  runs under. That is arbitrary code execution by design, so on a shared farm
  set **run as user** on the queue, which runs every task as an account the
  operator chooses instead; see the sqi documentation on task isolation.
  Nothing is staged for you: any path in the command must already be
  reachable from the worker.
category: General
version: 1.0.0
template:
  specificationVersion: jobtemplate-2023-09
  name: Command Sequence (PowerShell)
  extensions: [TASK_CHUNKING, SQI_CHUNK_BOUNDS]
  parameterDefinitions:
    - name: Command
      type: STRING
      userInterface:
        control: MULTILINE_EDIT
        label: Command
    - name: Frames
      type: STRING
      userInterface:
        control: LINE_EDIT
        label: Frame Range
    - name: FramesPerTask
      type: INT
      default: 1
      minValue: 1
      userInterface:
        control: SPIN_BOX
        label: Frames per Task
  steps:
    - name: Run
      hostRequirements:
        attributes:
          - name: attr.worker.os.family
            anyOf: ["windows"]
      parameterSpace:
        taskParameterDefinitions:
          - name: Frame
            type: CHUNK[INT]
            range: "{{Param.Frames}}"
            chunks:
              defaultTaskCount: "{{Param.FramesPerTask}}"
              rangeConstraint: CONTIGUOUS
      script:
        embeddedFiles:
          # script-powershell's command.ps1, byte for byte (see that product for
          # why it is a BOM-prefixed file and what the trailer does), with the
          # four frame variables assigned between the BOM and Command. Assigning
          # $env: touches none of $?, $LASTEXITCODE or $Error, so the trailer's
          # exit-status logic is unaffected; child processes inherit $env:.
          - name: command
            type: TEXT
            filename: command.ps1
            data: "\uFEFF$env:SQI_FRAME = '{{Task.Param.Frame.Start}}'\n$env:SQI_FRAME_START = '{{Task.Param.Frame.Start}}'\n$env:SQI_FRAME_END = '{{Task.Param.Frame.End}}'\n$env:SQI_FRAMES = '{{Task.Param.Frame}}'\n{{Param.Command}}\n$sqiOk = $?\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\nif (-not $sqiOk -and -not ($Error.Count -and $Error[0].FullyQualifiedErrorId -like 'NativeCommandError*')) { exit 1 }\nexit 0\n"
        actions:
          onRun:
            command: powershell
            args: ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "{{Task.File.command}}"]
