#
# V-Ray Standalone, which presets/sqi/vray-standalone-render.yaml invokes by
# bare name.
#
# The globs are the install locations Chaos documents for V-Ray Standalone
# (documentation.chaos.com, "Installation of V-Ray Standalone"):
# C:\Program Files\Chaos\V-Ray\Standalone for x64\bin on Windows and
# /usr/Chaos/V-Ray/Standalone_for_<platform>/bin on Linux. The macOS location
# could not be confirmed and is left to the PATH probe rather than guessed.
#
# No version is extracted: neither path carries one.
tag: vray
checks:
  - exe: vray
  - path_glob: "/usr/Chaos/V-Ray/Standalone_for_*/bin/vray"                    # linux
  - path_glob: 'C:\Program Files\Chaos\V-Ray\Standalone for x64\bin\vray.exe'  # windows
    os: windows
