#
# SideFX husk, the command-line USD renderer that
# presets/sqi/husk-usd-render.yaml invokes by bare name.
#
# husk has its own tag rather than relying on houdini's: the houdini detector
# keys on hython and the Houdini application, and a worker can have either
# without husk on PATH. The globs match $HFS/bin under the default install
# roots, /opt/hfs<version> on Linux and
# "C:\Program Files\Side Effects Software\Houdini <version>" on Windows. macOS
# is covered by the PATH probe only.
tag: husk
checks:
  - exe: husk
  - path_glob: "/opt/hfs*/bin/husk"                                                    # linux
  - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\husk.exe'         # windows
    os: windows
version:
  from: '(?:hfs|Houdini ?)(?P<v>[0-9]+\.[0-9]+)'
