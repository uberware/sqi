#
# Autodesk VRED, which presets/sqi/vred-render.yaml and
# vred-viewpoint-render.yaml run through the bare command `VREDCore`. VRED
# Core, the render-farm product, runs on Windows and Linux; VRED Pro is
# Windows only.
#
# Windows: C:\Program Files\Autodesk\VREDCore-<ver>\bin\WIN64\VREDCore.exe is
# the folder Autodesk's "VRED Core" basics page gives as the usual location
# (shown there for 13.1). It is unverified.
#
# A VRED Pro install is not tagged. The presets run `VREDCore`, which a VRED
# Pro install does not supply, so tagging one would hand a Pro-only worker
# VRED jobs that all fail. Running VREDPro.exe in its place is the operator's
# choice: a `VREDCore` entry in worker.commands, which also advertises the tag.
#
# Linux: the installer (VREDCore-<year>.sh --target <dir>) takes its install
# folder as an argument, and Autodesk documents only "{VRED-Cluster-Root}/bin".
# The executable is bin/VREDCore below that root (AWS's vredcore-2026 conda
# recipe launches <root>/bin/VREDCore). /opt/Autodesk/VREDCluster-<ver> is the
# example AWS's vred_render bundle gives; /opt/Autodesk/VREDCore-<ver> is the
# Windows folder name under the same root. Both are unverified guesses at a
# default. A VRED Core installed anywhere else needs the tag set by hand with
# vred=true under worker.capability_tags, or a `VREDCore` command in
# worker.commands.
#
# The version is VRED's internal one from the folder name (17.0 is VRED 2025,
# 18.0 is VRED 2026). A VRED found only on PATH carries no version.
tag: vred
checks:
  - exe: VREDCore                                                # a VREDCore command the operator provides
  - path_glob: 'C:\Program Files\Autodesk\VREDCore-*\bin\WIN64\VREDCore.exe'  # windows (VRED Core)
    os: windows
  - path_glob: "/opt/Autodesk/VREDCore-*/bin/VREDCore"           # linux (unverified)
    os: linux
  - path_glob: "/opt/Autodesk/VREDCluster-*/bin/VREDCore"        # linux (AWS sample's example, unverified)
    os: linux
version:
  from: 'VRED(?:Core|Cluster)-([0-9]+\.[0-9]+)'
# The presets run a bare `VREDCore`, which no installer puts on PATH, so the
# worker supplies one from the newest VRED Core install found here, unless the
# operator or the host already provides one.
command:
  name: VREDCore
  globs:
    - path_glob: 'C:\Program Files\Autodesk\VREDCore-*\bin\WIN64\VREDCore.exe'  # windows
      os: windows
    - path_glob: "/opt/Autodesk/VREDCore-*/bin/VREDCore"         # linux
      os: linux
    - path_glob: "/opt/Autodesk/VREDCluster-*/bin/VREDCore"      # linux
      os: linux
