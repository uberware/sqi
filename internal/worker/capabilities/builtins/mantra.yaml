#
# SideFX mantra, Houdini's legacy renderer, which
# presets/sqi/mantra-render.yaml invokes by bare name. It installs beside husk
# in $HFS/bin, so its checks mirror husk.yaml's.
#
# mantra has its own tag rather than relying on houdini's: the houdini detector
# keys on hython and the Houdini application, and a worker can have either
# without mantra on PATH. The globs match $HFS/bin under the default install
# roots: /opt/hfs<version> on Linux,
# "C:\Program Files\Side Effects Software\Houdini <version>" on Windows and
# /Applications/Houdini/Houdini<version>/Frameworks/Houdini.framework/Versions/
# Current/Resources on macOS.
#
# A default Houdini install does not put $HFS/bin on PATH, so the command block
# supplies the newest install's mantra as the `mantra` command. The Windows glob
# matches Houdini 22.0.466's layout and the macOS one Houdini 21.0.631's; the
# Linux one is inferred and unverified.
tag: mantra
checks:
  - exe: mantra
  - path_glob: "/opt/hfs*/bin/mantra"                                                    # linux
  - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\mantra.exe'         # windows
    os: windows
  - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/mantra"  # macOS
    os: darwin
version:
  from: '(?:hfs|Houdini ?)(?P<v>[0-9]+\.[0-9]+)'
command:
  name: mantra
  version:
    from: '(?:hfs|Houdini ?)(?P<v>[0-9]+\.[0-9]+)'
  globs:
    - path_glob: "/opt/hfs*/bin/mantra"                                              # linux
      os: linux
    - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\mantra.exe'   # windows
      os: windows
    - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/mantra"  # macOS
      os: darwin
