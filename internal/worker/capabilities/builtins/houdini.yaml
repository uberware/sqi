tag: houdini
checks:
  - exe: hython
  - path_glob: "/opt/hfs*/bin/houdini"                                        # linux
  - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework"  # macOS
  - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\houdini.exe'   # windows
    os: windows
  - registry: 'HKLM\SOFTWARE\Side Effects Software\Houdini'                   # windows
    os: windows
version:
  from: '(?:hfs|Houdini ?)(?P<v>[0-9]+\.[0-9]+)'
# The presets run a bare `hython`, and the Windows installer does not put it on
# PATH, so the worker supplies a default from the newest install it finds, unless
# the operator or the host already provides one. hython is in $HFS/bin, the
# folder the Linux and Windows checks above and the husk, mantra and oiiotool
# detectors look in. On macOS $HFS/bin is inside the framework bundle, at
# Frameworks/Houdini.framework/Versions/Current/Resources/bin. The Windows glob
# matches a Houdini 22.0.466 install and the macOS glob a Houdini 21.0.631
# install; the Linux glob is inferred and unverified. The version comes from the
# install folder's name: hfs<version>, Houdini<version> or "Houdini <version>".
command:
  name: hython
  globs:
    - path_glob: "/opt/hfs*/bin/hython"                                          # linux
      os: linux
    - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\hython.exe'   # windows
      os: windows
    - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/hython"  # macOS
      os: darwin
