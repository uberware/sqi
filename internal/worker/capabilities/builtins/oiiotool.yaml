#
# OpenImageIO's oiiotool, which presets/sqi/arnold-kick-tile-render.yaml's
# Assemble step and presets/sqi/oiiotool-process.yaml invoke by bare name. It
# has no fixed install location on any platform, so the PATH probe comes first.
#
# Houdini ships its own copy as hoiiotool, in $HFS/bin beside hython. Houdini
# 22.0.466's is OIIO 2.5.18, which runs the tile preset's
# `--paste:mergeroi=1:all=1` assembly and oiiotool's `@` frame wildcard. The
# Windows glob is the default install layout, as houdini.yaml uses. The Linux
# glob is inferred from the shared $HFS/bin layout and is unverified on a Linux
# install. The macOS glob is $HFS/bin inside the framework bundle, as
# houdini.yaml gives it.
#
# The version belongs to Houdini, not to OIIO, so the detector has no top-level
# version. The command's version only picks the newest install.
tag: oiiotool
checks:
  - exe: oiiotool                                                            # on PATH
  - path_glob: "/opt/hfs*/bin/hoiiotool"                                     # linux
  - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\hoiiotool.exe'   # windows
    os: windows
  - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/hoiiotool"  # macOS
    os: darwin
command:
  name: oiiotool
  version:
    from: '(?:hfs|Houdini ?)(?P<v>[0-9]+\.[0-9]+)'
  globs:
    - path_glob: "/opt/hfs*/bin/hoiiotool"                                   # linux
      os: linux
    - path_glob: 'C:\Program Files\Side Effects Software\Houdini *\bin\hoiiotool.exe'   # windows
      os: windows
    - path_glob: "/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/hoiiotool"  # macOS
      os: darwin
